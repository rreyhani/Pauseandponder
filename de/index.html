immer euch widerfuhr, es geschah um Gottes willen. Dies ist ganz ohne Zweifel die Wahrheit. Daher sollt ihr alles in Seine Hände geben, auf Ihn vertrauen und euch auf Ihn verlassen. Er wird euch gewisslich nie allein lassen. Auch hierüber besteht kein Zweifel.","Bahá’u’lláh","Licht und Gnade (Textzusammenstellung), Abschnitt 14:1, Bahá’í-Verlag","https://bibliothek.bahai.de/pubReader.php?parLangUri=comp-lam-de-14:1",200],["Schließt eure Augen gegenüber Rassenunterschieden und heißt alle mit dem Lichte der Einheit willkommen.«","Bahá’u’lláh","Das Kommen Göttlicher Gerechtigkeit, Abschnitt 55, Bahá’í-Verlag","https://bibliothek.bahai.de/pubReader.php?parLangUri=sho-adj-de-55",201],["O wandelnde Gestalt aus Staub! Ich wünsche Gemeinschaft mit dir, du aber hast kein Vertrauen zu Mir. Mit dem Schwerte deiner Empörung hast du den Baum deiner Hoffnung gefällt. Allezeit bin Ich dir nahe, doch du bist Mir immer fern.","Bahá’u’lláh","Die Verborgenen Worte, aus dem Persischen Nr. 21, Bahá’í-Verlag","https://bibliothek.bahai.de/pubReader.php?parLangUri=bah-hw-de-2.21:0_95",202],["Denn die Menschenwelt teilt sich in zwei Hälften: zum einen die Frauen, zum anderen die Männer. Erst wenn diese beiden Teile gleich stark sind, kann die Einheit der Menschheit erreicht werden und Glück und Wohl der Menschheit werden verwirklicht.","‘Abdu’l-Bahá","Die Verkündigung des Weltfriedens, Abschnitt 32:8, Bahá’í-Verlag","https://bibliothek.bahai.de/pubReader.php?parLangUri=abd-pup-de-32:8",203],["Eure Seelen sind wie Wogen auf dem Meer des Geistes. Obwohl jeder einzelne eine gesonderte Welle ist, so ist das Meer doch eines. Alle sind in Gott verbunden.","‘Abdu’l-Bahá","Ansprachen in Paris, Abschnitt 28:1, Bahá’í-Verlag","https://bibliothek.bahai.de/pubReader.php?parLangUri=abd-pt-de-28:1",204],["Denke an deinen Zustand im Schlafe. Wahrlich, Ich sage, diese Erscheinung ist das geheimnisvollste der Zeichen Gottes unter den Menschen, wollten sie doch im Herzen darüber nachsinnen. Siehe, wie das, was du im Traume geschaut hast, nach langer Zeit voll verwirklicht wird.","Bahá’u’lláh","Botschaften aus ‘Akká, Abschnitt 12:19, Bahá’í-Verlag","https://bibliothek.bahai.de/pubReader.php?parLangUri=bah-tb-de-12:19",205],["Eine dieser Lehren ist das selbständige Erforschen der Wirklichkeit, so dass die Menschenwelt aus dem Dunkel der Nachahmung errettet werde und zur Wahrheit gelange, dass sie das zerlumpte, abgetragene Kleid von vor tausend Jahren abreiße und wegwerfe und ein Gewand anlege, welches in höchster Reinheit und Heiligkeit auf dem Webstuhl der Wirklichkeit gewoben ist.","‘Abdu’l-Bahá","Sendbriefe an die Zentralorganisation für einen dauernden Frieden, Abschnitt 1:6, Bahá’í-Verlag","https://bibliothek.bahai.de/pubReader.php?parLangUri=abd-tah-de-1:6",207],["Ein schlichter, ungelernter, aber vom Heiligen Geist erfüllter Mensch ist mächtiger als ein noch so edelgeborener, hoher Gelehrter, der diese Eingebung nicht hat. Wen der göttliche Geist erzogen hat, der kann zu seiner Zeit noch andere dazu führen, dass sie den gleichen Geist empfangen.","‘Abdu’l-Bahá","Ansprachen in Paris, Abschnitt 51:10, Bahá’í-Verlag","https://bibliothek.bahai.de/pubReader.php?parLangUri=abd-pt-de-51:10",208],["So werden wir die Wahrheit in allen Religionen erblicken, denn die Wahrheit ist in allen, und die Wahrheit ist nur eine!","‘Abdu’l-Bahá","Ansprachen in Paris, Abschnitt 41:11, Bahá’í-Verlag","https://bibliothek.bahai.de/pubReader.php?parLangUri=abd-pt-de-41:11",209],["Wisse wahrlich, daß die Seele nach ihrer Trennung vom Leibe weiter fortschreitet, bis sie die Gegenwart Gottes erreicht, in einem Zustand und einer Beschaffenheit, die weder der Lauf der Zeiten und Jahrhunderte noch der Wechsel und Wandel dieser Welt ändern können.","Bahá’u’lláh","Ährenlese aus den Schriften Bahá’u’lláhs, Abschnitt 81:1, Bahá’í-Verlag","https://bibliothek.bahai.de/pubReader.php?parLangUri=bah-gwb-de-81:1",210],["Unermeßlich erhaben bist Du, o Herr! Behüte uns vor dem, was vor uns und was hinter uns liegt, was über unseren Häuptern ist, zu unserer Rechten, zu unserer Linken, unter unseren Füßen und überall, wo wir ungeschützt sind. Wahrlich, unfehlbar ist Dein Schutz über alles.","Der Báb","Der Báb – Eine Auswahl aus Seinen Schriften, Abschnitt 7.1:3, Bahá’í-Verlag","https://bibliothek.bahai.de/pubReader.php?parLangUri=bab-swb-de-7.1:3",211],["Gott ist barmherzig. In Seiner Barmherzigkeit erhört Er die Gebete all Seiner Diener, wenn es entsprechend Seiner höchsten Weisheit notwendig ist.","‘Abdu’l-Bahá","Die Verkündigung des Weltfriedens, Abschnitt 87:9, Bahá’í-Verlag","https://bibliothek.bahai.de/pubReader.php?parLangUri=abd-pup-de-87:9",213],["Das, was wir uns vorstellen, ist nicht die Wirklichkeit Gottes. Er, der Unerkennbare, der Unausdenkbare geht weit über jegliche Vorstellungskraft des Menschen hinaus.","‘Abdu’l-Bahá","Ansprachen in Paris, Abschnitt 5:10, Bahá’í-Verlag","https://bibliothek.bahai.de/pubReader.php?parLangUri=abd-pt-de-5:10",214],["Schaue in dich, dass du Mich in dir findest, mächtig, stark und selbstbestehend.","Bahá’u’lláh","Die Verborgenen Worte, aus dem Arabischen Nr. 13, Bahá’í-Verlag","https://bibliothek.bahai.de/pubReader.php?parLangUri=bah-hw-de-1.13:1",215],["Wir bitten Gott, die Menschen mit Gerechtigkeit auszustatten, damit sie sich rechtschaffen verhalten und sich für das Wohl aller Menschen einsetzen mögen, sodass alle ihr Leben in größter Zufriedenheit und größtem Wohlergehen verbringen können.","‘Abdu’l-Bahá","Die Verkündigung des Weltfriedens, Abschnitt 102:31, Bahá’í-Verlag","https://bibliothek.bahai.de/pubReader.php?parLangUri=abd-pup-de-102:31",216],["Das ist der Sinn dieser Worte: Wer auf dem Pfade des Glaubens wandelt, wer nach dem Weine der Gewissheit schmachtet, muss sich läutern von allem, was irdisch ist – sein Ohr von leerem Geschwätz, sein Gemüt von eitlem Trug, sein Herz von der Liebe zur Welt, sein Auge von allem Vergänglichen.","Bahá’u’lláh","Das Buch der Gewissheit (Kitáb-i-Íqán), Abschnitt 2, Bahá’í-Verlag","https://bibliothek.bahai.de/pubReader.php?parLangUri=bah-ki-de-2",217],["Das Wohlergehen jedes einzelnen Segments der Menschheit ist mit dem Wohlergehen des Ganzen untrennbar verbunden.","Das Universale Haus der Gerechtigkeit","Soziales Handeln (Textzusammenstellung), Abschnitt 226:1, Bahá’í-Verlag","https://bibliothek.bahai.de/pubReader.php?parLangUri=comp-sa-de-226:1",218],["Hütet euch, daß ihr euch selbst nicht euerem Nächsten vorzieht. Richtet eueren Blick auf Ihn, den Tempel Gottes unter den Menschen. Er hat in Wahrheit Sein Leben als Lösegeld für die Erlösung der Welt dargebracht. Er ist wahrlich der Allgütige, der Gnädige, der Höchste. Wenn es unter euch zu Meinungsverschiedenheiten kommt, seht Mich vor euerem Angesicht stehen und überseht gegenseitig euere Fehler um Meines Namens willen und als ein Zeichen euerer Liebe zu Meiner offenbaren, strahlenden Sache.","Bahá’u’lláh","Ährenlese aus den Schriften Bahá’u’lláhs, Abschnitt 146:1, Bahá’í-Verlag","https://bibliothek.bahai.de/pubReader.php?parLangUri=bah-gwb-de-146:1",219],["Wir müssen den hohen Entschluss fassen, uns zu erheben und alle jene Mittel zu ergreifen, die Frieden, Wohlstand und Glück, Erkenntnis, Kultur und Industrie, Würde, Wert und Stufe der gesamten Menschheit voranbringen.","‘Abdu’l-Bahá","Das Geheimnis göttlicher Kultur, Abschnitt 8, Bahá’í-Verlag","https://bibliothek.bahai.de/pubReader.php?parLangUri=abd-sdc-de-8",220],["Das Wort Gottes ist eine Lampe, deren Licht der Satz ist: Ihr seid die Früchte eines Baumes und die Blätter eines Zweiges. Verkehrt miteinander in inniger Liebe und Eintracht, in Freundschaft und Verbundenheit.","Bahá’u’lláh","Ährenlese aus den Schriften Bahá’u’lláhs, Abschnitt 132:3, Bahá’í-Verlag","https://bibliothek.bahai.de/pubReader.php?parLangUri=bah-gwb-de-132:3",221],["Des Menschen flüchtige Stunden auf Erden vergehen rasch, und das wenige, was bleibt, wird ein Ende haben; was aber kein Ende hat und immer währen wird, ist die Frucht seiner Dienstbarkeit an der göttlichen Schwelle.","‘Abdu’l-Bahá","Briefe und Botschaften, Abschnitt 194:2, Bahá’í-Verlag","https://bibliothek.bahai.de/pubReader.php?parLangUri=abd-swa-de-194:2",222],["O ihr Reichen auf Erden! Die Armen in eurer Mitte sind Mein Pfand; hütet Mein Pfand und trachtet nicht nur nach eurem Wohlergehen.","Bahá’u’lláh","Die Verborgenen Worte, aus dem Persischen Nr. 54, Bahá’í-Verlag","https://bibliothek.bahai.de/pubReader.php?parLangUri=bah-hw-de-2.54:0_128",223],["Diese strenge Ermahnung wiederholt Er in Seinem letzten Werk, Seinem Buch des Bundes: »Wahrlich, Ich sage: Die Zunge ist dazu da, vom Guten zu sprechen; befleckt sie nicht mit übler Rede. Gott hat vergeben, was vergangen ist. Von nun an sage jeder, was sich schickt, und enthalte sich der üblen Nachrede, der Schmähung und all dessen, was andere Menschen betrübt.«","Bahá’u’lláh","Kitáb-i-Aqdas, Abschnitt 8.37:2, Bahá’í-Verlag","https://bibliothek.bahai.de/pubReader.php?parLangUri=bah-ka-de-8.37:2",224],["Dein Name ist meine Heilung, o mein Gott, Dein Gedenken meine Arznei, Deine Nähe meine Hoffnung, und die Liebe zu Dir mein Gefährte.","Bahá’u’lláh","Gebete und Meditationen, Abschnitt 170:1, Bahá’í-Verlag","https://bibliothek.bahai.de/pubReader.php?parLangUri=bah-pm-de-170:1",225],["O Sohn des Geistes! Reich erschuf Ich dich, warum machst du dich selbst arm? Edel erschuf Ich dich, warum erniedrigst du dich selbst?","Bahá’u’lláh","Die Verborgenen Worte, aus dem Arabischen Nr. 13, Bahá’í-Verlag","https://bibliothek.bahai.de/pubReader.php?parLangUri=bah-hw-de-1.13:0_15",226],["Ein Mensch, der Gutes tut und nicht darüber spricht, ist auf dem Wege zur Vervollkommnung.","‘Abdu’l-Bahá","Ansprachen in Paris, Abschnitt 1:11, Bahá’í-Verlag","https://bibliothek.bahai.de/pubReader.php?parLangUri=abd-pt-de-1:11",227],["Wahrlich, Gott machte das Leid zum Morgentau auf Seiner grünen Au und zum Docht für Seine Lampe, die Erde und Himmel erleuchtet.","Bahá’u’lláh","Anspruch und Verkündigung, Abschnitt 1:258, Bahá’í-Verlag","https://bibliothek.bahai.de/pubReader.php?parLangUri=bah-slh-de-1:258",228],["»Ich schwöre bei Meinem Leben! Meine Geliebten kann nur das befallen, was ihnen von Vorteil ist. Dies bezeugt die Feder Gottes, des Mächtigsten, des Allherrlichen, des Meistgeliebten.«","Bahá’u’lláh","Das Kommen Göttlicher Gerechtigkeit, Abschnitt 113, Bahá’í-Verlag","https://bibliothek.bahai.de/pubReader.php?parLangUri=sho-adj-de-113",229],["Wie weit sich die materielle Welt auch entwickelt, sie kann das Glück der Menschheit nicht sicherstellen. Nur wenn die materielle und die geistige Kultur miteinander verbunden und in Einklang gebracht werden, wird das Glück gesichert.","‘Abdu’l-Bahá","Die Verkündigung des Weltfriedens, Abschnitt 44:14, Bahá’í-Verlag","https://bibliothek.bahai.de/pubReader.php?parLangUri=abd-pup-de-44:14",230],["O Gott, führe mich, beschütze mich, mache mich zu einer leuchtenden Lampe und zu einem strahlenden Stern. Du bist der Mächtige und der Kraftvolle.","‘Abdu’l-Bahá","Bahá’í-Gebete, Abschnitt 206:1, Bahá’í-Verlag","https://bibliothek.bahai.de/pubReader.php?parLangUri=prayer-bg-de-206:1",231],["Setze all dein Vertrauen in die Gnade Gottes, deines Herrn. Laß Ihn deine Zuversicht sein in allem, was du tust, und sei Seinem Willen ergeben.","Bahá’u’lláh","Anspruch und Verkündigung, Abschnitt 5:65, Bahá’í-Verlag","https://bibliothek.bahai.de/pubReader.php?parLangUri=bah-slh-de-5:65",232],["Wenn folglich ein Angehöriger des Staatskörpers krank wird, werden in Wirklichkeit – durch Mitgefühl und Anteilnahme – alle betroffen sein, weil dieser eine Kranke ein Mitglied einer Gruppe von Mitgliedern, ein Teil des Ganzen ist.","‘Abdu’l-Bahá","Die Verkündigung des Weltfriedens, Abschnitt 102:3, Bahá’í-Verlag","https://bibliothek.bahai.de/pubReader.php?parLangUri=abd-pup-de-102:3",234],["Wenn jemand über einen Abwesenden Schlechtes sagt, führt das nur zu dem einen Ergebnis: Er dämpft die Begeisterung der Freunde und macht sie gleichgültig.","‘Abdu’l-Bahá","Briefe und Botschaften, Abschnitt 193:8, Bahá’í-Verlag","https://bibliothek.bahai.de/pubReader.php?parLangUri=abd-swa-de-193:8",235],["Ich möchte euch klar machen, dass materieller und geistiger Fortschritt zwei sehr verschiedene Dinge sind, und dass nur dann, wenn der materielle Fortschritt mit Geistigkeit Hand in Hand geht, wirklicher Fortschritt kommen und der größte Friede in der Welt regieren kann.","‘Abdu’l-Bahá","Ansprachen in Paris, Abschnitt 34:6, Bahá’í-Verlag","https://bibliothek.bahai.de/pubReader.php?parLangUri=abd-pt-de-34:6",236],["Religion und Wissenschaft sind die beiden Flügel, auf denen sich die menschliche Geisteskraft zur Höhe erheben und mit denen die menschliche Seele Fortschritte machen kann.","‘Abdu’l-Bahá","Ansprachen in Paris, Abschnitt 44:14, Bahá’í-Verlag","https://bibliothek.bahai.de/pubReader.php?parLangUri=abd-pt-de-44:14",237],["Er muss sich von Vorstellungen abwenden, die die menschliche Seele herabsetzen, sodass er Tag für Tag und Stunde für Stunde höher zur geistigen Wahrnehmung des Fortbestehens der menschlichen Wirklichkeit aufsteigen kann.","Shoghi Effendi","Die Verkündigung des Weltfriedens, Abschnitt 38:7, Bahá’í-Verlag","https://bibliothek.bahai.de/pubReader.php?parLangUri=abd-pup-de-38:7",238],["Die Zeit wird kommen, in der die Frauen sich völlig gleichberechtigt an den Angelegenheiten der Welt beteiligen, selbstsicher und kompetent die große Bühne von Recht und Politik betreten, und dann wird der Krieg enden, denn die Frau wird sich ihm in den Weg stellen und ihn verhindern.","‘Abdu’l-Bahá","Die Verkündigung des Weltfriedens, Abschnitt 51:6, Bahá’í-Verlag","https://bibliothek.bahai.de/pubReader.php?parLangUri=abd-pup-de-51:6",239],["Der wahre Unterschied zwischen den Menschen besteht in den göttlichen Gaben und den Eingebungen des Heiligen Geistes. Wenn der Mensch nicht zum Empfänger der himmlischen Gaben und der geistigen Segnungen wird, verbleibt er auf der Stufe des Tieres.","‘Abdu’l-Bahá","Die Verkündigung des Weltfriedens, Abschnitt 103:9, Bahá’í-Verlag","https://bibliothek.bahai.de/pubReader.php?parLangUri=abd-pup-de-103:9",240],["Ich ermahne euch ernstlich: Lasst eure Herzen nicht durch die materiellen Dinge dieser Welt in Fesseln schlagen. Ich heiße euch, nicht als Hörige der Materie selbstzufrieden auf dem Bette der Nachlässigkeit zu liegen, sondern euch zu erheben und euch von ihren Banden frei zu machen!","‘Abdu’l-Bahá","Ansprachen in Paris, Abschnitt 9:16, Bahá’í-Verlag","https://bibliothek.bahai.de/pubReader.php?parLangUri=abd-pt-de-9:16",241],["»O Meine Diener! Sorgt euch nicht, wenn in diesen Tagen und auf diesem irdischen Planeten Dinge gegen euer Wünschen von Gott verordnet und kundgetan wurden, denn Tage seliger Freude und himmlischen Entzückens erwarten euch.","Bahá’u’lláh","Das Kommen Göttlicher Gerechtigkeit, Abschnitt 113, Bahá’í-Verlag","https://bibliothek.bahai.de/pubReader.php?parLangUri=sho-adj-de-113",242],["Menschen, die nicht leiden, erfahren keine Vervollkommnung. Die vom Gärtner am stärksten beschnittene Pflanze wird, wenn der Sommer kommt, die schönsten Blüten und die üppigsten Früchte bringen.","‘Abdu’l-Bahá","Ansprachen in Paris, Abschnitt 14:9, Bahá’í-Verlag","https://bibliothek.bahai.de/pubReader.php?parLangUri=abd-pt-de-14:9",243],["Seid wie die Finger einer Hand, die Glieder eines Leibes.","Bahá’u’lláh","Ährenlese aus den Schriften Bahá’u’lláhs, Abschnitt 72:4, Bahá’í-Verlag","https://bibliothek.bahai.de/pubReader.php?parLangUri=bah-gwb-de-72:4",244],["Das soll verdeutlichen, dass Gott allmächtig ist, aber Seine Größe sich nicht auf menschliches Begriffsvermögen begrenzen lässt. Wir können Gott keine Grenze setzen. Der Mensch ist begrenzt, aber die Welt des Göttlichen ist unbegrenzt.","‘Abdu’l-Bahá","Die Verkündigung des Weltfriedens, Abschnitt 93:15, Bahá’í-Verlag","https://bibliothek.bahai.de/pubReader.php?parLangUri=abd-pup-de-93:15",245],["Das wichtigste Prinzip der göttlichen Philosophie ist das Einssein der Menschenwelt, die Einheit der Menschheit, der Bund, der Ost und West vereinigt, das Band der Liebe, das die Menschenherzen verbindet.","‘Abdu’l-Bahá","Die Verkündigung des Weltfriedens, Abschnitt 12:6, Bahá’í-Verlag","https://bibliothek.bahai.de/pubReader.php?parLangUri=abd-pup-de-12:6",246],["Gibt es einen Befreier von Schwierigkeiten außer Gott? Sprich: Gelobt sei Gott! Er ist Gott! Alle sind Seine Diener und alle stehen unter Seinem Befehl!","Der Báb","Gott geht vorüber, Abschnitt 183, Bahá’í-Verlag","https://bibliothek.bahai.de/pubReader.php?parLangUri=sho-gpb-de-183",247],["Gott ist Liebe; Gott trachtet nach Verbundenheit, Reinheit, Heiligkeit und Langmut; dies sind die Attribute des Göttlichen.","‘Abdu’l-Bahá","Die Verkündigung des Weltfriedens, Abschnitt 97:4, Bahá’í-Verlag","https://bibliothek.bahai.de/pubReader.php?parLangUri=abd-pup-de-97:4",248],["Wo Liebe fehlt, nimmt Feindschaft zu. Wo Liebe ausgeübt wird, wird die Liebe stärker und Feindschaft schwindet dahin.","‘Abdu’l-Bahá","Die Verkündigung des Weltfriedens, Abschnitt 3:9, Bahá’í-Verlag","https://bibliothek.bahai.de/pubReader.php?parLangUri=abd-pup-de-3:9",249],["So mächtig ist das Licht der Einheit, dass es die ganze Erde erleuchten kann.","Bahá’u’lláh","Brief an den Sohn des Wolfes, Abschnitt 19, Bahá’í-Verlag","https://bibliothek.bahai.de/pubReader.php?parLangUri=bah-esw-de-19",250],["Die Menschheit braucht heute internationale Einheit und Versöhnung. Um diese großartigen, grundlegenden Prinzipien einzuführen, ist eine treibende Kraft nötig. Es versteht sich von selbst, dass die Einheit der Menschheit und der Größte Frieden nicht mit materiellen Mitteln herbeigeführt werden können.","‘Abdu’l-Bahá","Die Verkündigung des Weltfriedens, Abschnitt 5:4, Bahá’í-Verlag","https://bibliothek.bahai.de/pubReader.php?parLangUri=abd-pup-de-5:4",251],["Leichtfertigkeit verliert ihren Reiz und führt schließlich zu Langeweile und Leere, wogegen echte Fröhlichkeit, Freude und Humor ebenso zu einem ausgewogenen Leben gehören wie ernste Gedanken, Mitgefühl und bescheidene Dienstbarkeit vor Gott – Merkmale, die das Leben bereichern und zu seiner Ausstrahlung beitragen.","Das Universale Haus der Gerechtigkeit","Ein keusches, heiliges Leben (Textzusammenstellung), Abschnitt 24:1, Bahá’í-Verlag","https://bibliothek.bahai.de/pubReader.php?parLangUri=comp-chl-de-24:1",252],["Wir stehen an der Schwelle eines Zeitalters, dessen Zuckungen zugleich die Todesqualen der alten Ordnung und die Geburtswehen der neuen künden.","Shoghi Effendi","Die Weltordnung Bahá’u’lláhs, Abschnitt 7:20, Bahá’í-Verlag","https://bibliothek.bahai.de/pubReader.php?parLangUri=sho-wob-de-7:20",253],["Ihr seid Ausdruck und Spiegel eurer Taten und Handlungen.","‘Abdu’l-Bahá","Die Verkündigung des Weltfriedens, Abschnitt 3:9, Bahá’í-Verlag","https://bibliothek.bahai.de/pubReader.php?parLangUri=abd-pup-de-3:9",254],["Menschliche Rede will ihrem Wesen nach Einfluß üben und bedarf deshalb der Mäßigung.","Bahá’u’lláh","Botschaften aus ‘Akká, Abschnitt 9:20, Bahá’í-Verlag","https://bibliothek.bahai.de/pubReader.php?parLangUri=bah-tb-de-9:20",255],["Eure wichtigste Pflicht ist heute, euren Charakter zu veredeln, eure Sitten zu bessern und euer Verhalten zu ordnen.","Bahá’u’lláh","Briefe und Botschaften, Abschnitt 2:16, Bahá’í-Verlag","https://bibliothek.bahai.de/pubReader.php?parLangUri=abd-swa-de-2:16",256],["Gott wird das Gebet eines jeden Dieners erhören, wenn es inständig ist. Seine Barmherzigkeit ist umfassend und unbegrenzt. Er erhört die Gebete all Seiner Diener.","‘Abdu’l-Bahá","Die Verkündigung des Weltfriedens, Abschnitt 87:6, Bahá’í-Verlag","https://bibliothek.bahai.de/pubReader.php?parLangUri=abd-pup-de-87:6",257],["So ist gesagt: »Nicht alles, was ein Mensch weiß, kann enthüllt werden, noch kann alles, was er enthüllen kann, als zeitgemäß angesehen werden, noch kann jede zeitgemäße Äußerung als tauglich für die Fassungskraft der Hörer erachtet werden.«","Bahá’u’lláh","Ährenlese aus den Schriften Bahá’u’lláhs, Abschnitt 89:3, Bahá’í-Verlag","https://bibliothek.bahai.de/pubReader.php?parLangUri=bah-gwb-de-89:3",258],["Seht keine Fremden, seht vielmehr alle Menschen als Freunde; denn Liebe und Einheit fallen schwer, wenn ihr den Blick auf das Andersartige heftet.","‘Abdu’l-Bahá","Briefe und Botschaften, Abschnitt 8:7, Bahá’í-Verlag","https://bibliothek.bahai.de/pubReader.php?parLangUri=abd-swa-de-8:7",259],["Solange die Gleichberechtigung von Mann und Frau nicht vollständig verwirklicht ist, kann sich die menschliche Gesellschaft nicht zur Reife entwickeln.","‘Abdu’l-Bahá","Die Verkündigung des Weltfriedens, Abschnitt 32:7, Bahá’í-Verlag","https://bibliothek.bahai.de/pubReader.php?parLangUri=abd-pup-de-32:7",260],["Aber durch, eure Taten könnt ihr euch von den anderen unterscheiden. Durch sie kann der Glanz eures Lichtes über die ganze Erde verbreitet werden.","Bahá’u’lláh","Das Kommen Göttlicher Gerechtigkeit, Abschnitt 39, Bahá’í-Verlag","https://bibliothek.bahai.de/pubReader.php?parLangUri=sho-adj-de-39",261],["Lasst Taten, nicht Worte eure Zier sein!","Bahá’u’lláh","Die Verborgenen Worte, aus dem Persischen Nr. 5, Bahá’í-Verlag","https://bibliothek.bahai.de/pubReader.php?parLangUri=bah-hw-de-2.5:1",262],["Befreie dich aus den Banden dieser Welt und löse deine Seele aus dem Gefängnis des Selbstes. Ergreife die Gelegenheit, denn niemals kehrt sie wieder.","Bahá’u’lláh","Die Verborgenen Worte, aus dem Persischen Nr. 40, Bahá’í-Verlag","https://bibliothek.bahai.de/pubReader.php?parLangUri=bah-hw-de-2.40:1",263],["Gräme dich weder über die Misslichkeiten und die Not dieser niederen Welt noch freue dich in Zeiten ruhigen Behagens; denn beides wird vergehen.","‘Abdu’l-Bahá","Briefe und Botschaften, Abschnitt 150:1, Bahá’í-Verlag","https://bibliothek.bahai.de/pubReader.php?parLangUri=abd-swa-de-150:1",264],["Wenn Gewissensfreiheit, Gedankenfreiheit und Redefreiheit herrschen, das heißt, wenn jeder gemäß seinen Idealen seiner eigenen Überzeugung Ausdruck verleihen kann, sind Entwicklung und Wachstum unausweichlich.","‘Abdu’l-Bahá","Die Verkündigung des Weltfriedens, Abschnitt 71:1, Bahá’í-Verlag","https://bibliothek.bahai.de/pubReader.php?parLangUri=abd-pup-de-71:1",265],["Was das Staatswesen heute braucht, ist Liebe und Einheit. Ohne sie kann weder Fortschritt noch Wohlstand erreicht werden.","‘Abdu’l-Bahá","Die Verkündigung des Weltfriedens, Abschnitt 61:1, Bahá’í-Verlag","https://bibliothek.bahai.de/pubReader.php?parLangUri=abd-pup-de-61:1",266],["Die Weisheit dieser Regelung liegt im Wandel der Zeit, denn Veränderung ist ein unabdingbares, wesentliches Merkmal dieser Welt, ein Attribut von Zeit und Raum.","Bahá’u’lláh","Kitáb-i-Aqdas, Abschnitt 2:9, Bahá’í-Verlag","https://bibliothek.bahai.de/pubReader.php?parLangUri=bah-ka-de-2:9",267],["Schaut nicht auf die Gegenwart. Richtet euren Blick auf künftige Zeiten. Wie klein ist der Same zu Beginn, aber am Ende ist er ein mächtiger Baum. Schaut nicht auf den Samen, schaut auf den Baum, auf seine Blüten, Blätter und Früchte.","‘Abdu’l-Bahá","Briefe und Botschaften, Abschnitt 40:3, Bahá’í-Verlag","https://bibliothek.bahai.de/pubReader.php?parLangUri=abd-swa-de-40:3",268],["Ausdauer ist eine wesentliche Voraussetzung. Bei jedem Vorhaben werden Festigkeit und Standhaftigkeit zweifelsohne zu guten Ergebnissen führen; sonst besteht es nur ein paar Tage und wird dann wieder aufgegeben.","‘Abdu’l-Bahá","Briefe und Botschaften, Abschnitt 124:1, Bahá’í-Verlag","https://bibliothek.bahai.de/pubReader.php?parLangUri=abd-swa-de-124:1",269],["Ich bitte Dich flehentlich, stehe mir allezeit, in jeder Lage bei und hilf mir, da ich nach Deiner urewigen Gunst aus dem Himmel Deiner Gnade trachte.","Bahá’u’lláh","Gebete und Meditationen, Abschnitt 173:2, Bahá’í-Verlag","https://bibliothek.bahai.de/pubReader.php?parLangUri=bah-pm-de-173:2",270],["Das Wesen all dessen, was Wir für dich offenbarten, ist die Gerechtigkeit. Sie bedeutet für den Menschen, daß er sich von eitlem Wahn und Nachahmung frei mache, mit dem Auge der Einheit das herrliche Werk Seiner Hände schaue und mit forschendem Blick in alles eindringe.","Bahá’u’lláh","Botschaften aus ‘Akká, Abschnitt 10:22, Bahá’í-Verlag","https://bibliothek.bahai.de/pubReader.php?parLangUri=bah-tb-de-10:22",272],["Vergeudet eure Stunden nicht in Faulheit und Müßiggang, sondern tut, was euch und anderen nützt.","Bahá’u’lláh","Kitáb-i-Aqdas, Abschnitt 4:33, Bahá’í-Verlag","https://bibliothek.bahai.de/pubReader.php?parLangUri=bah-ka-de-4:33",273],["Das erste, leibliche Leben hat ein Ende, denn Gott spricht: »Jede Seele schmeckt den Tod.« Aber das zweite Leben, das aus der Erkenntnis Gottes entsteht, kennt keinen Tod, wie offenbart wurde: »Wir werden ihn wahrlich zu einem guten Leben erwecken.«","Bahá’u’lláh","Edelsteine göttlicher Geheimnisse, Abschnitt 65, Bahá’í-Verlag","https://bibliothek.bahai.de/pubReader.php?parLangUri=bah-gdm-de-65",274],["Wer zum Volke Gottes gehört, hat nur den Ehrgeiz, die Welt zu erneuern, ihr Leben zu veredeln und ihre Völker zu beleben.","Bahá’u’lláh","Ährenlese aus den Schriften Bahá’u’lláhs, Abschnitt 126:2, Bahá’í-Verlag","https://bibliothek.bahai.de/pubReader.php?parLangUri=bah-gwb-de-126:2",275],["Am meisten mangelt es der Menschheit an Zusammenarbeit und Gegenseitigkeit. Je ausgeprägter die Bande der Freundschaft und Solidarität unter den Menschen sind, desto großartiger werden konstruktive Kräfte und Errungenschaften auf allen Ebenen menschlichen Handelns.","‘Abdu’l-Bahá","Die Verkündigung des Weltfriedens, Abschnitt 108:2, Bahá’í-Verlag","https://bibliothek.bahai.de/pubReader.php?parLangUri=abd-pup-de-108:2",276],["Gott hat den Menschen mit Forschergeist ausgestattet, durch den er die Wahrheit sehen und erkennen kann. Er hat den Menschen das Hörvermögen gegeben, damit er die Botschaft der Wahrheit hören kann, und Er hat ihm den Verstand verliehen, durch den er Dinge selbst entdecken kann.","‘Abdu’l-Bahá","Die Verkündigung des Weltfriedens, Abschnitt 97:8, Bahá’í-Verlag","https://bibliothek.bahai.de/pubReader.php?parLangUri=abd-pup-de-97:8",277],["Es gibt nichts Größeres und Gesegneteres als die Liebe Gottes. Sie schenkt den Kranken Heilung, den Verwundeten Balsam, allen Menschen Freude und Trost, und nur durch sie kann der Mensch zu ewigem Leben kommen.","‘Abdu’l-Bahá","Ansprachen in Paris, Abschnitt 27:6, Bahá’í-Verlag","https://bibliothek.bahai.de/pubReader.php?parLangUri=abd-pt-de-27:6",278],["Die Quelle des Mutes und der Macht ist die Verbreitung des Wortes Gottes und die Standhaftigkeit in Seiner Liebe.","Bahá’u’lláh","Botschaften aus ‘Akká, Abschnitt 10:10, Bahá’í-Verlag","https://bibliothek.bahai.de/pubReader.php?parLangUri=bah-tb-de-10:10",279],["Halte dir Gottes unfehlbare Waage vor Augen und wäge auf ihr deine Werke jeden Tag, jeden Augenblick deines Lebens, als stündest du in Seiner Gegenwart. Ziehe dich selbst zur Rechenschaft, ehe du zur Abrechnung gerufen wirst an dem Tage, da aus Furcht vor Gott kein Mensch die Kraft haben wird, aufrecht zu stehen, dem Tage, an dem die Herzen der Achtlosen erzittern.","Bahá’u’lláh","Anspruch und Verkündigung, Abschnitt 5:69, Bahá’í-Verlag","https://bibliothek.bahai.de/pubReader.php?parLangUri=bah-slh-de-5:69",280],["O Sohn des Seins! Nicht auf diese Welt richte dein Sinnen und Trachten, denn im Feuer prüfen Wir das Gold und mit Gold prüfen Wir Unsere Diener.","Bahá’u’lláh","Die Verborgenen Worte, aus dem Arabischen Nr. 55, Bahá’í-Verlag","https://bibliothek.bahai.de/pubReader.php?parLangUri=bah-hw-de-1.55:0_57",281],["Er muß sein Herz so läutern, daß kein Rest von Liebe oder Haß darin verbleibt, damit weder Liebe ihn blind zum Irrtum leite noch Haß ihn von der Wahrheit scheuche.","Bahá’u’lláh","Ährenlese aus den Schriften Bahá’u’lláhs, Abschnitt 125:1, Bahá’í-Verlag","https://bibliothek.bahai.de/pubReader.php?parLangUri=bah-gwb-de-125:1",282],["Die materielle Zivilisation ist wie das Glas um die Lampe, die göttliche Kultur ist die Lampe selbst. Das Glas ohne Licht ist dunkel. Die materielle Zivilisation ist wie der Leib. Sei er auch noch so anmutig, elegant und schön, so ist er dennoch tot. Die göttliche Kultur ist wie der Geist; der Leib erhält sein Leben durch den Geist, sonst ist er ein Leichnam.","‘Abdu’l-Bahá","Sendbriefe an die Zentralorganisation für einen dauernden Frieden, Abschnitt 1:21, Bahá’í-Verlag","https://bibliothek.bahai.de/pubReader.php?parLangUri=abd-tah-de-1:21",283],["Erst wenn die Lampe des Suchens, des ernsten Strebens, des sehnlichen Verlangens, der leidenschaftlichen Ergebung, der glühenden Liebe, der Verzückung und Ekstase im Herzen des Suchers entzündet ist und der Hauch der Gnade Gottes über seine Seele weht, wird das Dunkel des Irrtums vertrieben, werden die Nebel des Zweifels und der Ängste zerstreut, bis die Lichter der Erkenntnis und Gewißheit sein Wesen einhüllen.","Bahá’u’lláh","Ährenlese aus den Schriften Bahá’u’lláhs, Abschnitt 125:6, Bahá’í-Verlag","https://bibliothek.bahai.de/pubReader.php?parLangUri=bah-gwb-de-125:6",284],["Wahrlich, wir sind schwach. Mache uns stark. Wir sind arm. Hilf uns mit den Schätzen Deiner Freigebigkeit. Wir sind tot, belebe uns durch den Odem des Heiligen Geistes. Uns fehlt Geduld in Prüfungen und Langmut; erlaube uns, das Licht der Einheit zu erlangen.","‘Abdu’l-Bahá","Die Verkündigung des Weltfriedens, Abschnitt 93:18, Bahá’í-Verlag","https://bibliothek.bahai.de/pubReader.php?parLangUri=abd-pup-de-93:18",285],["Deine liebende Vorsehung umschließt alles Erschaffene in den Himmeln und auf Erden, und Deine Vergebung überragt die ganze Schöpfung.","Der Báb","Der Báb – Eine Auswahl aus Seinen Schriften, Abschnitt 7.9:2, Bahá’í-Verlag","https://bibliothek.bahai.de/pubReader.php?parLangUri=bab-swb-de-7.9:2",286],["So ist offensichtlich, dass der Mensch die besondere ihm bestimmte Aufgabe hat, sich aus den natureigenen Unzulänglichkeiten zu erretten und zu erlösen und die geistigen Tugenden des Göttlichen anzunehmen.","‘Abdu’l-Bahá","Die Verkündigung des Weltfriedens, Abschnitt 110:13, Bahá’í-Verlag","https://bibliothek.bahai.de/pubReader.php?parLangUri=abd-pup-de-110:13",287],["Die Antwort auch dieser Frage ist in diesem gesegneten und erhabenen Wort zu finden: »Sorgt euch um die Nöte eurer Zeit, und konzentriert euch auf ihre Bedürfnisse.«","Bahá’u’lláh","Das Tabernakel der Einheit, Abschnitt 2:16, Bahá’í-Verlag","https://bibliothek.bahai.de/pubReader.php?parLangUri=bah-tu-de-2:16",289],["Würdest du über diese Welt nachdenken und erkennen, wie vergänglich die Dinge sind, die ihr zugehören, so würdest du keinen anderen Weg dem Weg des Dienstes für die Sache deines Herrn vorziehen.","Bahá’u’lláh","Ährenlese aus den Schriften Bahá’u’lláhs, Abschnitt 144:2, Bahá’í-Verlag","https://bibliothek.bahai.de/pubReader.php?parLangUri=bah-gwb-de-144:2",290],["Lasst die Freunde in jedem Fall rücksichtsvoll und unendlich gütig sein. Lasst sie nie den Mut verlieren wegen der Bosheit der Leute, ihrer Angriffslust und ihrem Hass, wie schlimm das auch sei. Wenn andere ihre Speere nach euch schleudern, so bietet ihnen Milch und Honig als Gegengabe. Wenn sie euch das Leben vergiften, versüßt ihnen die Seele. Wenn sie euch schaden, lehrt sie, wie man getröstet wird. Wenn sie euch eine Wunde schlagen, seid Balsam für ihre Schmerzen. Wenn sie nach euch stechen, setzt ihnen einen erfrischenden Becher an die Lippen.","‘Abdu’l-Bahá","Briefe und Botschaften, Abschnitt 8:8, Bahá’í-Verlag","https://bibliothek.bahai.de/pubReader.php?parLangUri=abd-swa-de-8:8",291],["Was die Grenzen der Mäßigung überschreitet, hört auf, wohltätigen Einfluß auszuüben.","Bahá’u’lláh","Botschaften aus ‘Akká, Abschnitt 11:18, Bahá’í-Verlag","https://bibliothek.bahai.de/pubReader.php?parLangUri=bah-tb-de-11:18",292],["Die Menschen brauchen nicht nur materielles Wohlergehen. Was sie dringend brauchen, ist ein Verständnis davon, wie sie ihr Leben gestalten sollen – sie müssen wissen, wer sie sind, zu welchem Zweck sie existieren und wie sie miteinander umgehen sollen; und wenn sie dann die Antworten auf diese Fragen kennen, muss ihnen geholfen werden, diese Antworten schrittweise auf ihr alltägliches Verhalten anzuwenden.","Das Universale Haus der Gerechtigkeit","Soziales Handeln (Textzusammenstellung), Abschnitt 78:1, Bahá’í-Verlag","https://bibliothek.bahai.de/pubReader.php?parLangUri=comp-sa-de-78:1",293],["Wisst ihr, warum Wir euch alle aus dem gleichen Staub erschufen? Damit sich keiner über den anderen erhebe.","Bahá’u’lláh","Die Verborgenen Worte, aus dem Arabischen Nr. 68, Bahá’í-Verlag","https://bibliothek.bahai.de/pubReader.php?parLangUri=bah-hw-de-1.68:1",294],["Bemüht euch, daß ihr diese überragende, diese höchst erhabene Stufe erreicht, die Stufe, welche der ganzen Menschheit die Gewähr für Schutz und Sicherheit bieten kann. Dieses Ziel überragt jedes andere Ziel, dieses Streben ist der Fürst allen Strebens.","Bahá’u’lláh","Ährenlese aus den Schriften Bahá’u’lláhs, Abschnitt 132:4, Bahá’í-Verlag","https://bibliothek.bahai.de/pubReader.php?parLangUri=bah-gwb-de-132:4",295],["Seid leuchtende Flammen im Dunkel der Welt; seid Quellen des Lebenswassers, seid göttliche Führung in der Wüste des Verderbens.","‘Abdu’l-Bahá","Briefe und Botschaften, Abschnitt 210:3, Bahá’í-Verlag","https://bibliothek.bahai.de/pubReader.php?parLangUri=abd-swa-de-210:3",296],["O ihr Diener des Menschengeschlechts! Strebt aus ganzem Herzen danach, die Menschheit zu erlösen von den dunklen Vorurteilen, die den menschlichen Lebensumständen und der Naturwelt angehören, damit die Menschenwelt ihren Weg in das Licht der Welt Gottes finde.","‘Abdu’l-Bahá","Briefe und Botschaften, Abschnitt 202:13, Bahá’í-Verlag","https://bibliothek.bahai.de/pubReader.php?parLangUri=abd-swa-de-202:13",298],["Es sollte keinen Financier mit gewaltigem Reichtum geben, solange in seiner Nähe ein Armer in entsetzlicher Not ist. Wenn wir sehen, dass Armut einen Zustand des Hungerleidens erreicht, so ist dies ein sicheres Zeichen, dass irgendwo Unterdrückung herrscht.","‘Abdu’l-Bahá","Ansprachen in Paris, Abschnitt 46:11, Bahá’í-Verlag","https://bibliothek.bahai.de/pubReader.php?parLangUri=abd-pt-de-46:11",299],["Die Liebe gibt dem Leblosen das Leben; sie entzündet eine Flamme in erkalteten Herzen. Die Liebe gibt dem Hoffnungslosen Hoffnung und macht leidgeprüfte Herzen froh.","‘Abdu’l-Bahá","Ansprachen in Paris, Abschnitt 58:2, Bahá’í-Verlag","https://bibliothek.bahai.de/pubReader.php?parLangUri=abd-pt-de-58:2",300],["Werden verschiedene Schattierungen von Gedanken, Temperamenten und Charakteren unter der Macht und dem Einfluss einer zentralen Kraftquelle zusammengeführt, so wird in gleicher Weise die Schönheit und der Glanz menschlicher Vollkommenheit offenbar und sichtbar.","‘Abdu’l-Bahá","Briefe und Botschaften, Abschnitt 225:25, Bahá’í-Verlag","https://bibliothek.bahai.de/pubReader.php?parLangUri=abd-swa-de-225:25",301],["Vertrauenswürdigkeit ist das weite, breite Tor zur Ruhe und Sicherheit des Volkes. In Wahrheit ist ohne sie, heute wie eh und je, nichts von Bestand. Alle Bereiche der Macht, Größe und Wohlfahrt leuchten in ihrem Licht.","Bahá’u’lláh","Botschaften aus ‘Akká, Abschnitt 4:16, Bahá’í-Verlag","https://bibliothek.bahai.de/pubReader.php?parLangUri=bah-tb-de-4:16",302],["O Sohn des Geistes! Zerbrich den Käfig und dem Phönix der Liebe gleich schwinge dich auf in den Himmel der Heiligkeit. Entsage dem Selbst und ruhe, erfüllt vom Geist der Gnade, im Reiche himmlischer Reinheit.","Bahá’u’lláh","Die Verborgenen Worte, aus dem Persischen Nr. 38, Bahá’í-Verlag","https://bibliothek.bahai.de/pubReader.php?parLangUri=bah-hw-de-2.38:0_112",304],["Seid nicht stolz auf eure Eigenliebe, sondern auf die Liebe zu euren Mitgeschöpfen. Rühmt euch nicht der Liebe zu eurem Vaterland, sondern der Liebe zur ganzen Menschheit.","Bahá’u’lláh","Botschaften aus ‘Akká, Abschnitt 9:5, Bahá’í-Verlag","https://bibliothek.bahai.de/pubReader.php?parLangUri=bah-tb-de-9:5",305],["Damit ist gemeint, dass die Menschenwelt einem Baum gleich ist, die Nationen und Völker sind die verschiedenen Äste und Zweige des Baumes und die einzelnen Menschen sind wie seine Früchte und Blüten.","‘Abdu’l-Bahá","Die Verkündigung des Weltfriedens, Abschnitt 135:3, Bahá’í-Verlag","https://bibliothek.bahai.de/pubReader.php?parLangUri=abd-pup-de-135:3",306],["Gewiss ist materieller Fortschritt gut und lobenswert, doch sollen wir darüber nicht den wichtigeren geistigen Fortschritt außer Acht lassen und nicht die Augen für das göttliche Licht verschließen, das unter uns leuchtet.","‘Abdu’l-Bahá","Ansprachen in Paris, Abschnitt 19:5, Bahá’í-Verlag","https://bibliothek.bahai.de/pubReader.php?parLangUri=abd-pt-de-19:5",307],["Die Welt ist aus dem Gleichgewicht geraten durch die Schwungkraft dieser größten, dieser neuen Weltordnung. Die Lebensordnung der Menschheit ist aufgewühlt durch das Wirken dieses einzigartigen, dieses wundersamen Systems, desgleichen kein sterbliches Auge je gesehen hat.","Bahá’u’lláh","Ährenlese aus den Schriften Bahá’u’lláhs, Abschnitt 70:1, Bahá’í-Verlag","https://bibliothek.bahai.de/pubReader.php?parLangUri=bah-gwb-de-70:1",308],["Um die Wahrheit zu finden, müssen wir von unseren Vorurteilen, unseren eigenen kleinlichen, alltäglichen Vorstellungen lassen; ein offener, empfänglicher Sinn ist nötig. Wenn unser Kelch vom Ich erfüllt ist, so ist in ihm kein Raum mehr für das Wasser des Lebens.","‘Abdu’l-Bahá","Ansprachen in Paris, Abschnitt 41:7, Bahá’í-Verlag","https://bibliothek.bahai.de/pubReader.php?parLangUri=abd-pt-de-41:7",309],["Die fünf Kontinente der Welt werden wie ein einziger Kontinent, ihre verschiedenen Nationen zu einer Nation, die Erde wird zu einer Heimat und die Menschheit zu einem Volk.","‘Abdu’l-Bahá","Beantwortete Fragen, Abschnitt 12:4, Bahá’í-Verlag","https://bibliothek.bahai.de/pubReader.php?parLangUri=abd-saq-de-12:4",310],["Denkt zu allen Zeiten daran, wie ihr jedem Glied der Menschheit einen Dienst erweisen könnt.","‘Abdu’l-Bahá","Briefe und Botschaften, Abschnitt 1:7, Bahá’í-Verlag","https://bibliothek.bahai.de/pubReader.php?parLangUri=abd-swa-de-1:7",311],["In dieser schwarzen Pupille sieht man die Widerspiegelung dessen, was vor ihr ist, und durch sie strahlt das Licht des Geistes hervor.«","‘Abdu’l-Bahá","Das Kommen Göttlicher Gerechtigkeit, Abschnitt 55, Bahá’í-Verlag","https://bibliothek.bahai.de/pubReader.php?parLangUri=sho-adj-de-55",312],["Sprich nicht über die Sünden anderer, solange du selbst ein Sünder bist. So du dieses Gebot übertrittst, bist du verworfen – dies bezeuge Ich dir.«","Bahá’u’lláh","Kitáb-i-Aqdas, Abschnitt 8.37:2, Bahá’í-Verlag","https://bibliothek.bahai.de/pubReader.php?parLangUri=bah-ka-de-8.37:2",313],["Schließe deine Augen für alles andere und öffne sie dem Reiche des Allherrlichen. Nur von Ihm erbitte, was immer du wünschst, nur bei Ihm suche, was immer du suchst.","‘Abdu’l-Bahá","Briefe und Botschaften, Abschnitt 22:1, Bahá’í-Verlag","https://bibliothek.bahai.de/pubReader.php?parLangUri=abd-swa-de-22:1",314],["Gottes Religion ist eine einzige Religion, aber sie muss immer wieder erneuert werden.","‘Abdu’l-Bahá","Briefe und Botschaften, Abschnitt 23:3, Bahá’í-Verlag","https://bibliothek.bahai.de/pubReader.php?parLangUri=abd-swa-de-23:3",315],["Seid nicht beschäftigt mit euren eigenen Belangen! Laßt euere Gedanken fest auf das gerichtet sein, was das Glück der Menschheit wiederherstellen und der Menschen Herzen und Seelen heiligen wird.","Bahá’u’lláh","Botschaften aus ‘Akká, Abschnitt 7:10, Bahá’í-Verlag","https://bibliothek.bahai.de/pubReader.php?parLangUri=bah-tb-de-7:10",316],["Gestaltet darum euer Leben in Übereinstimmung mit dem ersten Grundsatz der göttlichen Lehre – der Liebe. Dienst für die Menschheit ist Dienst für Gott.","‘Abdu’l-Bahá","Die Verkündigung des Weltfriedens, Abschnitt 3:2, Bahá’í-Verlag","https://bibliothek.bahai.de/pubReader.php?parLangUri=abd-pup-de-3:2",317],["O Sohn des Menschen! Wenn du auf Barmherzigkeit siehst, dann gib auf, was dir Nutzen bringt, und halte dich an das, was der Menschheit nützt. Und wenn du auf Gerechtigkeit siehst, dann wähle für deinen Nächsten, was du für dich selbst wählst.","Bahá’u’lláh","Brief an den Sohn des Wolfes, Abschnitt 54, Bahá’í-Verlag","https://bibliothek.bahai.de/pubReader.php?parLangUri=bah-esw-de-54",318],["Erst wenn der Mensch geprüft wird, trennt sich das reine Gold deutlich von der Schlacke. Schmerzenspein ist das Feuer der Prüfung, darin das reine Gold prächtig glänzt, alles Unreine jedoch schwarz wird und verbrennt.","‘Abdu’l-Bahá","Briefe und Botschaften, Abschnitt 89:1, Bahá’í-Verlag","https://bibliothek.bahai.de/pubReader.php?parLangUri=abd-swa-de-89:1",319],["Darum müsst ihr den Armen so gut wie möglich beistehen, bis hin zur Selbstaufopferung. Keine Tat des Menschen ist vor Gott größer, als den Armen zu helfen.","‘Abdu’l-Bahá","Die Verkündigung des Weltfriedens, Abschnitt 77:1, Bahá’í-Verlag","https://bibliothek.bahai.de/pubReader.php?parLangUri=abd-pup-de-77:1",320],["Das Ziel der Religion, wie sie vom Himmel des heiligen Willens Gottes offenbart ist, besteht darin, Einheit und Eintracht unter den Völkern der Welt zu stiften; macht sie nicht zur Ursache für Zwist und Streit.","Bahá’u’lláh","Botschaften aus ‘Akká, Abschnitt 8:61, Bahá’í-Verlag","https://bibliothek.bahai.de/pubReader.php?parLangUri=bah-tb-de-8:61",321],["Am Anfang jeder Bemühung hat man die Pflicht, auf das Ende zu sehen.","Bahá’u’lláh","Botschaften aus ‘Akká, Abschnitt 11:16, Bahá’í-Verlag","https://bibliothek.bahai.de/pubReader.php?parLangUri=bah-tb-de-11:16",322],["Betrachte den Glauben als einen Baum. Seine Früchte, Blätter, Äste und Zweige sind und waren seit jeher Vertrauenswürdigkeit, Wahrhaftigkeit, Rechtschaffenheit und Langmut.","Bahá’u’lláh","Vertrauenswürdigkeit – eine Kardinal-Bahá’í-Tugend (Textzusammenstellung), Abschnitt 2:1, Bahá’í-Verlag","https://bibliothek.bahai.de/pubReader.php?parLangUri=comp-trw-de-2:1",323],["Dein Paradies ist Meine Liebe, Deine himmlische Heimstatt Wiedervereinigung mit Mir. Tritt ein ohne Zaudern. So wurde es dir in Unserem himmlischen Reich und Unserer erhabenen Herrschaft bestimmt.","Bahá’u’lláh","Die Verborgenen Worte, aus dem Arabischen Nr. 6, Bahá’í-Verlag","https://bibliothek.bahai.de/pubReader.php?parLangUri=bah-hw-de-1.6:1",324]];

function shuffle(n,avoid){var a=[];for(var i=0;i<n;i++)a.push(i);for(i=n-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}if(n>1&&a[0]===avoid){a.push(a.shift())}return a}

function tie(s){var N="\u00A0";

function paintBg(ctx,W,Hh,b){
 if(b.t==="lin"){var g=ctx.createLinearGradient(0,0,0,Hh);b.s.forEach(function(s){g.addColorStop(s[0],s[1])});ctx.fillStyle=g;ctx.fillRect(0,0,W,Hh);return}
 if(b.t==="con"){if(ctx.createConicGradient){var cg=ctx.createConicGradient((b.a-90)*Math.PI/180,W*b.x,Hh*b.y);b.s.forEach(function(c,i){cg.addColorStop(i/(b.s.length-1),c)});ctx.fillStyle=cg}else{ctx.fillStyle=b.s[0]}ctx.fillRect(0,0,W,Hh);return}
 ctx.fillStyle=b.base;ctx.fillRect(0,0,W,Hh);
 b.e.forEach(function(e){var rx=e[0]*W,ry=e[1]*Hh,cx=e[2]*W,cy=e[3]*Hh;ctx.save();ctx.translate(cx,cy);ctx.scale(rx,ry);var rg=ctx.createRadialGradient(0,0,0,0,0,1);rg.addColorStop(0,"rgba("+e[4]+","+e[5]+")");rg.addColorStop(1,"rgba("+e[4]+",0)");ctx.fillStyle=rg;ctx.fillRect(-cx/rx,-cy/ry,W/rx,Hh/ry);ctx.restore()})}
function wrap(ctx,text,maxW){var words=text.split(/\s+/),lines=[],line="";words.forEach(function(w){var test=line?line+" "+w:w;if(ctx.measureText(test).width>maxW&&line){lines.push(line);line=w}else{line=test}});if(line)lines.push(line);return lines}
function makeImage(){
 var W=1080,Hh=1350,pad=110,maxW=W-pad*2,FAM="'EB Garamond','Iowan Old Style',Palatino,Georgia,serif";
 var ready=(document.fonts&&document.fonts.load)?Promise.all([document.fonts.load("400 40px 'EB Garamond'"),document.fonts.load("italic 400 40px 'EB Garamond'")]).catch(function(){}):Promise.resolve();
 return ready.then(function(){
  var cv=document.createElement("canvas");cv.width=W;cv.height=Hh;var ctx=cv.getContext("2d");
  paintBg(ctx,W,Hh,BG);
  var fs=Math.round(size(CUR.text.length)*2.35),lines,lh;
  for(;fs>=34;fs-=2){ctx.font=fs+"px "+FAM;lines=wrap(ctx,CUR.text,maxW);var bn=lines.length,blo=maxW*0.55,bhi=maxW;if(bn>1){for(var bk=0;bk<14;bk++){var bm=(blo+bhi)/2;if(wrap(ctx,CUR.text,bm).length>bn){blo=bm}else{bhi=bm}}lines=wrap(ctx,CUR.text,bhi)}lh=fs*1.28;if(lines.length*lh<=Hh-520)break}
  var markH=120,gap=64,metaH=90,blockH=markH+gap+lines.length*lh+gap+metaH,y=(Hh-blockH)/2;
  ctx.textBaseline="alphabetic";ctx.fillStyle=BG.m;ctx.font="300px "+FAM;ctx.fillText("“",pad-12,y+210);
  y+=markH+gap;ctx.fillStyle="#1F1E24";ctx.font=fs+"px "+FAM;
  lines.forEach(function(l,i){ctx.fillText(l,pad,y+fs+i*lh)});
  y+=lines.length*lh+gap;ctx.font="italic 40px "+FAM;ctx.fillText(CUR.author,pad,y+36);
  ctx.fillStyle="#55535C";ctx.font="32px "+FAM;wrap(ctx,CUR.ref,maxW).slice(0,2).forEach(function(l,i){ctx.fillText(l,pad,y+86+i*40)});
  return new Promise(function(res){cv.toBlob(function(b){res(b)},"image/png")})})}

 var ir=document.getElementById("imgrow");ir.textContent="";
 if(!FRAMED||DL){var s=document.createElement("button");s.type="button";s.className="opt primary";s.textContent=T.save;s.addEventListener("click",saveImage);ir.appendChild(s)}
 if(canCopyImg()){var ci=document.createElement("button");ci.type="button";ci.className="opt"+(ir.children.length?"":" primary");ci.textContent=T.copyimg;ci.addEventListener("click",copyImage);ir.appendChild(ci)}
 document.getElementById("orline").textContent=T.or;document.getElementById("orline").hidden=!ir.children.length;
 if(box.children.length%2===1){box.lastChild.style.gridColumn="1 / -1"}
 lastFocus=document.activeElement;document.getElementById("scrim").hidden=false;document.getElementById("sheet").hidden=false;(ir.firstChild||box.firstChild).focus()}
function closeSheet(){document.getElementById("scrim").hidden=true;document.getElementById("sheet").hidden=true;if(lastFocus)lastFocus.focus()}
document.getElementById("closeBtn").addEventListener("click",closeSheet);
document.getElementById("scrim").addEventListener("click",closeSheet);
document.addEventListener("keydown",function(ev){if(ev.key==="Escape"&&!document.getElementById("sheet").hidden)closeSheet()});
var IMG=null;
function imgPromise(){return IMG?Promise.resolve(IMG):makeImage().then(function(b){IMG=b;return b})}
setTimeout(function(){imgPromise().catch(function(){})},1200);
function canCopyImg(){return !!(window.ClipboardItem&&navigator.clipboard&&navigator.clipboard.write)}
function copyImage(){try{navigator.clipboard.write([new ClipboardItem({"image/png":imgPromise()})]).then(function(){toast(T.imgcopied)},function(){toast(T.fail)})}catch(e){toast(T.fail)}}
document.getElementById("shareBtn").addEventListener("click",function(){
 if(FRAMED||!navigator.share||!IMG){openSheet();return}
 var f=null;try{f=new File([IMG],"bahai-quote-"+CUR.id+".png",{type:"image/png"})}catch(e){}
 if(!f||!navigator.canShare||!navigator.canShare({files:[f]})){openSheet();return}
 try{navigator.share({files:[f],title:CUR.author,text:shareText(true)}).catch(function(err){if(!err||err.name!=="AbortError")openSheet()})}catch(e){openSheet()}});
function restart(el){el.style.animation="none";void el.offsetWidth;el.style.animation=""}
function goNext(){IDX=nextIndex();BG=nextBg();q=Q[IDX];CUR={text:q[0],author:q[1],ref:q[2],link:q[3],id:q[4],lang:LANG};IMG=null;
 try{if(location.hash)history.replaceState(null,"",location.pathname+location.search)}catch(e){}
 render();restart(document.getElementById("bg"));restart(document.querySelector(".card"));setTimeout(function(){imgPromise().catch(function(){})},900)}
if(SHOW_NEXT){var nb=document.getElementById("nextBtn");nb.hidden=false;nb.setAttribute("aria-label",T.next);nb.title=T.next;nb.addEventListener("click",goNext)}
</script>
