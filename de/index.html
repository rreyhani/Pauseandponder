<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bahá’í-Zitate</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;1,400&display=swap">
<style>
:root{--ink:#1F1E24;--muted:#55535C;--mark:#8FA6BD;--ground:#F4F1F6;--line:rgba(31,30,36,.22);--sheet:rgba(253,252,252,.9);color-scheme:light}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--ground);color:var(--ink);font-family:'EB Garamond','Iowan Old Style','Palatino Linotype',Palatino,Georgia,serif;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
.bg{position:fixed;inset:0;z-index:0}
.stage{position:relative;z-index:1;min-height:100%;box-sizing:border-box;display:flex;align-items:center;justify-content:center;padding:56px 36px}
.card{width:100%;max-width:620px;display:flex;flex-direction:column;gap:40px;margin:0}
.mark{font-size:96px;line-height:.6;height:40px;color:var(--mark);user-select:none}
blockquote{margin:0;font-size:var(--fs,33px);line-height:1.28;text-wrap:balance;-webkit-hyphens:manual;hyphens:manual;overflow-wrap:break-word}
.who{display:flex;flex-direction:column;gap:4px}
.author{font-size:17px;font-style:italic}
.ref{font-size:14px;color:var(--muted);text-decoration:none;width:fit-content}
a.ref:hover,a.ref:focus-visible{text-decoration:underline;text-underline-offset:3px}
.share{margin-top:24px;align-self:flex-start;display:inline-flex;align-items:center;gap:8px;min-height:44px;box-sizing:border-box;padding:0 18px;border:1px solid var(--line);border-radius:999px;background:rgba(255,255,255,.35);color:var(--ink);font:inherit;font-size:16px;letter-spacing:.02em;cursor:pointer;transition:background .2s,border-color .2s}
.share:hover{background:rgba(255,255,255,.6);border-color:rgba(31,30,36,.4)}
.share:active{transform:scale(.98)}
.share svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round}
:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
.next{position:fixed;z-index:2;right:calc(16px + env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));width:48px;height:48px;display:flex;align-items:center;justify-content:center;padding:0;background:none;border:0;border-radius:50%;color:var(--ink);opacity:.26;cursor:pointer;transition:opacity .35s ease}
.next:hover,.next:focus-visible{opacity:.72}
.next:active{transform:translateX(2px)}
.next svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.1;stroke-linecap:round;stroke-linejoin:round}
@media (min-width:720px){.next{right:32px;bottom:32px}}
.scrim{position:fixed;inset:0;z-index:5;background:rgba(31,30,36,.2)}
.sheet{position:fixed;z-index:6;left:50%;bottom:0;transform:translateX(-50%);width:100%;max-width:480px;box-sizing:border-box;padding:24px 20px calc(20px + env(safe-area-inset-bottom,0px));background:var(--sheet);-webkit-backdrop-filter:blur(18px) saturate(140%);backdrop-filter:blur(18px) saturate(140%);border-radius:22px 22px 0 0;box-shadow:0 -10px 40px rgba(60,50,80,.14);display:flex;flex-direction:column;gap:18px}
.sheet h2{margin:0;font-weight:400;font-size:20px;font-style:italic}
.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.opt{display:flex;align-items:center;justify-content:center;min-height:48px;padding:0 12px;border:1px solid var(--line);border-radius:999px;background:rgba(255,255,255,.55);color:var(--ink);font:inherit;font-size:16px;text-decoration:none;cursor:pointer;text-align:center}
.opt:hover{background:#fff}
.opt.primary{background:#1F1E24;color:#F7F5F9;border-color:#1F1E24}
.opt.primary:hover{background:#34323B}
.imgrow{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.imgrow>.opt:only-child{grid-column:1 / -1}
.sub{margin:0;font-size:14px;color:var(--muted)}
.close{align-self:center;background:none;border:0;font:inherit;font-size:15px;color:var(--muted);min-height:44px;padding:0 16px;cursor:pointer}
.toast{position:fixed;z-index:7;left:50%;bottom:calc(28px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:#F7F5F9;font-size:15px;padding:10px 18px;border-radius:999px}
@media (min-width:720px){blockquote{font-size:calc(var(--fs,33px)*1.3)}.author{font-size:20px}.ref{font-size:16px}.mark{font-size:120px;height:48px}.card{gap:48px}.sheet{bottom:32px;border-radius:22px}}
@media (prefers-reduced-motion:no-preference){.bg{animation:fade .9s ease-out both}.card{animation:rise 1.1s .15s ease-out both}.sheet:not([hidden]){animation:up .28s ease-out both}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes up{from{opacity:0;transform:translate(-50%,16px)}to{opacity:1;transform:translate(-50%,0)}}
.h1{background:linear-gradient(180deg,#D7E8F6 0%,#E9F0F6 48%,#FBE6DA 52%,#F7DCCF 100%)}
.h2{background:linear-gradient(180deg,#D6EEE1 0%,#E8F4EC 48%,#FBF3D6 52%,#F7ECC4 100%)}
.h3{background:linear-gradient(180deg,#E2DCF4 0%,#EEEAF7 48%,#FAE6EC 52%,#F6D9E2 100%)}
.p1{background:conic-gradient(from 210deg at 50% 45%,#F6E7F0,#E7ECF8,#E4F4EE,#F7F1DF,#F6E4E6,#F6E7F0)}
.p2{background:conic-gradient(from 40deg at 45% 55%,#E1ECF8,#E3F4EE,#EEE8F8,#F3F6FB,#E6EEF7,#E1ECF8)}
.p3{background:conic-gradient(from 300deg at 55% 40%,#F9E3E4,#F8EEDB,#F6E5F0,#FBEFE7,#F4E1E8,#F9E3E4)}
.w1{background:radial-gradient(ellipse 60% 40% at 100% 0%,rgba(246,196,214,.75),rgba(246,196,214,0)),radial-gradient(ellipse 50% 35% at 72% 8%,rgba(252,226,176,.7),rgba(252,226,176,0)),radial-gradient(ellipse 60% 38% at 0% 100%,rgba(186,222,210,.75),rgba(186,222,210,0)),radial-gradient(ellipse 45% 30% at 28% 94%,rgba(200,204,244,.7),rgba(200,204,244,0)),#FDFCFB}
.w2{background:radial-gradient(ellipse 62% 40% at 0% 0%,rgba(212,200,244,.8),rgba(212,200,244,0)),radial-gradient(ellipse 48% 32% at 30% 6%,rgba(190,220,246,.7),rgba(190,220,246,0)),radial-gradient(ellipse 60% 38% at 100% 100%,rgba(250,210,190,.75),rgba(250,210,190,0)),radial-gradient(ellipse 45% 30% at 72% 94%,rgba(250,236,184,.7),rgba(250,236,184,0)),#FDFCFD}
.w3{background:radial-gradient(ellipse 70% 36% at 50% 0%,rgba(188,228,208,.8),rgba(188,228,208,0)),radial-gradient(ellipse 40% 28% at 92% 10%,rgba(232,240,184,.7),rgba(232,240,184,0)),radial-gradient(ellipse 70% 34% at 50% 100%,rgba(246,200,210,.72),rgba(246,200,210,0)),radial-gradient(ellipse 40% 26% at 8% 92%,rgba(252,222,196,.7),rgba(252,222,196,0)),#FCFDFC}
</style>
</head>

<blockquote id="text">Let your vision be world-embracing, rather than confined to your own self.</blockquote>
<figcaption class="who"><span class="author" id="author">Bahá’u’lláh</span><a class="ref" id="ref" href="https://www.bahai.org/library/" target="_blank" rel="noopener">Gleanings from the Writings of Bahá’u’lláh</a>

<script>
var Q=[["Begnügt euch nicht damit, durch Worte Freundschaft zu erzeigen, lasst eure Herzen in liebevoller Freundlichkeit für alle erglühen, die eure Wege kreuzen.","‘Abdu’l-Bahá","Ansprachen in Paris, Abschnitt 1:7, Bahá’í-Verlag","https://bibliothek.bahai.de/pubReader.php?parLangUri=abd-pt-de-1:7",1],["Ich ermahne dich, höflich zu sein, denn Höflichkeit ist vor allem anderen die Fürstin der Tugenden. Gut steht es mit dem, der vom Lichte der Höflichkeit erleuchtet und mit dem Gewande der Aufrichtigkeit bekleidet ist. Der mit Höflichkeit Begabte hat in der Tat eine erhabene Stufe erreicht.","Bahá’u’lláh","Botschaften aus ‘Akká, Abschnitt 7:14, Bahá’í-Verlag","https://bibliothek.bahai.de/pubReader.php?parLangUri=bah-tb-de-7:14",2],["Sie müssen wie leuchtende Sterne das Licht der Liebe auf die ganze Menschheit strahlen lassen.","‘Abdu’l-Bahá","Die Verkündigung des Weltfriedens, Abschnitt 109:16, Bahá’í-Verlag","https://bibliothek.bahai.de/pubReader.php?parLangUri=abd-pup-de-109:16",3],["Wisse, daß die Seele des Menschen über alle Gebrechlichkeit des Leibes und des Verstandes erhaben und davon unabhängig ist.","Bahá’u’lláh","Ährenlese aus den Schriften Bahá’u’lláhs, Abschnitt 80:2, Bahá’í-Verlag","https://bibliothek.bahai.de/pubReader.php?parLangUri=bah-gwb-de-80:2",4],["Es besteht kein Zweifel, dass Krieg unter den Menschen gänzlich aufhören wird, sobald Frauen gleiche Rechte erhalten.","‘Abdu’l-Bahá","Die Verkündigung des Weltfriedens, Abschnitt 62:7, Bahá’í-Verlag","https://bibliothek.bahai.de/pubReader.php?parLangUri=abd-pup-de-62:7",5],["Die Wohlfahrt der Menschheit, ihr Friede und ihre Sicherheit sind unerreichbar, ehe nicht ihre Einheit fest begründet ist.","Bahá’u’lláh","Ährenlese aus den Schriften Bahá’u’lláhs, Abschnitt 131:2, Bahá’í-Verlag","https://bibliothek.bahai.de/pubReader.php?parLangUri=bah-gwb-de-131:2",6],["Freigebigkeit und Großmut sind Meine Zeichen. Wohl dem, der den Schmuck Meiner Tugenden anlegt!","Bahá’u’lláh","Die Verborgenen Worte, aus dem Persischen Nr. 49, Bahá’í-Verlag","https://bibliothek.bahai.de/pubReader.php?parLangUri=bah-hw-de-2.49:1",7],["Kein menschliches Wesen bleibt von diesen beiden Einflüssen unberührt, doch alle Sorge und der Kummer, denen wir begegnen, kommen aus der Welt des Stoffes, die geistige Welt hingegen schenkt nur Freude.","‘Abdu’l-Bahá","Die Weltordnung Bahá’u’lláhs, Abschnitt 3:20, Bahá’í-Verlag","https://bibliothek.bahai.de/pubReader.php?parLangUri=sho-wob-de-3:20",10],["Wahrhaftigkeit ist die Grundlage aller menschlichen Tugenden.","‘Abdu’l-Bahá","Vertrauenswürdigkeit – eine Kardinal-Bahá’í-Tugend (Textzusammenstellung), Abschnitt 40:1, Bahá’í-Verlag","https://bibliothek.bahai.de/pubReader.php?parLangUri=comp-trw-de-40:1",11],["Alles Erschaffene ist Ausdruck der Verbundenheit und des Zusammenhalts von Grundsubstanzen, und Nichtsein ist das Fehlen dieser Anziehung und Übereinstimmung. In einer Komposition verbinden sich unterschiedliche Elemente harmonisch; aber wenn diese Elemente nicht mehr harmonieren und sich gegenseitig abstoßen, sind Zerfall und Nichtsein die Folge. Alles besitzt diese Eigenschaft und ist diesem Gesetz unterworfen, denn die Grundlage der Schöpfung, auf allen ihren Stufen und in allen Reichen, ist ein Ausdruck oder das Ergebnis der Liebe.","‘Abdu’l-Bahá","Die Verkündigung des Weltfriedens, Abschnitt 48:2, Bahá’í-Verlag","https://bibliothek.bahai.de/pubReader.php?parLangUri=abd-pup-de-48:2",12],["Wo immer die Geliebten Gottes sich versammeln und wem immer sie begegnen, sie müssen in ihrer Haltung vor Gott und beim Lobpreis Seines Ruhmes und Seiner Ehre solche Demut und Ergebenheit zeigen, daß jedes Staubatom unter ihren Füßen die Tiefe ihrer Hingabe bezeugt.","Bahá’u’lláh","Ährenlese aus den Schriften Bahá’u’lláhs, Abschnitt 5:2, Bahá’í-Verlag","https://bibliothek.bahai.de/pubReader.php?parLangUri=bah-gwb-de-5:2",14],["Bürdet keiner Seele eine Last auf, die ihr selber nicht tragen wollt, und wünscht niemandem, was ihr euch selbst nicht wünscht.","Bahá’u’lláh","Ährenlese aus den Schriften Bahá’u’lláhs, Abschnitt 66:8, Bahá’í-Verlag","https://bibliothek.bahai.de/pubReader.php?parLangUri=bah-gwb-de-66:8",16],["Laßt eueren Blick weltumfassend sein, anstatt ihn auf euer Selbst zu beschränken.","Bahá’u’lláh","Botschaften aus ‘Akká, Abschnitt 7:11, Bahá’í-Verlag","https://bibliothek.bahai.de/pubReader.php?parLangUri=bah-tb-de-7:11",17],["Nur die Rose der Liebe pflanze in den Garten deines Herzens und trenne dich nicht von der Nachtigall der Zuneigung und der Sehnsucht.","Bahá’u’lláh","Die Verborgenen Worte, aus dem Persischen Nr. 3, Bahá’í-Verlag","https://bibliothek.bahai.de/pubReader.php?parLangUri=bah-hw-de-2.3:1",18],["Gott lässt sich nicht von Farbe oder Herkunft beeindrucken. Alle Farben, ob weiß, schwarz oder gelb, sind Ihm willkommen. Da alle Menschen nach dem Ebenbild Gottes erschaffen wurden, müssen wir uns vor Augen halten, dass jeder Mensch göttliche Möglichkeiten in sich birgt.","‘Abdu’l-Bahá","Die Verkündigung des Weltfriedens, Abschnitt 45:8, Bahá’í-Verlag","https://bibliothek.bahai.de/pubReader.php?parLangUri=abd-pup-de-45:8",19],["Die ganze Pflicht des Menschen liegt an diesem Tage darin, seinen Teil an der Gnadenfülle zu erlangen, die Gott für ihn strömen läßt. Deshalb soll niemand der Größe des Gefäßes achten.","Bahá’u’lláh","Ährenlese aus den Schriften Bahá’u’lláhs, Abschnitt 5:4, Bahá’í-Verlag","https://bibliothek.bahai.de/pubReader.php?parLangUri=bah-gwb-de-5:4",20],["Rufe die Menschen zur Liebe, sei gütig zum ganzen Menschengeschlecht.","‘Abdu’l-Bahá","Briefe und Botschaften, Abschnitt 10:2, Bahá’í-Verlag","https://bibliothek.bahai.de/pubReader.php?parLangUri=abd-swa-de-10:2",21],["Daher besteht nun die Möglichkeit, die Einheit der ganzen Menschheit zu schaffen. Wahrlich, dies ist nichts anderes als eines der Wunder dieses herrlichen Zeitalters, dieses glorreichen Jahrhunderts.","‘Abdu’l-Bahá","Der verheißene Tag ist gekommen, Abschnitt 294, Bahá’í-Verlag","https://bibliothek.bahai.de/pubReader.php?parLangUri=sho-pdc-de-294",22],["Meditation ist der Schlüssel zu den Toren der Geheimnisse.","‘Abdu’l-Bahá","Ansprachen in Paris, Abschnitt 54:13, Bahá’í-Verlag","https://bibliothek.bahai.de/pubReader.php?parLangUri=abd-pt-de-54:13",23],["Der Herr, einzig ist Er, hat Mann und Frau erschaffen, damit sie in engster Gemeinschaft miteinander leben und wie eine einzige Seele seien. Sie sind zwei Gefährten, zwei nahe Freunde, die gegenseitig auf ihr Wohl bedacht sein sollten.","‘Abdu’l-Bahá","Briefe und Botschaften, Abschnitt 92:1, Bahá’í-Verlag","https://bibliothek.bahai.de/pubReader.php?parLangUri=abd-swa-de-92:1",24],["O Sohn des Höchsten! Den Tod machte Ich dir zum Boten der Freude. Warum bist du traurig? Das Licht erschuf Ich, dich zu erleuchten. Warum verhüllst du dich vor ihm?","Bahá’u’lláh","Die Verborgenen Worte, aus dem Arabischen Nr. 32, Bahá’í-Verlag","https://bibliothek.bahai.de/pubReader.php?parLangUri=bah-hw-de-1.32:0_34",25],["O Sohn des Menschen! Ich liebte es, dich zu erschaffen, also erschuf Ich dich. Nun liebe du Mich, damit Ich deinen Namen nenne und deine Seele mit dem Geiste des Lebens erfülle.","Bahá’u’lláh","Die Verborgenen Worte, aus dem Arabischen Nr. 4, Bahá’í-Verlag","https://bibliothek.bahai.de/pubReader.php?parLangUri=bah-hw-de-1.4:0_6",26],["Widerfährt euch Unheil, so seid geduldig und gelassen.","‘Abdu’l-Bahá","Briefe und Botschaften, Abschnitt 35:12, Bahá’í-Verlag","https://bibliothek.bahai.de/pubReader.php?parLangUri=abd-swa-de-35:12",27],["So, wie Gott alle liebt und freundlich zu allen ist, müssen auch wir wahrhaft alle lieben und freundlich zu allen sein. Wir dürfen niemanden als böse, verabscheuungswürdig oder als Feind betrachten. Wir müssen alle lieben – nein, wir müssen jeden als mit uns verwandt ansehen, denn alle sind die Diener eines Gottes.","‘Abdu’l-Bahá","Die Verkündigung des Weltfriedens, Abschnitt 92:8, Bahá’í-Verlag","https://bibliothek.bahai.de/pubReader.php?parLangUri=abd-pup-de-92:8",28],["Gelobt sei Dein Name, o Herr mein Gott! Ich bezeuge, daß Du ein verborgener Schatz warst, eingehüllt in Deinem urewigen Sein, und ein unerforschliches Geheimnis, eingeschlossen in Deinem Wesen. Du wünschtest, Dich zu offenbaren; darum schufest Du die Größeren und die Geringeren Welten, Du erwähltest den Menschen vor allen Deinen Geschöpfen und machtest Ihn zum Zeichen für beiderlei Welten, o Du, der Du unser Herr bist, der Mitleidvollste!","Bahá’u’lláh","Gebete und Meditationen, Abschnitt 38:1, Bahá’í-Verlag","https://bibliothek.bahai.de/pubReader.php?parLangUri=bah-pm-de-38:1",29],["Darum sollten wir gebieterisch den eigenen persönlichen Vorurteilen und dem Aberglauben entsagen, wenn wir ernstlich die Wahrheit zu erforschen wünschen.","‘Abdu’l-Bahá","Ansprachen in Paris, Abschnitt 41:8, Bahá’í-Verlag","https://bibliothek.bahai.de/pubReader.php?parLangUri=abd-pt-de-41:8",30],["Seid wie ein einziger Geist, eine einzige Seele, wie die Blätter eines einzigen Baumes, die Blumen eines einzigen Gartens, die Wellen eines einzigen Ozeans.","‘Abdu’l-Bahá","Die Verkündigung des Weltfriedens, Abschnitt 10:4, Bahá’í-Verlag","https://bibliothek.bahai.de/pubReader.php?parLangUri=abd-pup-de-10:4",31],["Wenn alle Menschen die gleichen Bildungschancen haben und die Gleichberechtigung von Mann und Frau verwirklicht ist, werden die Kriegsgrundlagen völlig vernichtet.","‘Abdu’l-Bahá","Die Verkündigung des Weltfriedens, Abschnitt 62:7, Bahá’í-Verlag","https://bibliothek.bahai.de/pubReader.php?parLangUri=abd-pup-de-62:7",32],["Die Propheten Gottes gleichen Ärzten, deren Aufgabe es ist, das Wohlergehen der Welt und ihrer Völker zu fördern, damit sie durch den Geist der Einheit das Siechtum einer entzweiten Menschheit zu heilen vermögen.","Bahá’u’lláh","Ährenlese aus den Schriften Bahá’u’lláhs, Abschnitt 34:6, Bahá’í-Verlag","https://bibliothek.bahai.de/pubReader.php?parLangUri=bah-gwb-de-34:6",33],["Laßt jeden Morgen besser sein als den Abend davor und jeden neuen Tag reicher werden als den gestrigen.","Bahá’u’lláh","Botschaften aus ‘Akká, Abschnitt 9:4, Bahá’í-Verlag","https://bibliothek.bahai.de/pubReader.php?parLangUri=bah-tb-de-9:4",34],["Der Geist ist unveränderlich, unzerstörbar. Der Fortschritt und die Entfaltung der Seele, ihre Freude und Sorge sind vom physischen Körper unabhängig.","‘Abdu’l-Bahá","Ansprachen in Paris, Abschnitt 20:6, Bahá’í-Verlag","https://bibliothek.bahai.de/pubReader.php?parLangUri=abd-pt-de-20:6",35],["Beratet in größter Freundlichkeit und im Geiste vollkommener Brüderlichkeit, und verbringt die kostbaren Tage eures Lebens damit, die Welt zu bessern und die Sache dessen voranzutragen, der der ewige, höchste Herr über alles ist.","Bahá’u’lláh","Ährenlese aus den Schriften Bahá’u’lláhs, Abschnitt 92:3, Bahá’í-Verlag","https://bibliothek.bahai.de/pubReader.php?parLangUri=bah-gwb-de-92:3",36],["Die Schöpfung ist der sichtbare Ausdruck von Bewegung. Bewegung ist Leben. Was sich bewegt, lebt, wohingegen alles Bewegungslose und Träge wie tot ist. Angetrieben vom Geist und den Kräften des Lebens entwickelt sich alles Erschaffene auf seiner jeweiligen Daseinsebene, in seinem Lebensbereich.","‘Abdu’l-Bahá","Die Verkündigung des Weltfriedens, Abschnitt 52:1, Bahá’í-Verlag","https://bibliothek.bahai.de/pubReader.php?parLangUri=abd-pup-de-52:1",37],["Es ist eine Grundtatsache, dass man während des Meditierens mit der eigenen Seele spricht. In diesem Gemütszustand kann man an seine Seele bestimmte Fragen richten, und die Seele gibt Antwort: Das Licht bricht hervor, und die Wirklichkeit enthüllt sich.","‘Abdu’l-Bahá","Ansprachen in Paris, Abschnitt 54:9, Bahá’í-Verlag","https://bibliothek.bahai.de/pubReader.php?parLangUri=abd-pt-de-54:9",38],["Strebt deshalb danach, Liebe in den Herzen zu erwecken und sie zum Glühen und Strahlen zu bringen.","‘Abdu’l-Bahá","Die Verkündigung des Weltfriedens, Abschnitt 84:4, Bahá’í-Verlag","https://bibliothek.bahai.de/pubReader.php?parLangUri=abd-pup-de-84:4",39],["Strebet darum, dass eure Taten tagtäglich wundervolle Gebete seien. Wendet euch Gott zu und versuchet immer, zu tun, was recht und edel ist. Unterstützt die Armen, richtet die Gefallenen auf, gebt den Bekümmerten Trost, bringt Heilung für die Kranken, stärkt die, die in Ängsten sind, befreit die Unterdrückten, macht den Hoffnungslosen Hoffnung und beschützet die Verlassenen!","‘Abdu’l-Bahá","Ansprachen in Paris, Abschnitt 26:7, Bahá’í-Verlag","https://bibliothek.bahai.de/pubReader.php?parLangUri=abd-pt-de-26:7",40],["Zu den Belegen für die Existenz einer göttlichen Kraft gehört, dass manche Dinge oft durch ihr Gegenteil erkannt werden. Ohne Dunkelheit könnte kein Licht wahrgenommen werden. Ohne den Tod könnte man nichts vom Leben wissen. Wenn es keine Unwissenheit gäbe, gäbe es kein Wissen.","‘Abdu’l-Bahá","Die Verkündigung des Weltfriedens, Abschnitt 35:8, Bahá’í-Verlag","https://bibliothek.bahai.de/pubReader.php?parLangUri=abd-pup-de-35:8",42],["Die Besserung der Welt kann durch reine und gute Taten, durch lobenswertes und geziemendes Verhalten erreicht werden.","Bahá’u’lláh","Ein keusches, heiliges Leben (Textzusammenstellung), Abschnitt 46:1, Bahá’í-Verlag","https://bibliothek.bahai.de/pubReader.php?parLangUri=comp-chl-de-46:1",43],["So, wie die sichtbare Sonne auf die stoffliche Welt scheint, Leben hervorbringt und Wachstum bewirkt, so verleiht die geistige, prophetische Sonne dem Denken und der Vernunft des Menschen Erleuchtung; und ginge sie nicht über dem Horizont menschlichen Seins auf, würde das Reich des Menschen verfinstern und erlöschen.","‘Abdu’l-Bahá","Die Verkündigung des Weltfriedens, Abschnitt 40:3, Bahá’í-Verlag","https://bibliothek.bahai.de/pubReader.php?parLangUri=abd-pup-de-40:3",44],["Aufrichtigkeit und Liebe werden den Hass besiegen.","‘Abdu’l-Bahá","Ansprachen in Paris, Abschnitt 6:12, Bahá’í-Verlag","https://bibliothek.bahai.de/pubReader.php?parLangUri=abd-pt-de-6:12",45],["Dies ist der Tag, da Gottes erhabenste Segnungen den Menschen zugeströmt sind, der Tag, da alles Erschaffene mit Seiner mächtigsten Gnade erfüllt wurde. Alle Völker haben die Pflicht, ihre Gegensätze auszugleichen und in größter Eintracht und in Frieden im Schatten des Baumes Seiner Obhut und Gnade zu wohnen.","Bahá’u’lláh","Ährenlese aus den Schriften Bahá’u’lláhs, Abschnitt 4:1, Bahá’í-Verlag","https://bibliothek.bahai.de/pubReader.php?parLangUri=bah-gwb-de-4:1",46],["Man darf in jedem menschlichen Wesen nur das sehen, was des Lobes würdig ist. Wenn man so handelt, kann man der ganzen Menschheit Freund sein. Betrachten wir die Menschen jedoch vom Standpunkt ihrer Fehler aus, dann ist es eine äußerst schwierige Aufgabe, mit ihnen Freundschaft zu pflegen.","‘Abdu’l-Bahá","Briefe und Botschaften, Abschnitt 144:2, Bahá’í-Verlag","https://bibliothek.bahai.de/pubReader.php?parLangUri=abd-swa-de-144:2",47],["Verliere niemals dein Vertrauen in Gott. Sei immer voller Hoffnung; denn unablässig strömen Gottes Segnungen auf den Menschen herab. Aus einem bestimmten Blickwinkel betrachtet, scheinen sie schwächer zu werden, aber aus einem anderen sind sie reich und vollendet. Der Mensch ist unter allen Lebensbedingungen in ein Meer göttlichen Segens getaucht. Deshalb sei unter keinen Umständen mutlos, sondern sei fest in deinem Hoffen.","‘Abdu’l-Bahá","Briefe und Botschaften, Abschnitt 178:1, Bahá’í-Verlag","https://bibliothek.bahai.de/pubReader.php?parLangUri=abd-swa-de-178:1",48],["Die Liebe ist das gütige Licht des Himmels, der ewige Odem des Heiligen Geistes, der die Menschenseele belebt. Liebe ist die Ursache der Gottesoffenbarung für den Menschen, das Lebensband, das nach dem göttlichen Schöpfungsgesetz dem Wesen der Dinge innewohnt. Liebe ist das eine Mittel, das wahre Glückseligkeit in dieser und in der nächsten Welt sichert, Liebe ist das Licht, das durch die Finsternis leitet, das lebendige Glied, das Gott mit dem Menschen vereint und das den Fortschritt einer jeden erleuchteten Seele verbürgt.","‘Abdu’l-Bahá","Briefe und Botschaften, Abschnitt 12:1, Bahá’í-Verlag","https://bibliothek.bahai.de/pubReader.php?parLangUri=abd-swa-de-12:1",49],["Von allem das Meistgeliebte ist Mir die Gerechtigkeit; wende dich nicht von ihr ab, wenn du nach Mir verlangst, und mißachte sie nicht, damit Ich dir vertrauen kann. Durch ihre Hilfe wirst du mit deinen eigenen Augen und nicht mit denen anderer sehen und durch die eigene Erkenntnis und nicht durch die deines Nächsten Wissen erlangen.","Bahá’u’lláh","Botschaften aus ‘Akká, Abschnitt 4:14, Bahá’í-Verlag","https://bibliothek.bahai.de/pubReader.php?parLangUri=bah-tb-de-4:14",50],["O Sohn des Geistes! Erbitte nicht von Mir, was Wir nicht für dich wünschen. Sei darum zufrieden mit dem, was Wir für dich bestimmt haben, denn das ist, was dir nützt, wenn du dich damit begnügst.","Bahá’u’lláh","Die Verborgenen Worte, aus dem Arabischen Nr. 18, Bahá’í-Verlag","https://bibliothek.bahai.de/pubReader.php?parLangUri=bah-hw-de-1.18:0_20",51],["Musik ist eine göttliche Kunst mit großer Wirkung. Sie ist Nahrung für Seele und Geist. Durch die Macht und den Zauber der Musik wird der Geist des Menschen erhoben. Sie besitzt eine wunderbar bewegende Wirkung auf die Herzen der Kinder, denn ihre Herzen sind rein, und Melodien haben großen Einfluss auf sie.","‘Abdu’l-Bahá","Die Verkündigung des Weltfriedens, Abschnitt 21:1, Bahá’í-Verlag","https://bibliothek.bahai.de/pubReader.php?parLangUri=abd-pup-de-21:1",53],["Das erste Zeichen des Glaubens ist Liebe.","‘Abdu’l-Bahá","Die Verkündigung des Weltfriedens, Abschnitt 107:10, Bahá’í-Verlag","https://bibliothek.bahai.de/pubReader.php?parLangUri=abd-pup-de-107:10",54],["Dies ist die Stunde, da ihr euch mit allen Völkern der Erde in höchster Güte und Liebe verbinden sollt, da ihr die Zeichen und Merkmale von Gottes unermesslicher Barmherzigkeit für sie sein sollt.","‘Abdu’l-Bahá","Briefe und Botschaften, Abschnitt 7:2, Bahá’í-Verlag","https://bibliothek.bahai.de/pubReader.php?parLangUri=abd-swa-de-7:2",55],["Hebt eure Herzen über die Gegenwart hinaus und blickt mit gläubigen Augen in die Zukunft. Jetzt ist die Zeit der Saat, der Same fällt zu Boden, aber siehe, der Tag wird kommen, da aus ihm ein herrlicher Baum ersteht, und seine Zweige werden reiche Früchte tragen. Jubelt und seid froh, dass dieser Tag heraufstieg. Trachtet, seine Macht zu erkennen, denn er ist wahrhaft wunderbar. Gott hat euch eine Krone aufs Haupt gesetzt und einen strahlenden Stern ins Herz gegeben. Wahrlich, ihr Leuchten wird die ganze Welt erhellen.","‘Abdu’l-Bahá","Ansprachen in Paris, Abschnitt 21:6, Bahá’í-Verlag","https://bibliothek.bahai.de/pubReader.php?parLangUri=abd-pt-de-21:6",57],["Die unvollkommene Seele ist ichsüchtig und denkt nur an ihr eigenes Wohl. Aber wenn sich ihre Gedanken ein bisschen weiten, beginnt sie, an das Wohl und die Bequemlichkeit ihrer Familie zu denken. Wenn die Vorstellungen noch weiter gerichtet sind, kümmert sich der Mensch um das Glück seiner Mitbürger. Und wenn er noch weiterdenkt, hat er den Ruhm seines Landes und seiner Rasse im Sinn.","‘Abdu’l-Bahá","Familie (Textzusammenstellung), Abschnitt 92:1, Bahá’í-Verlag","https://bibliothek.bahai.de/pubReader.php?parLangUri=comp-fl-de-92:1",58],["Wer zurückgezogen in seiner Kammer die von Gott offenbarten Verse spricht, wird erfahren, wie die Engel des Allmächtigen den Duft der Worte, die sein Mund ausspricht, überallhin verbreiten und das Herz jedes rechtschaffenen Menschen höher schlagen lassen.","Bahá’u’lláh","Ährenlese aus den Schriften Bahá’u’lláhs, Abschnitt 136:2, Bahá’í-Verlag","https://bibliothek.bahai.de/pubReader.php?parLangUri=bah-gwb-de-136:2",59],["Gott schaut nicht auf Farben, Er schaut auf die Herzen.","‘Abdu’l-Bahá","Die Verkündigung des Weltfriedens, Abschnitt 18:1, Bahá’í-Verlag","https://bibliothek.bahai.de/pubReader.php?parLangUri=abd-pup-de-18:1",60],["O Sohn des Seins! Lege dir selbst jeden Tag Rechenschaft ab, ehe du zur Rechenschaft gezogen wirst. Denn unerwartet kommt der Tod, und dann musst du deine Taten verantworten.","Bahá’u’lláh","Die Verborgenen Worte, aus dem Arabischen Nr. 31, Bahá’í-Verlag","https://bibliothek.bahai.de/pubReader.php?parLangUri=bah-hw-de-1.31:0_33",61],["O Sohn des Seins! Du bist Meine Lampe, und Mein Licht ist in dir. Entnimm daraus dein Leuchten und suche niemanden als Mich, denn Ich habe dich reich erschaffen und Meine Gunst über dich ergossen.","Bahá’u’lláh","Die Verborgenen Worte, aus dem Arabischen Nr. 11, Bahá’í-Verlag","https://bibliothek.bahai.de/pubReader.php?parLangUri=bah-hw-de-1.11:0_13",62],["O Sohn des Menschen! Durcheile die Weiten des Alls und durchquere die Höhen des Himmels – du wirst doch keine Ruhe finden, außer im Gehorsam gegen Unser Gebot und in der Demut vor Unserem Antlitz.","Bahá’u’lláh","Die Verborgenen Worte, aus dem Arabischen Nr. 40, Bahá’í-Verlag","https://bibliothek.bahai.de/pubReader.php?parLangUri=bah-hw-de-1.40:0_42",63],["Meditiert darüber, damit das Geheimnis unsichtbarer Dinge euch enthüllt werde und ihr die Süße geistiger Düfte atmet und die Wahrheit erkennet, dass der Allmächtige seit unvordenklichen Zeiten und bis in alle Ewigkeit Seine Diener prüft, auf dass sich Licht von Finsternis scheide, Wahrheit von Trug, Recht von Unrecht, Führung von Irrtum, Glück von Elend und Rosen von Dornen.","Bahá’u’lláh","Das Buch der Gewissheit (Kitáb-i-Íqán), Abschnitt 8, Bahá’í-Verlag","https://bibliothek.bahai.de/pubReader.php?parLangUri=bah-ki-de-8",64],["Wisse wahrlich, daß die Seele ein Zeichen Gottes ist, ein himmlischer Edelstein, dessen Wirklichkeit die gelehrtesten Menschen nicht zu begreifen vermögen, und dessen Geheimnis kein noch so scharfer Verstand je zu enträtseln hoffen kann. Sie ist von allen erschaffenen Dingen das erste, das die Vollkommenheit des Schöpfers verkündet, Seine Herrlichkeit anerkennt, sich an Seine Wahrheit hält und sich in Anbetung vor Ihm niederbeugt.","Bahá’u’lláh","Ährenlese aus den Schriften Bahá’u’lláhs, Abschnitt 82:1, Bahá’í-Verlag","https://bibliothek.bahai.de/pubReader.php?parLangUri=bah-gwb-de-82:1",65],["Der Mensch besitzt zwei Arten von Empfänglichkeit: die niederen Triebe, die wie Staub auf dem Spiegel sind, und geistige Empfänglichkeit, die in ihrem Wesen himmlisch und barmherzig ist.","‘Abdu’l-Bahá","Die Verkündigung des Weltfriedens, Abschnitt 86:2, Bahá’í-Verlag","https://bibliothek.bahai.de/pubReader.php?parLangUri=abd-pup-de-86:2",67],["Es ist die Pflicht eines jeden Menschen mit Einsicht und Verständnis, danach zu streben, das hier Niedergeschriebene in die Wirklichkeit und die Tat umzusetzen… Der ist wirklich ein Mensch, der sich heute dem Dienst am ganzen Menschengeschlecht hingibt.","Bahá’u’lláh","Ährenlese aus den Schriften Bahá’u’lláhs, Abschnitt 117:1, Bahá’í-Verlag","https://bibliothek.bahai.de/pubReader.php?parLangUri=bah-gwb-de-117:1",68],["Lasst nicht Verschiedenheiten der Meinung oder Mannigfaltigkeit des Denkens euch von eurem Nebenmenschen trennen oder in euren Herzen zur Ursache von Wortstreit, Hass und Hader werden.","‘Abdu’l-Bahá","Ansprachen in Paris, Abschnitt 15:9, Bahá’í-Verlag","https://bibliothek.bahai.de/pubReader.php?parLangUri=abd-pt-de-15:9",70],["Dieser Unterdrückte bezeugt, dass die sterblichen Menschen aus dem völligen Nichtsein zu dem Zweck ins Reich des Seins gelangten, für die Besserung der Welt zu wirken und miteinander in Einklang und Harmonie zu leben.","Bahá’u’lláh","Vertrauenswürdigkeit – eine Kardinal-Bahá’í-Tugend (Textzusammenstellung), Abschnitt 20:1, Bahá’í-Verlag","https://bibliothek.bahai.de/pubReader.php?parLangUri=comp-trw-de-20:1",71],["O Sohn des Geistes! Dies ist Mein erster Rat: Besitze ein reines, gütiges und strahlendes Herz, damit du unvergängliche Souveränität erlangest, während von Ewigkeit zu Ewigkeit.","Bahá’u’lláh","Die Verborgenen Worte, aus dem Arabischen Nr. 1, Bahá’í-Verlag","https://bibliothek.bahai.de/pubReader.php?parLangUri=bah-hw-de-1.1:0_3",72],["Folglich wird das neue Zeitalter weniger männlich und mehr von den weiblichen Leitbildern durchdrungen sein, oder genauer gesagt, es wird ein Zeitalter sein, in dem die männlichen und weiblichen Elemente der Kultur besser ausgeglichen sein werden.","‘Abdu’l-Bahá","Frauen (Textzusammenstellung), Abschnitt 25:1, Bahá’í-Verlag","https://bibliothek.bahai.de/pubReader.php?parLangUri=comp-wom-de-25:1",73],["Die dritte Lehre Bahá’u’lláhs betrifft den umfassenden Frieden zwischen den Nationen, den Religionen, den Menschen unterschiedlicher Herkunft und Hautfarbe. Er erklärte, solange Vorurteile unter den Menschen bestehen – seien sie religiös, rassistisch, patriotisch, politisch oder sektiererisch –, kann der Weltfrieden nicht verwirklicht werden.","‘Abdu’l-Bahá","Die Verkündigung des Weltfriedens, Abschnitt 113:10, Bahá’í-Verlag","https://bibliothek.bahai.de/pubReader.php?parLangUri=abd-pup-de-113:10",74],["O mein Bruder! Wenn ein wahrer Sucher sich entschließt, mit forschendem Schritt den Pfad zu betreten, der zur Erkenntnis des Altehrwürdigen der Tage führt, muss er vor allem sein Herz, den Sitz der Offenbarung der inneren Mysterien Gottes, vom trübenden Staub allen erworbenen Wissens und von den Andeutungen der Verkörperungen satanischer Wahngebilde reinigen.","Bahá’u’lláh","Das Buch der Gewissheit (Kitáb-i-Íqán), Abschnitt 213, Bahá’í-Verlag","https://bibliothek.bahai.de/pubReader.php?parLangUri=bah-ki-de-213",75],["O Sohn des Menschen! Gräme dich nicht, außer du bist Uns ferne; und freue dich nicht, außer du kommst Uns nahe und kehrest zu Uns zurück.","Bahá’u’lláh","Die Verborgenen Worte, aus dem Arabischen Nr. 35, Bahá’í-Verlag","https://bibliothek.bahai.de/pubReader.php?parLangUri=bah-hw-de-1.35:0_37",76],["Das Unrecht in der Welt besteht gerade deshalb weiter, weil die Menschen lediglich von ihren Idealen reden und nicht auch trachten, sie in Taten umzusetzen. Würden Taten an die Stelle der Worte treten, so würde das Elend auf der Welt sehr bald in Wohlergehen verwandelt werden.","‘Abdu’l-Bahá","Ansprachen in Paris, Abschnitt 1:10, Bahá’í-Verlag","https://bibliothek.bahai.de/pubReader.php?parLangUri=abd-pt-de-1:10",77],["Sollte jemand Streit mit euch suchen, trachtet danach, ihn zum Freunde zu gewinnen. Sollte jemand euch bis ins Innerste verletzen, seid ein heilender Balsam für seine Wunden. Sollte euch jemand verspotten und verhöhnen, begegnet ihm mit Liebe.","‘Abdu’l-Bahá","Briefe und Botschaften, Abschnitt 16:5, Bahá’í-Verlag","https://bibliothek.bahai.de/pubReader.php?parLangUri=abd-swa-de-16:5",78],["Gott hat dem Menschen eine besondere zusätzliche Kraft verliehen – die Fähigkeit, mit dem Verstand die Geheimnisse der Schöpfung zu erforschen und höheres Wissen zu erlangen – deren größter Vorzug die wissenschaftliche Aufklärung ist.","‘Abdu’l-Bahá","Die Verkündigung des Weltfriedens, Abschnitt 12:4, Bahá’í-Verlag","https://bibliothek.bahai.de/pubReader.php?parLangUri=abd-pup-de-12:4",79],["Seid unter allen Umständen geduldig und setzt euer ganzes Vertrauen, euere Zuversicht auf Gott.","Bahá’u’lláh","Ährenlese aus den Schriften Bahá’u’lláhs, Abschnitt 136:4, Bahá’í-Verlag","https://bibliothek.bahai.de/pubReader.php?parLangUri=bah-gwb-de-136:4",80],["Lieben Sie alle; dienen Sie allen.","‘Abdu’l-Bahá","Die Verkündigung des Weltfriedens, Abschnitt 109:16, Bahá’í-Verlag","https://bibliothek.bahai.de/pubReader.php?parLangUri=abd-pup-de-109:16",81],["Das himmlische Jerusalem ist nichts anderes als die göttliche Kultur, und es ist jetzt soweit. Sie soll und wird errichtet werden, und das Einssein der Menschheit wird eine sichtbare Tatsache sein. Die Menschheit wird dann zu einer Einheit zusammengeführt. Die verschiedenen Religionen werden geeint sein, und Menschen verschiedener Herkunft und Hautfarbe werden als Angehörige der gleichen Familie erkannt.","‘Abdu’l-Bahá","Die Verkündigung des Weltfriedens, Abschnitt 42:2, Bahá’í-Verlag","https://bibliothek.bahai.de/pubReader.php?parLangUri=abd-pup-de-42:2",82],["Liebt die Geschöpfe um Gottes willen und nicht um ihrer selbst willen. Ihr werdet niemals wütend oder ungeduldig sein, wenn ihr sie um Gottes willen liebt.","‘Abdu’l-Bahá","Die Verkündigung des Weltfriedens, Abschnitt 39:5, Bahá’í-Verlag","https://bibliothek.bahai.de/pubReader.php?parLangUri=abd-pup-de-39:5",83],["Sprich nichts Schlechtes, auf dass du nichts Schlechtes hörest, und vergrößere die Fehler anderer nicht, damit deine eigenen Fehler nicht groß erscheinen. Wünsche keinem Menschen Erniedrigung, damit deine eigene Niedrigkeit nicht offenkundig werde.","Bahá’u’lláh","Die Verborgenen Worte, aus dem Persischen Nr. 44, Bahá’í-Verlag","https://bibliothek.bahai.de/pubReader.php?parLangUri=bah-hw-de-2.44:1",84],["Ich schenke den Verzagten neue Kraft und erwecke die Toten. Ich bin das Licht der Führung, das den Weg erhellt. Ich bin der königliche Falke auf dem Arm des Allmächtigen. Ich entfalte die schlaffen Flügel jedes ermatteten Vogels und lehre ihn, wieder zu fliegen.","Bahá’u’lláh","Das Tabernakel der Einheit, Abschnitt 1:14, Bahá’í-Verlag","https://bibliothek.bahai.de/pubReader.php?parLangUri=bah-tu-de-1:14",85],["O Sohn der Liebe! Nur ein Schritt trennt dich von den herrlichen Höhen über dir und vom himmlischen Baum der Liebe. Tue diesen Schritt, und mit dem nächsten tritt ein in das Reich der Unsterblichkeit, in der Ewigkeit Zelt.","Bahá’u’lláh","Die Verborgenen Worte, aus dem Persischen Nr. 7, Bahá’í-Verlag","https://bibliothek.bahai.de/pubReader.php?parLangUri=bah-hw-de-2.7:0_81",86],["Ich hoffe, dass ihr darüber nachdenkt, eure eigenen Unvollkommenheiten ergründet und nicht an die Unvollkommenheiten anderer denkt.","‘Abdu’l-Bahá","Die Verkündigung des Weltfriedens, Abschnitt 86:4, Bahá’í-Verlag","https://bibliothek.bahai.de/pubReader.php?parLangUri=abd-pup-de-86:4",88],["Dein Auge ist Mein Pfand, laß den Staub eitler Lüste seine Klarheit nicht umwölken. Dein Ohr ist Zeichen Meiner Großmut, laß den Lärm unziemlicher Beweggründe es nicht von Meinem Worte, das die ganze Schöpfung umfaßt, abkehren. Dein Herz ist Meine Schatzkammer, laß die betrügerische Hand des Selbstes dir nicht die Perlen rauben, die Ich darin verwahre.","Bahá’u’lláh","Ährenlese aus den Schriften Bahá’u’lláhs, Abschnitt 152:1, Bahá’í-Verlag","https://bibliothek.bahai.de/pubReader.php?parLangUri=bah-gwb-de-152:1",89],["Wenn eine Handvoll Menschen sich in Liebe, in völliger Reinheit und Heiligkeit mit von der Welt gelösten Herzen versammelt, wenn sie dabei die Empfindungen des Königreiches und die machtvoll anziehende Kraft des Göttlichen verspürt, wenn sie eins ist in froher Gemeinschaft, so wird diese Versammlung ihren Einfluss über die ganze Erde breiten.","‘Abdu’l-Bahá","Briefe und Botschaften, Abschnitt 39:2, Bahá’í-Verlag","https://bibliothek.bahai.de/pubReader.php?parLangUri=abd-swa-de-39:2",90],["Es ist angemessen und richtig, dass wir in diesem erleuchteten Zeitalter – dem Zeitalter des Fortschritts der Menschenwelt – uns aufopfern und dem Menschengeschlecht dienen sollen.","‘Abdu’l-Bahá","Briefe und Botschaften, Abschnitt 34:1, Bahá’í-Verlag","https://bibliothek.bahai.de/pubReader.php?parLangUri=abd-swa-de-34:1",91],["Die Menschenwelt besitzt zwei Flügel, den männlichen und den weiblichen. Solange diese beiden Flügel nicht gleich stark sind, wird der Vogel nicht fliegen. Solange die Frau nicht den gleichen Rang einnimmt wie der Mann, solange sie nicht die gleichen Tätigkeiten ausübt, wird die Menschheit keine außergewöhnlichen Erfolge zeitigen, kann sich die Menschheit nicht zu den Höhen wahrer Errungenschaften aufschwingen.","‘Abdu’l-Bahá","Die Verkündigung des Weltfriedens, Abschnitt 113:13, Bahá’í-Verlag","https://bibliothek.bahai.de/pubReader.php?parLangUri=abd-pup-de-113:13",92],["Beschmutzt eure Zunge nicht mit übler Nachrede.","‘Abdu’l-Bahá","Die Verkündigung des Weltfriedens, Abschnitt 134:2, Bahá’í-Verlag","https://bibliothek.bahai.de/pubReader.php?parLangUri=abd-pup-de-134:2",93],["Seid großzügig in Tagen der Fülle und geduldig in der Stunde des Verlustes. Auf Not kommt Erfolg, und Jubel folgt dem Wehe.","Bahá’u’lláh","Botschaften aus ‘Akká, Abschnitt 9:4, Bahá’í-Verlag","https://bibliothek.bahai.de/pubReader.php?parLangUri=bah-tb-de-9:4",94],["In der Welt des Seins gibt es wahrlich keine größere Macht als die der Liebe.","‘Abdu’l-Bahá","Ansprachen in Paris, Abschnitt 58:3, Bahá’í-Verlag","https://bibliothek.bahai.de/pubReader.php?parLangUri=abd-pt-de-58:3",95],["Darum sprach Christus zur Welt: »Wenn ihr nicht umkehret und wie die Kinder werdet, so werdet ihr nicht ins Himmelreich gelangen.« Das bedeutet, dass die Menschen ein reines Herz entwickeln müssen, um Gott zu erkennen. Diese Lehren hatten eine große Wirkung. Geistige Seelen! Sanfte Seelen! Die Herzen aller Kinder sind von größter Reinheit. Sie sind Spiegel, auf die kein Staub gefallen ist.","‘Abdu’l-Bahá","Die Verkündigung des Weltfriedens, Abschnitt 21:2, Bahá’í-Verlag","https://bibliothek.bahai.de/pubReader.php?parLangUri=abd-pup-de-21:2",96],["So wisse denn, dass Gott, der Herr, über unsichtbare Reiche gebietet, die des Menschen Verstand niemals erfassen, des Menschen Geist niemals begreifen kann.","‘Abdu’l-Bahá","Briefe und Botschaften, Abschnitt 156:11, Bahá’í-Verlag","https://bibliothek.bahai.de/pubReader.php?parLangUri=abd-swa-de-156:11",97],["Selig, wer standhaft bleibt in Leid und Not, wer nicht darüber klagt, was ihm widerfährt, und auf dem Pfade der Geduld wandelt.","Bahá’u’lláh","Anspruch und Verkündigung, Abschnitt 5:47, Bahá’í-Verlag","https://bibliothek.bahai.de/pubReader.php?parLangUri=bah-slh-de-5:47",98],["Die Wahrheit ist jedoch, dass die vernunftbegabte Seele das Substanzielle ist, durch das der Körper besteht. Wenn das Nicht-Wesentliche – der Körper – zerstört wird, bleibt das Substanzielle – der Geist – übrig.","‘Abdu’l-Bahá","Beantwortete Fragen, Abschnitt 66:2, Bahá’í-Verlag","https://bibliothek.bahai.de/pubReader.php?parLangUri=abd-saq-de-66:2",99],["Das Erhabenste Wesen spricht: Betrachte den Menschen als ein Bergwerk, reich an Edelsteinen von unschätzbarem Wert. Nur die Erziehung kann bewirken, daß es seine Schätze enthüllt und die Menschheit daraus Nutzen zu ziehen vermag.","Bahá’u’lláh","Botschaften aus ‘Akká, Abschnitt 11:2, Bahá’í-Verlag","https://bibliothek.bahai.de/pubReader.php?parLangUri=bah-tb-de-11:2",100],["Verlasse dich auf Gott. Vertraue Ihm. Preise Ihn und gedenke Seiner ständig. Er verwandelt wahrlich Kummer in Wohlbefinden, Sorge in Trost, Mühsal in vollkommenen Frieden. Er hat wahrlich Herrschaft über alle Dinge.","‘Abdu’l-Bahá","Briefe und Botschaften, Abschnitt 150:3, Bahá’í-Verlag","https://bibliothek.bahai.de/pubReader.php?parLangUri=abd-swa-de-150:3",101],["wie Gott, der Erhabene, spricht: »Wir werden ihn gewiss zu einem glücklichen Leben erwecken.« Höchste Bedeutung ist deshalb nicht dieser ersten Erschaffung beizumessen, sondern dem künftigen Leben.","‘Abdu’l-Bahá","Briefe und Botschaften, Abschnitt 165:4, Bahá’í-Verlag","https://bibliothek.bahai.de/pubReader.php?parLangUri=abd-swa-de-165:4",102],["Geistiger Fortschritt gewährleistet das Glück und das ewige Leben der Seele.","‘Abdu’l-Bahá","Die Verkündigung des Weltfriedens, Abschnitt 52:6, Bahá’í-Verlag","https://bibliothek.bahai.de/pubReader.php?parLangUri=abd-pup-de-52:6",103],["Diese Beispiele alle sollen euch zeigen, dass die Prüfungen, die jeden unserer Schritte umlagern, alle unsere Sorgen, Leiden, Schmach und Kummer aus der Welt des Stoffes kommen, wogegen das geistige Reich nie Traurigkeit verursacht. Ein Mensch, der mit seinen Gedanken in diesem Reiche lebt, kennt dauernde Freude.","‘Abdu’l-Bahá","Ansprachen in Paris, Abschnitt 35:6, Bahá’í-Verlag","https://bibliothek.bahai.de/pubReader.php?parLangUri=abd-pt-de-35:6",104],["Liebe ist großartiger als Frieden, denn Frieden beruht auf Liebe. Die Liebe ist die Grundlage des Friedens, und Frieden entsteht aus Liebe. Solange man keine Liebe erlangt, kann es keinen Frieden geben; aber es gibt einen sogenannten Frieden ohne Liebe. Die Liebe, die von Gott kommt, ist das Grundlegende. Diese Liebe ist das Ziel jeder menschlichen Errungenschaft, der Glanz des Himmels, das Licht des Menschen.","‘Abdu’l-Bahá","Die Verkündigung des Weltfriedens, Abschnitt 60:19, Bahá’í-Verlag","https://bibliothek.bahai.de/pubReader.php?parLangUri=abd-pup-de-60:19",105],["Kummer und Sorge überkommen uns nicht zufällig, sie werden uns vielmehr durch die göttliche Gnade zu unserer eigenen Vervollkommnung gesandt.","‘Abdu’l-Bahá","Ansprachen in Paris, Abschnitt 14:7, Bahá’í-Verlag","https://bibliothek.bahai.de/pubReader.php?parLangUri=abd-pt-de-14:7",106],["Nichts ist für den Menschen nützlicher als das Wissen um die eigenen Unzulänglichkeiten.","‘Abdu’l-Bahá","Die Verkündigung des Weltfriedens, Abschnitt 86:4, Bahá’í-Verlag","https://bibliothek.bahai.de/pubReader.php?parLangUri=abd-pup-de-86:4",107],["Wendet euch Gott zu, fleht demütig an Seiner Schwelle, trachtet nach Beistand und Bestätigung, damit Gott die Schleier zerreiße, die eure Sicht behindern. Dann werden eure Augen erleuchtet, von Angesicht zu Angesicht werdet ihr die Wahrheit Gottes erblicken und euer Herz wird vom Schmutz der Unwissenheit völlig gereinigt werden und die Herrlichkeit und Gaben des Gottesreiches widerspiegeln.","‘Abdu’l-Bahá","Die Verkündigung des Weltfriedens, Abschnitt 97:8, Bahá’í-Verlag","https://bibliothek.bahai.de/pubReader.php?parLangUri=abd-pup-de-97:8",108],["Handelt so, dass euer Herz frei von Hass ist.","‘Abdu’l-Bahá","Die Verkündigung des Weltfriedens, Abschnitt 134:2, Bahá’í-Verlag","https://bibliothek.bahai.de/pubReader.php?parLangUri=abd-pup-de-134:2",110],["Wahrlich, Ich sage, die menschliche Seele ist über allen Austritt und alle Rückkehr erhaben. Sie ist in Ruhe und doch schwingt sie sich auf; sie schreitet fort, und doch ist sie in Ruhe. Sie ist in sich selbst Beweis für das Dasein einer bedingten Welt wie auch für die Wirklichkeit einer Welt, die weder Anfang noch Ende hat.","Bahá’u’lláh","Ährenlese aus den Schriften Bahá’u’lláhs, Abschnitt 82:8, Bahá’í-Verlag","https://bibliothek.bahai.de/pubReader.php?parLangUri=bah-gwb-de-82:8",111],["Sie sollten Gott von Herzen dankbar sein, und die beste Art, Gott zu danken, ist, einander zu lieben.","‘Abdu’l-Bahá","Die Verkündigung des Weltfriedens, Abschnitt 140:3, Bahá’í-Verlag","https://bibliothek.bahai.de/pubReader.php?parLangUri=abd-pup-de-140:3",112],["Auch wenn ihr Menschen trefft, deren Meinung von der euren abweicht, kehrt euch nicht ab von ihnen","‘Abdu’l-Bahá","Ansprachen in Paris, Abschnitt 15:8, Bahá’í-Verlag","https://bibliothek.bahai.de/pubReader.php?parLangUri=abd-pt-de-15:8",113],["Unsere wenigen kurzen Tage gehen dahin, unser Leben schwindet vor unseren Augen. Die Rosen dieser Welt bleiben nicht frisch und schön; der Garten dieser Erde, wo Siegesfreude und Vergnügen blühen, verdorrt und verwelkt. Die Frühlingszeit des Lebens verwandelt sich in den Herbst des Todes, der helle Jubel der Palastsäle weicht dem Neumond des Grabes. Deshalb verdient nichts von alledem unsere Liebe, und der Weise hängt sein Herz nicht daran.","‘Abdu’l-Bahá","Briefe und Botschaften, Abschnitt 188:13, Bahá’í-Verlag","https://bibliothek.bahai.de/pubReader.php?parLangUri=abd-swa-de-188:13",114],["Gleicherweise muss er sich in dieser Welt auf das jenseitige Leben vorbereiten. Was er im Reich Gottes benötigt, muss er hier erwerben. Ebenso wie er sich im Mutterleib für diese Welt vorbereitete, indem er sich die in dieser Daseinssphäre notwendigen Kräfte aneignete, so müssen in dieser Welt die für das himmlische Leben unentbehrlichen Kräfte angelegt werden.","‘Abdu’l-Bahá","Die Verkündigung des Weltfriedens, Abschnitt 81:3, Bahá’í-Verlag","https://bibliothek.bahai.de/pubReader.php?parLangUri=abd-pup-de-81:3",115],["Liebet sie alle von ganzem Herzen. Keiner ist für den anderen ein Fremder, alle sind Freunde.","‘Abdu’l-Bahá","Ansprachen in Paris, Abschnitt 53:13, Bahá’í-Verlag","https://bibliothek.bahai.de/pubReader.php?parLangUri=abd-pt-de-53:13",116],["Seid freundlich zu allen Völkern, kümmert euch um jeden Menschen, tut, was ihr könnt, um die Herzen und Gemüter der Menschen zu läutern, und bemüht euch, jede Seele zu erfreuen. Seid für jede Au ein Regenschauer der Gnade, für jeden Baum das Wasser des Lebens, seid wie süßer Moschus für den Sinn der Menschen, und für die Kranken seid eine frische, belebende Brise.","‘Abdu’l-Bahá","Briefe und Botschaften, Abschnitt 200:8, Bahá’í-Verlag","https://bibliothek.bahai.de/pubReader.php?parLangUri=abd-swa-de-200:8",117],["Beratung verleiht tiefere Kenntnis und verwandelt Vermutung in Gewissheit. Sie ist ein strahlendes Licht, das in einer dunklen Welt den Weg weist und Führung gibt. Für alles gibt es und wird es immer eine Stufe der Vollendung und Reife geben.","Bahá’u’lláh","Beratung (Textzusammenstellung), Abschnitt 3:1, Bahá’í-Verlag","https://bibliothek.bahai.de/pubReader.php?parLangUri=comp-con-de-3:1",118],["Sprich: Laßt Wahrhaftigkeit und Höflichkeit euer Schmuck sein. Duldet nicht, daß ihr des Gewandes der Langmut und der Gerechtigkeit beraubt werdet, damit aus eueren Herzen die süßen Düfte der Heiligkeit über alles Erschaffene wehen.","Bahá’u’lláh","Ährenlese aus den Schriften Bahá’u’lláhs, Abschnitt 139:8, Bahá’í-Verlag","https://bibliothek.bahai.de/pubReader.php?parLangUri=bah-gwb-de-139:8",119],["Genauso ist das endlose Weltall zu sehen: Auch dort herrscht unausweichlich eine allumfassende Kraft, die alle Teile dieser unendlichen Schöpfung regelt und steuert. Gäbe es diesen Regler und Steuerer nicht, wäre das Weltall voller Mängel und Fehler.","‘Abdu’l-Bahá","Briefe und Botschaften, Abschnitt 21:8, Bahá’í-Verlag","https://bibliothek.bahai.de/pubReader.php?parLangUri=abd-swa-de-21:8",120],["Religion ist der äußere Ausdruck der göttlichen Wahrheit. Deshalb muss sie lebendig, kraftvoll, in Bewegung und fortschrittlich sein. Ohne Bewegung und Fortschritt fehlt ihr die göttliche Lebenskraft und sie ist tot.","‘Abdu’l-Bahá","Die Verkündigung des Weltfriedens, Abschnitt 52:2, Bahá’í-Verlag","https://bibliothek.bahai.de/pubReader.php?parLangUri=abd-pup-de-52:2",121],["O Volk der Gerechtigkeit! Sei so strahlend wie das Licht und so leuchtend wie das Feuer, das im Brennenden Busche lodert. Der Glanz des Feuers eurer Liebe wird zweifellos die widerstreitenden Völker und Geschlechter der Erde einen und verschmelzen, wogegen die wilde Flamme der Feindschaft und des Hasses nur zu Streit und Untergang führen kann.","Bahá’u’lláh","Ährenlese aus den Schriften Bahá’u’lláhs, Abschnitt 43:7, Bahá’í-Verlag","https://bibliothek.bahai.de/pubReader.php?parLangUri=bah-gwb-de-43:7",122],["Sei gerecht in deinem Urteil und behutsam in deiner Rede. Sei zu keinem Menschen ungerecht und erweise allen Sanftmut. Sei wie eine Lampe für die, so im Dunkeln gehen, eine Freude den Betrübten, ein Meer für die Dürstenden, ein schützender Port für die Bedrängten, Stütze und Verteidiger für das Opfer der Unterdrückung. Laß Lauterkeit und Redlichkeit all dein Handeln auszeichnen. Sei ein Heim dem Fremdling, ein Balsam dem Leidenden, dem Flüchtling ein starker Turm.","Bahá’u’lláh","Ährenlese aus den Schriften Bahá’u’lláhs, Abschnitt 130:1, Bahá’í-Verlag","https://bibliothek.bahai.de/pubReader.php?parLangUri=bah-gwb-de-130:1",123],["O Sohn des Menschen! Verhüllt in Meinem unvordenklichen Sein und in der Urewigkeit Meines Wesens, wusste Ich um Meine Liebe zu dir. Darum erschuf Ich dich, prägte dir Mein Ebenbild ein und offenbarte dir Meine Schönheit.","Bahá’u’lláh","Die Verborgenen Worte, aus dem Arabischen Nr. 3, Bahá’í-Verlag","https://bibliothek.bahai.de/pubReader.php?parLangUri=bah-hw-de-1.3:0_5",124],["Ruhm gebührt nicht dem, der sein eigenes Land liebt, sondern dem, der die ganze Welt liebt. Die Erde ist nur ein Land, und alle Menschen sind seine Bürger.","Bahá’u’lláh","Die Weltordnung Bahá’u’lláhs, Abschnitt 7:96, Bahá’í-Verlag","https://bibliothek.bahai.de/pubReader.php?parLangUri=sho-wob-de-7:96",125],["Fügt niemandem Leid zu. Betet für alle. Bemühet euch, daß euer Licht in der Welt leuchten und euer Banner hoch in die Himmel flattern möge. Der schöne Duft eures edlen Lebens wird alles erfüllen. Das Licht der Wahrheit, das in euren Herzen entzündet ist, wird in die fernste Ferne scheinen!","‘Abdu’l-Bahá","Ansprachen in Paris, Abschnitt 38:10, Bahá’í-Verlag","https://bibliothek.bahai.de/pubReader.php?parLangUri=abd-pt-de-38:10",126],["Wer die Schöpfung eingehend untersucht, wer die Feinheiten alles Erschaffenen erfasst und den Zustand, die Ordnung und die Vollendung der Welt des Seins erkennt, der wird von der Wahrheit überzeugt sein, dass »es nichts Wundersameres in der Schöpfung gibt, als das, was bereits existiert«.","‘Abdu’l-Bahá","Beantwortete Fragen, Abschnitt 46:2, Bahá’í-Verlag","https://bibliothek.bahai.de/pubReader.php?parLangUri=abd-saq-de-46:2",127],["Das annehmbarste Gebet ist das, welches in höchster, strahlender Geistigkeit dargebracht wird. Es lange hinzuziehen, war und ist nicht im Sinne Gottes. Je hingebungsvoller und reiner das Gebet ist, um so annehmbarer ist es in Gottes Gegenwart.","Der Báb","Der Báb – Eine Auswahl aus Seinen Schriften, Abschnitt 3.2:4, Bahá’í-Verlag","https://bibliothek.bahai.de/pubReader.php?parLangUri=bab-swb-de-3.2:4",128],["Der Geist, der durch die Heiligen Schriften weht, ist Nahrung für alle, die hungern. Gott, der Seinen Propheten die Offenbarung gab, wird gewiss aus Seiner Fülle heraus allen tägliches Brot gewähren, die Ihn ehrlich darum bitten.","‘Abdu’l-Bahá","Ansprachen in Paris, Abschnitt 16:10, Bahá’í-Verlag","https://bibliothek.bahai.de/pubReader.php?parLangUri=abd-pt-de-16:10",129],["Ich bitte flehentlich für jeden und alle, dass ihr wie Flammen der Liebe in der Welt sein möget und dass die Helligkeit eures Lichts und die Wärme eurer Zuneigung zum Herzen eines jeden traurigen und bekümmerten Gotteskindes finden.","‘Abdu’l-Bahá","Ansprachen in Paris, Abschnitt 30:8, Bahá’í-Verlag","https://bibliothek.bahai.de/pubReader.php?parLangUri=abd-pt-de-30:8",130],["Zu jedem menschlichen Wesen müsst ihr unendlich freundlich sein.","‘Abdu’l-Bahá","Briefe und Botschaften, Abschnitt 221:12, Bahá’í-Verlag","https://bibliothek.bahai.de/pubReader.php?parLangUri=abd-swa-de-221:12",131],["Handelt so, daß euer Herz von Haß frei ist. Fühlt euch niemals beleidigt. Wenn jemand einen Fehler begeht und euch Unrecht tut, müßt ihr ihm augenblicklich vergeben. Beklagt euch nicht über andere. Hütet euch, sie zu tadeln, und wenn ihr eine Ermahnung oder einen Rat geben wollt, dann tut das in einer Weise, daß es den Belehrten nicht belastet.","‘Abdu’l-Bahá","Die Verkündigung des Weltfriedens, Abschnitt 134:2, Bahá’í-Verlag","https://bibliothek.bahai.de/pubReader.php?parLangUri=abd-pup-de-134:2",132],["In der Schatzkammer Unserer Weisheit liegt ein Wissen verborgen, von dem ein einziges Wort, beliebten Wir es der Menschheit zu enthüllen, jeden Menschen dazu brächte, Gottes Offenbarung zu erkennen und Seine Allwissenheit anzuerkennen. Jeden würde es befähigen, die Geheimnisse aller Wissenschaften zu entdecken und eine Stufe zu erreichen, die ihn völlig unabhängig machte von aller bisherigen und künftigen Gelehrtheit.","Bahá’u’lláh","Anspruch und Verkündigung, Abschnitt 1:66, Bahá’í-Verlag","https://bibliothek.bahai.de/pubReader.php?parLangUri=bah-slh-de-1:66",133],["Alle sollten wissen und diesbezüglich den Glanz der Sonne der Gewissheit erlangen und von ihr erleuchtet werden: Frauen und Männer waren in den Augen Gottes immer gleich und werden es immer sein.","Bahá’u’lláh","Der Welt Ordnung geben (Textzusammenstellung), Abschnitt 31:1, Bahá’í-Verlag","https://bibliothek.bahai.de/pubReader.php?parLangUri=comp-swo-de-31:1",134],["Wer weder gute Werke vollbringt noch die Andacht verrichtet, der gleicht einem Baum, der keine Frucht trägt, und einem Tun, das keine Spuren hinterlässt.","Bahá’u’lláh","Die Bedeutung von Pflichtgebet und Fasten (Textzusammenstellung), Abschnitt 3:1, Bahá’í-Verlag","https://bibliothek.bahai.de/pubReader.php?parLangUri=comp-paf-de-3:1",135],["All diese Lehren sind nur eine Wahrheit, denn die Wahrheit ist eins und lässt keine Vielheit zu. Daher sind die göttlichen Propheten eins, weil sie die eine Wahrheit offenbaren, das Wort Gottes.","‘Abdu’l-Bahá","Die Verkündigung des Weltfriedens, Abschnitt 103:3, Bahá’í-Verlag","https://bibliothek.bahai.de/pubReader.php?parLangUri=abd-pup-de-103:3",136],["In jedem Menschen gibt es Unvollkommenheiten, und ihr werdet immer unglücklich, wenn ihr auf die Menschen selbst schaut. Wenn ihr aber auf Gott schaut, werdet ihr sie lieben und freundlich zu ihnen sein; denn die Welt Gottes ist die Welt der Vollkommenheit und vollendeter Barmherzigkeit.","‘Abdu’l-Bahá","Die Verkündigung des Weltfriedens, Abschnitt 39:5, Bahá’í-Verlag","https://bibliothek.bahai.de/pubReader.php?parLangUri=abd-pup-de-39:5",137],["Liebe ist das größte Gesetz, das diesen mächtigen, himmlischen Zyklus regiert, die einzigartige Kraft, welche die verschiedenen Elemente der stofflichen Welt zusammenhält, die höchste Anziehungskraft, welche die Bewegung der Sphären in den Himmelsreichen regiert.","‘Abdu’l-Bahá","Briefe und Botschaften, Abschnitt 12:1, Bahá’í-Verlag","https://bibliothek.bahai.de/pubReader.php?parLangUri=abd-swa-de-12:1",138],["Ihr solltet ferner wissen, dass Gott den Menschen mit Verstandeskraft ausgestattet hat, die ihn befähigt, nach der Wahrheit zu forschen. Gott hat den Menschen nicht dazu bestimmt, blindlings seinen Vorfahren zu folgen. Er hat ihm Verstand und Vernunft gegeben, um damit die Wahrheit zu suchen und zu entdecken, und was er als wahr und richtig erkennt, muss er annehmen.","‘Abdu’l-Bahá","Die Verkündigung des Weltfriedens, Abschnitt 97:5, Bahá’í-Verlag","https://bibliothek.bahai.de/pubReader.php?parLangUri=abd-pup-de-97:5",139],["Kurz, jede Mühe und Anstrengung, die der Mensch mit der ganzen Kraft seines Herzens unternimmt, ist Gottesdienst, sofern es die hehrsten Motive sind und der Wunsch, der Menschheit zu dienen, die ihn antreiben. Gott zu dienen heißt: der Menschheit dienen und sich der Nöte der Menschen annehmen. Dienen ist Gebet.","‘Abdu’l-Bahá","Ansprachen in Paris, Abschnitt 55:2, Bahá’í-Verlag","https://bibliothek.bahai.de/pubReader.php?parLangUri=abd-pt-de-55:2",140],["Ich heiße euch alle und jeden von euch, alles, was ihr im Herzen habt, auf Liebe und Einigkeit zu richten. Wenn ein Kriegsgedanke kommt, so widersteht ihm mit einem stärkeren Gedanken des Friedens. Ein Hassgedanke muss durch einen mächtigeren Gedanken der Liebe vernichtet werden. Kriegsgedanken zerstören alle Eintracht, Wohlfahrt, Ruhe und Freude.","‘Abdu’l-Bahá","Ansprachen in Paris, Abschnitt 6:7, Bahá’í-Verlag","https://bibliothek.bahai.de/pubReader.php?parLangUri=abd-pt-de-6:7",141],["Offensichtlich sind alle erschaffenen Dinge durch vollständige, vollkommene Verknüpfung miteinander verbunden, wie zum Beispiel die Glieder des menschlichen Körpers.","‘Abdu’l-Bahá","Briefe und Botschaften, Abschnitt 21:6, Bahá’í-Verlag","https://bibliothek.bahai.de/pubReader.php?parLangUri=abd-swa-de-21:6",142],["Im Vorangegangenen wurde zumindest darzulegen versucht, dass Glück und Größe, Rang und Stufe, Freude und Frieden eines Menschen nie auf seinem persönlichen Reichtum beruhen, vielmehr auf seinem hervorragenden Charakter, seinem hehren Entschluss, seiner umfassenden Bildung und seiner Fähigkeit, schwierige Probleme zu lösen.","‘Abdu’l-Bahá","Das Geheimnis göttlicher Kultur, Abschnitt 44, Bahá’í-Verlag","https://bibliothek.bahai.de/pubReader.php?parLangUri=abd-sdc-de-44",143],["Jedes Kind hat die Möglichkeit in sich, das Licht der Welt zu sein – und genauso ihre Dunkelheit. Deshalb muss der Frage der Erziehung höchste Bedeutung beigemessen werden.","‘Abdu’l-Bahá","Briefe und Botschaften, Abschnitt 103:5, Bahá’í-Verlag","https://bibliothek.bahai.de/pubReader.php?parLangUri=abd-swa-de-103:5",144],["Neigt euer Ohr dem Ruf des unvergleichlichen, selbstbestehenden Herrn, damit Er euch aus den Verstrickungen in Irdisches löse, euch aus der Finsternis befreie und zum ewigen Licht führe.","Bahá’u’lláh","Das Tabernakel der Einheit, Abschnitt 5:1, Bahá’í-Verlag","https://bibliothek.bahai.de/pubReader.php?parLangUri=bah-tu-de-5:1",145],["O mein Bruder! Ein reines Herz ist wie ein Spiegel, mache ihn durch Liebe und Loslösung rein von allem außer Gott, auf daß sich die wahre Sonne darin spiegeln und der ewige Morgen emporsteigen möge.","Bahá’u’lláh","Sieben Täler – Vier Täler, Abschnitt 1:48, Bahá’í-Verlag","https://bibliothek.bahai.de/pubReader.php?parLangUri=bah-svfv-de-1:48",146],["O Sohn des Menschen! Ist Wohlstand dir beschieden, so juble nicht, und ist Erniedrigung dein Los, so gräme dich nicht; denn beides wird vergehen und nicht mehr sein.","Bahá’u’lláh","Die Verborgenen Worte, aus dem Arabischen Nr. 52, Bahá’í-Verlag","https://bibliothek.bahai.de/pubReader.php?parLangUri=bah-hw-de-1.52:0_54",147],["Die erste Lehre ist das unabhängige Forschen nach der Wahrheit; denn blinde Nachahmung des Vergangenen lässt den Geist verkümmern. Sobald aber jede Seele nach der Wahrheit forscht, ist die Gesellschaft befreit vom Dunkel des ständigen Wiederholens der Vergangenheit.","‘Abdu’l-Bahá","Briefe und Botschaften, Abschnitt 202:8, Bahá’í-Verlag","https://bibliothek.bahai.de/pubReader.php?parLangUri=abd-swa-de-202:8",148],["Erleuchtet und heiligt euere Herzen. Entweiht sie nicht mit den Dornen des Hasses und den Disteln der Bosheit. Ihr wohnt in einer Welt und seid durch das Wirken eines Willens erschaffen. Selig ist, wer sich mit allen Menschen im Geiste größter Freundlichkeit und Liebe vereinigt.«","Bahá’u’lláh","Ährenlese aus den Schriften Bahá’u’lláhs, Abschnitt 156:1, Bahá’í-Verlag","https://bibliothek.bahai.de/pubReader.php?parLangUri=bah-gwb-de-156:1",149],["Bestimmte Angelegenheiten unterliegen dem freien Willen des Menschen, wie zum Beispiel gerechtes, unparteiisches oder auch unrechtes, schädliches Handeln – mit anderen Worten, die Wahl zwischen guten und bösen Taten. Es ist ganz offensichtlich, dass der Wille des Menschen bei solchen Taten eine große Rolle spielt.","‘Abdu’l-Bahá","Beantwortete Fragen, Abschnitt 70:3, Bahá’í-Verlag","https://bibliothek.bahai.de/pubReader.php?parLangUri=abd-saq-de-70:3",150],["Sei freigebig im Glück und dankbar im Unglück. Sei des Vertrauens deines Nächsten wert und schaue hellen und freundlichen Auges auf ihn. Sei ein Schatz dem Armen, ein Mahner dem Reichen, eine Antwort auf den Schrei des Bedürftigen, und halte dein Versprechen heilig.","Bahá’u’lláh","Ährenlese aus den Schriften Bahá’u’lláhs, Abschnitt 130:1, Bahá’í-Verlag","https://bibliothek.bahai.de/pubReader.php?parLangUri=bah-gwb-de-130:1",151],["Dem Erscheinen des Geistes im Körper liegt folgende Weisheit zugrunde: Der menschliche Geist ist ein von Gott anvertrautes Gut und muss alle Stufen durchschreiten, denn indem er die Stufen des Daseins durchschreitet, erlangt er Vollkommenheit.","‘Abdu’l-Bahá","Beantwortete Fragen, Abschnitt 52:2, Bahá’í-Verlag","https://bibliothek.bahai.de/pubReader.php?parLangUri=abd-saq-de-52:2",152],["Der Wesenskern der göttlichen Religion besteht aus einer einzigen Wahrheit, unteilbar und nicht aus verschiedenen Teilen zusammengesetzt. Sie ist eine Einzige. Und wenn wir das untersuchen und feststellen, dass sie eine einzige ist, haben wir eine Grundlage für die Einheit der Menschenwelt.","‘Abdu’l-Bahá","Die Verkündigung des Weltfriedens, Abschnitt 16:8, Bahá’í-Verlag","https://bibliothek.bahai.de/pubReader.php?parLangUri=abd-pup-de-16:8",153],["Lasst uns zu Spiegeln werden, welche die himmlische Wirklichkeit ausstrahlen, so rein, dass die Sterne des Himmels aus uns leuchten.","‘Abdu’l-Bahá","Ansprachen in Paris, Abschnitt 54:20, Bahá’í-Verlag","https://bibliothek.bahai.de/pubReader.php?parLangUri=abd-pt-de-54:20",154],["O Sohn der Erde! Wisse wahrlich: Ein Herz, darinnen noch die leiseste Spur von Neid verbleibt, soll niemals in Mein ewiges Reich gelangen noch die süßen Düfte der Heiligkeit atmen, die aus Meinem hochheiligen Reiche wehen.","Bahá’u’lláh","Die Verborgenen Worte, aus dem Persischen Nr. 6, Bahá’í-Verlag","https://bibliothek.bahai.de/pubReader.php?parLangUri=bah-hw-de-2.6:0_80",156],["Seid aufrichtig freundlich, nicht nur dem Anschein nach.","‘Abdu’l-Bahá","Briefe und Botschaften, Abschnitt 1:7, Bahá’í-Verlag","https://bibliothek.bahai.de/pubReader.php?parLangUri=abd-swa-de-1:7",157],["Gott hat den Menschen mit Vernunft ausgestattet, damit er sich selbst sichern und beschützen kann. Deshalb muss er sich mit allem versorgen und umgeben, was wissenschaftliche Sachkenntnis hervorbringen kann. Er muss besonnen, umsichtig und gründlich in seinen Vorhaben sein, die besten Schiffe bauen und die erfahrensten Kapitäne einsetzen, doch obendrein muss er Gott vertrauen und an Ihn als den alleinigen Erhalter glauben.","‘Abdu’l-Bahá","Die Verkündigung des Weltfriedens, Abschnitt 19:4, Bahá’í-Verlag","https://bibliothek.bahai.de/pubReader.php?parLangUri=abd-pup-de-19:4",158],["Das unvollkommene Auge sieht Unvollkommenheiten. Das Auge, das nicht auf die Fehler achtet, schaut auf den Schöpfer der Seelen.","‘Abdu’l-Bahá","Die Verkündigung des Weltfriedens, Abschnitt 39:5, Bahá’í-Verlag","https://bibliothek.bahai.de/pubReader.php?parLangUri=abd-pup-de-39:5",159],["Künste und Wissenschaften bringt diese Fähigkeit aus dem Bereich des Unsichtbaren hervor. Erfindungen werden durch sie ermöglicht, gewaltige Unternehmungen ins Leben gerufen. Durch sie können Regierungen reibungslos ihren Aufgaben nachkommen. Durch diese Fähigkeit findet der Mensch Zugang zum Reiche Gottes.","‘Abdu’l-Bahá","Ansprachen in Paris, Abschnitt 54:15, Bahá’í-Verlag","https://bibliothek.bahai.de/pubReader.php?parLangUri=abd-pt-de-54:15",160],["Es gibt zwei Arten von Schicksal: Eines ist unwiderruflich und das andere ist bedingt, oder wie man sagt in der Schwebe. Unwiderrufliches Schicksal ist nicht zu ändern oder abzuwenden, während bedingtes Schicksal eintreffen kann oder auch nicht.","‘Abdu’l-Bahá","Beantwortete Fragen, Abschnitt 68:2, Bahá’í-Verlag","https://bibliothek.bahai.de/pubReader.php?parLangUri=abd-saq-de-68:2",161],["Es ist daher offensichtlich, dass der Mensch aus zwei Blickwinkeln betrachtet werden muss: Als Tier ist er der Natur unterworfen, aber in seinem geistigen beziehungsweise bewussten Wesen überschreitet er die Grenzen materiellen Daseins. Seine geistigen Kräfte, die edler und höher sind, besitzen Qualitäten, auf die es in der Natur selbst keine Hinweise gibt. Deshalb siegen die geistigen Kräfte des Menschen über die Naturgegebenheiten.","‘Abdu’l-Bahá","Die Verkündigung des Weltfriedens, Abschnitt 35:4, Bahá’í-Verlag","https://bibliothek.bahai.de/pubReader.php?parLangUri=abd-pup-de-35:4",162],["Im Menschen sind zwei Naturen: seine geistige oder höhere und seine materielle oder niedere Natur. In der einen nähert er sich Gott, wogegen er in der anderen nur für die Welt lebt. Von beiden Naturen finden sich im Menschen Zeichen.","‘Abdu’l-Bahá","Ansprachen in Paris, Abschnitt 18:2, Bahá’í-Verlag","https://bibliothek.bahai.de/pubReader.php?parLangUri=abd-pt-de-18:2",163],["Solange die Kinder noch klein sind, nährt sie an der Brust himmlischer Gnade, hegt sie in der Wiege aller Vollkommenheiten, zieht sie groß in den Armen der Gabenfülle. Gönnt ihnen den Vorzug alles brauchbaren Wissens. Lasst sie teilhaben an jedem neuen, trefflichen, wundersamen Handwerk und Kunstgewerbe. Erzieht sie zu Arbeit und Einsatz, gewöhnt sie an Mühsal. Lehrt sie, ihr Leben wichtigen Dingen zu widmen, begeistert sie zu Studien, die der Menschheit nützen.","‘Abdu’l-Bahá","Briefe und Botschaften, Abschnitt 102:3, Bahá’í-Verlag","https://bibliothek.bahai.de/pubReader.php?parLangUri=abd-swa-de-102:3",164],["Wisse, dass es eine der verwirrendsten Fragen des Göttlichen ist, dass die Welt des Daseins – das heißt, dieses unendliche Universum – keinen Anfang hat.","‘Abdu’l-Bahá","Beantwortete Fragen, Abschnitt 47:1, Bahá’í-Verlag","https://bibliothek.bahai.de/pubReader.php?parLangUri=abd-saq-de-47:1",165],["Erschautest du das ewige Reich, so strebtest du danach, dieser vergänglichen Welt zu entsagen. Doch dass das eine dir verborgen, die andere dir offenbar ward, ist ein Mysterium, das nur versteht, wer reinen Herzens ist.","Bahá’u’lláh","Die Verborgenen Worte, aus dem Persischen Nr. 41, Bahá’í-Verlag","https://bibliothek.bahai.de/pubReader.php?parLangUri=bah-hw-de-2.41:1",166],["Wissen gleicht den Flügeln für des Menschen Leben, einer Leiter für seinen Aufstieg. Es ist jedermanns Pflicht, sich Wissen zu erwerben.","Bahá’u’lláh","Botschaften aus ‘Akká, Abschnitt 5:13, Bahá’í-Verlag","https://bibliothek.bahai.de/pubReader.php?parLangUri=bah-tb-de-5:13",167],["Singe die Verse Gottes, o Mein Diener, die du empfangen hast, wie jene sie singen, die Ihm nahe sind, damit die Süße deiner Weise deine eigene Seele entflamme und die Herzen aller Menschen anziehe.","Bahá’u’lláh","Ährenlese aus den Schriften Bahá’u’lláhs, Abschnitt 136:2, Bahá’í-Verlag","https://bibliothek.bahai.de/pubReader.php?parLangUri=bah-gwb-de-136:2",168],["Das Erhabenste Wesen spricht: Der Himmel göttlicher Weisheit wird von zwei Leuchten erhellt: Beratung und Erbarmen. Haltet Rat miteinander in allen Angelegenheiten; denn Beratung ist die Lampe der Führung, die den Weg weist, und die Quelle des Verstehens.","Bahá’u’lláh","Botschaften aus ‘Akká, Abschnitt 11:15, Bahá’í-Verlag","https://bibliothek.bahai.de/pubReader.php?parLangUri=bah-tb-de-11:15",169],["Ein jegliches Wort, das aus dem Munde Gottes hervorgeht, ist mit solcher Kraft versehen, daß es jeder menschlichen Gestalt neues Leben einflößen kann – gehörtet ihr doch zu denen, die diese Wahrheit begreifen!","Bahá’u’lláh","Ährenlese aus den Schriften Bahá’u’lláhs, Abschnitt 74:1, Bahá’í-Verlag","https://bibliothek.bahai.de/pubReader.php?parLangUri=bah-gwb-de-74:1",170],["Niemals wird Er ungerecht mit irgend jemandem verfahren, noch wird Er eine Seele über ihr Vermögen belasten. Er, wahrlich, ist der Mitleidige, der Allbarmherzige.","Bahá’u’lláh","Ährenlese aus den Schriften Bahá’u’lláhs, Abschnitt 52:2, Bahá’í-Verlag","https://bibliothek.bahai.de/pubReader.php?parLangUri=bah-gwb-de-52:2",171],["O ihr streitenden Völker und Geschlechter der Erde! Richtet euer Angesicht auf die Einheit und laßt den Glanz ihres Lichtes auf euch scheinen. Versammelt euch und beschließt um Gottes willen, alles zu tilgen, was zum Streit unter euch führt.","Bahá’u’lláh","Ährenlese aus den Schriften Bahá’u’lláhs, Abschnitt 111:1, Bahá’í-Verlag","https://bibliothek.bahai.de/pubReader.php?parLangUri=bah-gwb-de-111:1",172],["zu jedem Menschen gütig zu sein und jeder lebenden Seele Zuneigung zu erzeigen,","‘Abdu’l-Bahá","Ansprachen in Paris, Abschnitt 24:8, Bahá’í-Verlag","https://bibliothek.bahai.de/pubReader.php?parLangUri=abd-pt-de-24:8",173],["O Sohn des Menschen! Für alles gibt es ein Zeichen. Das Zeichen der Liebe ist Standhaftigkeit in Meinem Ratschluss und Geduld in Meinen Prüfungen.","Bahá’u’lláh","Die Verborgenen Worte, aus dem Arabischen Nr. 48, Bahá’í-Verlag","https://bibliothek.bahai.de/pubReader.php?parLangUri=bah-hw-de-1.48:0_50",174],["Ergießet das Licht der grenzenlosen Liebe über jedes menschliche Wesen, das ihr antrefft, mag es gleich eurem Lande, eurer Herkunft, eurer politischen Partei oder irgendeiner anderen Nation, Farbe oder politischen Richtung angehören.","‘Abdu’l-Bahá","Ansprachen in Paris, Abschnitt 9:21, Bahá’í-Verlag","https://bibliothek.bahai.de/pubReader.php?parLangUri=abd-pt-de-9:21",175],["Wir lernen also, dass Nähe zu Gott durch Hingabe an Ihn, durch Eintritt in Sein Reich und durch den Dienst für die Menschheit möglich ist. Sie wird durch Verbundenheit mit allen Menschen erreicht und durch liebevolle Güte gegenüber allen; sie hängt vom Forschen nach Wahrheit, vom Erwerb lobenswerter Tugenden, vom Dienst für die Sache des Weltfriedens und von persönlicher Heiligung ab.","‘Abdu’l-Bahá","Die Verkündigung des Weltfriedens, Abschnitt 55:2, Bahá’í-Verlag","https://bibliothek.bahai.de/pubReader.php?parLangUri=abd-pup-de-55:2",176],["O ihr Geliebten des Herrn! Bemüht euch, Offenbarungen der Liebe Gottes zu werden, Leuchten göttlicher Führung, die unter allen Geschlechtern auf Erden mit dem Licht der Liebe und Eintracht strahlen.","‘Abdu’l-Bahá","Briefe und Botschaften, Abschnitt 12:3, Bahá’í-Verlag","https://bibliothek.bahai.de/pubReader.php?parLangUri=abd-swa-de-12:3",177],["Schaut daher auf niemandes Schwächen; schaut mit dem Auge der Vergebung.","‘Abdu’l-Bahá","Die Verkündigung des Weltfriedens, Abschnitt 39:5, Bahá’í-Verlag","https://bibliothek.bahai.de/pubReader.php?parLangUri=abd-pup-de-39:5",178],["Reichtum ist allen Lobes wert, wenn er durch eigene Anstrengungen des Menschen und durch die Gnade Gottes auf den Gebieten des Handels, der Landwirtschaft, der Kunst oder Industrie erworben und für menschenfreundliche Zwecke ausgegeben wird.","‘Abdu’l-Bahá","Das Geheimnis göttlicher Kultur, Abschnitt 46, Bahá’í-Verlag","https://bibliothek.bahai.de/pubReader.php?parLangUri=abd-sdc-de-46",179],["Das gleiche gilt für den Geist des Menschen. Wenn auch der Tod seinen Körper zerstört, so hat er doch keine Macht über seinen Geist, der ewig, dauernd und frei von Geburt und Tod ist.","‘Abdu’l-Bahá","Ansprachen in Paris, Abschnitt 20:11, Bahá’í-Verlag","https://bibliothek.bahai.de/pubReader.php?parLangUri=abd-pt-de-20:11",180],["Die Verbindung zwischen Gott und Seiner Schöpfung ist die zwischen dem Erzeuger und dem Erzeugten, der Sonne und den dunklen Himmelskörpern, dem Handwerker und seiner Handarbeit.","‘Abdu’l-Bahá","Beantwortete Fragen, Abschnitt 53:2, Bahá’í-Verlag","https://bibliothek.bahai.de/pubReader.php?parLangUri=abd-saq-de-53:2",181],["Sei nicht unglücklich; der Sturm der Sorgen wird vorüberziehen, der Schmerz wird nicht andauern, die Enttäuschung wird vergehen. Das Feuer der Liebe Gottes wird entzündet werden, und die Dornen und Stacheln der Trauer und Verzweiflung werden verbrennen!","‘Abdu’l-Bahá","Familie (Textzusammenstellung), Abschnitt 89:1, Bahá’í-Verlag","https://bibliothek.bahai.de/pubReader.php?parLangUri=comp-fl-de-89:1",182],["Aber die menschliche Seele kennt keinen Abstieg. Ihre einzige Bewegung ist auf Vervollkommnung gerichtet. Nur Wachstum und Fortschritt machen die Bewegung der Seele aus. Die göttliche Vollkommenheit ist unendlich, daher ist der Fortschritt der Seele auch unendlich.","‘Abdu’l-Bahá","Ansprachen in Paris, Abschnitt 29:4, Bahá’í-Verlag","https://bibliothek.bahai.de/pubReader.php?parLangUri=abd-pt-de-29:4",183],["Die erste Lehre Bahá’u’lláhs ist die allen obliegende Pflicht, die Wahrheit zu erforschen. Was bedeutet es, die Wahrheit zu erforschen? Es bedeutet, dass der Mensch alles Hörensagen vergessen und die Wahrheit eigenständig prüfen muss, denn er weiß nicht, ob Aussagen, die er hört, mit der Wirklichkeit übereinstimmen oder nicht.","‘Abdu’l-Bahá","Die Verkündigung des Weltfriedens, Abschnitt 26:4, Bahá’í-Verlag","https://bibliothek.bahai.de/pubReader.php?parLangUri=abd-pup-de-26:4",184],["Meine Trübsal ist Meine Vorsehung. Äußerlich ist sie Feuer und Züchtigung, zuinnerst aber Licht und Gnade. Eile ihr entgegen, auf dass du ein ewiges Licht und ein unsterblicher Geist werdest.","Bahá’u’lláh","Die Verborgenen Worte, aus dem Arabischen Nr. 51, Bahá’í-Verlag","https://bibliothek.bahai.de/pubReader.php?parLangUri=bah-hw-de-1.51:1",185],["Der Mensch braucht zwei Flügel. Der eine Flügel besteht aus körperlicher Kraft und materieller Zivilisation; der andere besteht aus geistiger Kraft und göttlicher Kultur. Mit nur einem Flügel ist das Fliegen unmöglich. Zwei Flügel sind notwendig.","‘Abdu’l-Bahá","Die Verkündigung des Weltfriedens, Abschnitt 5:5, Bahá’í-Verlag","https://bibliothek.bahai.de/pubReader.php?parLangUri=abd-pup-de-5:5",186],["Durch die Macht des Heiligen Geistes, der durch die Seele wirkt, ist der Mensch imstande, die göttliche Wirklichkeit der Dinge wahrzunehmen. Alle großen Werke der Kunst und Wissenschaft sind Zeugen dieser Macht des Geistes.","‘Abdu’l-Bahá","Ansprachen in Paris, Abschnitt 28:7, Bahá’í-Verlag","https://bibliothek.bahai.de/pubReader.php?parLangUri=abd-pt-de-28:7",187],["An diesem Tag ist alles erwägenswert, was die Blindheit mindert und die Sehkraft stärkt. Solche Sehkraft ist der Träger wahren Wissens und sein Führer. In der Tat beruht nach Ansicht der Weisen Urteilskraft auf scharfer Sehkraft.","Bahá’u’lláh","Botschaften aus ‘Akká, Abschnitt 4:8, Bahá’í-Verlag","https://bibliothek.bahai.de/pubReader.php?parLangUri=bah-tb-de-4:8",188],["Das Herz des Menschen gleicht einem Spiegel. Ist der Spiegel rein, so stellen sich die Herzen aufeinander ein und spiegeln sich gegenseitig; so werden geistige Gefühle erzeugt. Das ist wie in der Traumwelt, wenn der Mensch vom Greifbaren gelöst ist und Geistiges erfährt.","‘Abdu’l-Bahá","Briefe und Botschaften, Abschnitt 70:5, Bahá’í-Verlag","https://bibliothek.bahai.de/pubReader.php?parLangUri=abd-swa-de-70:5",189],["Habt acht, dass ihr kein Herz verletzt, dass ihr über niemanden in seiner Abwesenheit schlecht sprecht, dass ihr euch nicht den Dienern Gottes entfremdet.","‘Abdu’l-Bahá","Die Verkündigung des Weltfriedens, Abschnitt 140:4, Bahá’í-Verlag","https://bibliothek.bahai.de/pubReader.php?parLangUri=abd-pup-de-140:4",190],["O Herr! Ob auf Reisen oder zu Hause, in meinem Beruf oder bei meiner Arbeit, setze ich all mein Vertrauen in Dich.","Der Báb","Der Báb – Eine Auswahl aus Seinen Schriften, Abschnitt 7.24:2, Bahá’í-Verlag","https://bibliothek.bahai.de/pubReader.php?parLangUri=bab-swb-de-7.24:2",191],["Er sagt: »Dein Herz ist Meine Wohnstatt; heilige es für Mein Kommen. Dein Geist ist der Ort Meines Erscheinens; läutere ihn für Meine Offenbarung.«","Bahá’u’lláh","Die Verkündigung des Weltfriedens, Abschnitt 55:2, Bahá’í-Verlag","https://bibliothek.bahai.de/pubReader.php?parLangUri=abd-pup-de-55:2",192],["Würde Gott nicht alle lieben, dann hätte Er nicht alle erschaffen, erzogen und für sie gesorgt. Liebevolle Güte ist die göttliche Leitlinie.","‘Abdu’l-Bahá","Die Verkündigung des Weltfriedens, Abschnitt 47:8, Bahá’í-Verlag","https://bibliothek.bahai.de/pubReader.php?parLangUri=abd-pup-de-47:8",193],["Jedem verständigen, erleuchteten Herzen ist offenbar, dass Gott, die unerforschliche Wesenheit, das göttliche Sein, unermesslich erhaben ist über alle menschlichen Merkmale wie leibliche Existenz, Aufstieg und Abstieg, Ausgang und Rückkehr. Fern sei es Seiner Herrlichkeit, dass des Menschen Zunge angemessen Sein Lob künden oder des Menschen Herz Sein unergründliches Mysterium erfassen könnte.","Bahá’u’lláh","Das Buch der Gewissheit (Kitáb-i-Íqán), Abschnitt 104, Bahá’í-Verlag","https://bibliothek.bahai.de/pubReader.php?parLangUri=bah-ki-de-104",194],["Die Menschenwelt hat zwei Flügel: Den einen bilden die Frauen, den anderen die Männer. Erst wenn beide Flügel gleichmäßig entwickelt sind, kann der Vogel fliegen. Bleibt ein Flügel schwächlich, so ist kein Flug möglich.","‘Abdu’l-Bahá","Sendbriefe an die Zentralorganisation für einen dauernden Frieden, Abschnitt 1:17, Bahá’í-Verlag","https://bibliothek.bahai.de/pubReader.php?parLangUri=abd-tah-de-1:17",195],["Was den Verstand betrifft: Er ist die Kraft des menschlichen Geistes. Der Geist ist wie die Lampe, und der Verstand ist wie ihr strahlendes Licht. Der Geist ist wie der Baum, der Verstand wie die Frucht.","‘Abdu’l-Bahá","Beantwortete Fragen, Abschnitt 55:6, Bahá’í-Verlag","https://bibliothek.bahai.de/pubReader.php?parLangUri=abd-saq-de-55:6",196],["Das Licht eines guten Charakters übertrifft das Licht der Sonne und ihr Leuchten.«","Bahá’u’lláh","Das Kommen Göttlicher Gerechtigkeit, Abschnitt 39, Bahá’í-Verlag","https://bibliothek.bahai.de/pubReader.php?parLangUri=sho-adj-de-39",197],["Einheit ist der Ausdruck der liebevollen Macht Gottes und spiegelt die Wirklichkeit des Göttlichen wider. Sie erstrahlt an diesem Tag durch das Licht, das der Menschheit geschenkt wird.","‘Abdu’l-Bahá","Die Verkündigung des Weltfriedens, Abschnitt 6:1, Bahá’í-Verlag","https://bibliothek.bahai.de/pubReader.php?parLangUri=abd-pup-de-6:1",198],["Lenkt eure Gedanken auf eure geistige Entwicklung, schließt eure Augen vor den Fehlern anderer Seelen.","‘Abdu’l-Bahá","Briefe und Botschaften, Abschnitt 174:5, Bahá’í-Verlag","https://bibliothek.bahai.de/pubReader.php?parLangUri=abd-swa-de-174:5",199],["Was
