 coordinated will happiness be assured.","‘Abdu’l-Bahá","The Promulgation of Universal Peace, 44","https://www.bahai.org/r/650792604",230],["O God, guide me, protect me, make of me a shining lamp and a brilliant star. Thou art the Mighty and the Powerful.","‘Abdu’l-Bahá","Bahá’í Prayers, General Prayers","https://www.bahai.org/r/831865662",231],["Put thy whole confidence in the grace of God, thy Lord. Let Him be thy trust in whatever thou doest, and be of them that have submitted themselves to His Will.","Bahá’u’lláh","The Summons of the Lord of Hosts, Súriy-i-Mulúk","https://www.bahai.org/r/226498346",232],["Hence, if a member of the body politic becomes afflicted, in reality, from the standpoint of sympathetic connection, all will share that affliction since this [one afflicted] is a member of the group of members, a part of the whole.","‘Abdu’l-Bahá","The Promulgation of Universal Peace, 102","https://www.bahai.org/r/747392484",234],["If any soul speak ill of an absent one, the only result will clearly be this: he will dampen the zeal of the friends and tend to make them indifferent.","‘Abdu’l-Bahá","Selections from the Writings of ‘Abdu’l‑Bahá, 193","https://www.bahai.org/r/181765648",235],["I want to make you understand that material progress and spiritual progress are two very different things, and that only if material progress goes hand in hand with spirituality can any real progress come about, and the Most Great Peace reign in the world.","‘Abdu’l-Bahá","Paris Talks, Part One, 34","https://www.bahai.org/r/407182695",236],["Religion and science are the two wings upon which man’s intelligence can soar into the heights, with which the human soul can progress.","‘Abdu’l-Bahá","Paris Talks, Part Two, 44","https://www.bahai.org/r/352527373",237],["He must turn away from ideas which degrade the human soul so that day by day and hour by hour he may advance upward and higher to spiritual perception of the continuity of the human reality.","Shoghi Effendi","The Promulgation of Universal Peace, 38","https://www.bahai.org/r/914582630",238],["So it will come to pass that when women participate fully and equally in the affairs of the world, when they enter confidently and capably the great arena of laws and politics, war will cease; for woman will be the obstacle and hindrance to it.","‘Abdu’l-Bahá","The Promulgation of Universal Peace, 51","https://www.bahai.org/r/759960588",239],["True distinction among mankind is through divine bestowals and receiving the intuitions of the Holy Spirit. If man does not become the recipient of the heavenly bestowals and spiritual bounties, he remains in the plane and kingdom of the animal.","‘Abdu’l-Bahá","The Promulgation of Universal Peace, 103","https://www.bahai.org/r/009740833",240],["I earnestly exhort you: let not your hearts be fettered by the material things of this world; I charge you not to lie contentedly on the beds of negligence, prisoners of matter, but to arise and free yourselves from its chains!","‘Abdu’l-Bahá","Paris Talks, Part One, 9","https://www.bahai.org/r/853612025",241],["“O my servants! Sorrow not if, in these days and on this earthly plane, things contrary to your wishes have been ordained and manifested by God, for days of blissful joy, of heavenly delight, are assuredly in store for you.","Bahá’u’lláh","The Advent of Divine Justice","https://www.bahai.org/r/900554691",242],["Men who suffer not, attain no perfection. The plant most pruned by the gardeners is that one which, when the summer comes, will have the most beautiful blossoms and the most abundant fruit.","‘Abdu’l-Bahá","Paris Talks, Part One, 14","https://www.bahai.org/r/019442004",243],["Be ye as the fingers of one hand, the members of one body.","Bahá’u’lláh","Gleanings from the Writings of Bahá’u’lláh, LXXII","https://www.bahai.org/r/899589812",244],["The purport of this is that God is almighty, but His greatness cannot be brought within the grasp of human limitation. We cannot limit God to a boundary. Man is limited, but the world of Divinity is unlimited.","‘Abdu’l-Bahá","The Promulgation of Universal Peace, 93","https://www.bahai.org/r/398301249",245],["The most important principle of divine philosophy is the oneness of the world of humanity, the unity of mankind, the bond conjoining East and West, the tie of love which blends human hearts.","‘Abdu’l-Bahá","The Promulgation of Universal Peace, 12","https://www.bahai.org/r/650712298",246],["Is there any Remover of difficulties save God? Say: Praised be God! He is God! All are His servants, and all abide by His bidding!","The Báb","Bahá’í Prayers, General Prayers","https://www.bahai.org/r/590097641",247],["God is love; God seeketh fellowship, purity, sanctity and long-suffering; these are the attributes of Divinity.","‘Abdu’l-Bahá","The Promulgation of Universal Peace, 97","https://www.bahai.org/r/288836526",248],["By the absence of love, enmity increases. By the exercise of love, love strengthens and enmities dwindle away.","‘Abdu’l-Bahá","The Promulgation of Universal Peace, 3","https://www.bahai.org/r/778701302",249],["So powerful is the light of unity that it can illuminate the whole earth.","Bahá’u’lláh","Epistle to the Son of the Wolf","https://www.bahai.org/r/867043958",250],["Today the world of humanity is in need of international unity and conciliation. To establish these great fundamental principles a propelling power is needed. It is self-evident that the unity of the human world and the Most Great Peace cannot be accomplished through material means.","‘Abdu’l-Bahá","The Promulgation of Universal Peace, 5","https://www.bahai.org/r/616248837",251],["Frivolity palls and eventually leads to boredom and emptiness, but true happiness and joy and humour that are parts of a balanced life that includes serious thought, compassion and humble servitude to God, are characteristics that enrich life and add to its radiance.","The Universal House of Justice","A Chaste and Holy Life","https://www.bahai.org/r/174736977",252],["We stand on the threshold of an age whose convulsions proclaim alike the death-pangs of the old order and the birth-pangs of the new.","Shoghi Effendi","The World Order of Bahá’u’lláh, The Unfoldment of World Civilization","https://www.bahai.org/r/924172496",253],["You are the reality and expression of your deeds and actions.","‘Abdu’l-Bahá","The Promulgation of Universal Peace, 3","https://www.bahai.org/r/778701302",254],["Human utterance is an essence which aspireth to exert its influence and needeth moderation.","Bahá’u’lláh","Tablets of Bahá’u’lláh, Lawḥ-i-Ḥikmat","https://www.bahai.org/r/969741149",255],["The most vital duty, in this day, is to purify your characters, to correct your manners, and improve your conduct.","Bahá’u’lláh","Selections from the Writings of ‘Abdu’l‑Bahá, 2","https://www.bahai.org/r/822066704",256],["God will answer the prayer of every servant if that prayer is urgent. His mercy is vast, illimitable. He answers the prayers of all His servants.","‘Abdu’l-Bahá","The Promulgation of Universal Peace, 87","https://www.bahai.org/r/823238376",257],["Even as it hath been said: “Not everything that a man knoweth can be disclosed, nor can everything that he can disclose be regarded as timely, nor can every timely utterance be considered as suited to the capacity of those who hear it.”","Bahá’u’lláh","Gleanings from the Writings of Bahá’u’lláh, LXXXIX","https://www.bahai.org/r/306626215",258],["See ye no strangers; rather see all men as friends, for love and unity come hard when ye fix your gaze on otherness.","‘Abdu’l-Bahá","Selections from the Writings of ‘Abdu’l‑Bahá, 8","https://www.bahai.org/r/035860565",259],["Until the reality of equality between man and woman is fully established and attained, the highest social development of mankind is not possible.","‘Abdu’l-Bahá","The Promulgation of Universal Peace, 32","https://www.bahai.org/r/607844310",260],["It is through your deeds that ye can distinguish yourselves from others. Through them the brightness of your light can be shed upon the whole earth.","Bahá’u’lláh","The Advent of Divine Justice","https://www.bahai.org/r/716325250",261],["Let deeds, not words, be your adorning.","Bahá’u’lláh","The Hidden Words, From the Persian","https://www.bahai.org/r/646280975",262],["Free thyself from the fetters of this world, and loose thy soul from the prison of self. Seize thy chance, for it will come to thee no more.","Bahá’u’lláh","The Hidden Words, From the Persian","https://www.bahai.org/r/178899283",263],["Grieve thou not over the troubles and hardships of this nether world, nor be thou glad in times of ease and comfort, for both shall pass away.","‘Abdu’l-Bahá","Selections from the Writings of ‘Abdu’l‑Bahá, 150","https://www.bahai.org/r/789725417",264],["When freedom of conscience, liberty of thought and right of speech prevail—that is to say, when every man according to his own idealization may give expression to his beliefs—development and growth are inevitable.","‘Abdu’l-Bahá","The Promulgation of Universal Peace, 71","https://www.bahai.org/r/204929876",265],["Love and unity are the needs of the body politic today. Without these there can be no progress or prosperity attained.","‘Abdu’l-Bahá","The Promulgation of Universal Peace, 61","https://www.bahai.org/r/110529474",266],["The wisdom of this is that the times never remain the same, for change is a necessary quality and an essential attribute of this world, and of time and place.","Bahá’u’lláh","The Kitáb-i-Aqdas, Introduction","https://www.bahai.org/r/674478087",267],["Look ye not upon the present, fix your gaze upon the times to come. In the beginning, how small is the seed, yet in the end it is a mighty tree. Look ye not upon the seed, look ye upon the tree, and its blossoms, and its leaves and its fruits.","‘Abdu’l-Bahá","Selections from the Writings of ‘Abdu’l‑Bahá, 40","https://www.bahai.org/r/666956498",268],["Perseverance is an essential condition. In every project firmness and steadfastness will undoubtedly lead to good results; otherwise it will exist for some days, and then be discontinued.","‘Abdu’l-Bahá","Selections from the Writings of ‘Abdu’l‑Bahá, 124","https://www.bahai.org/r/108931681",269],["I beseech Thee to aid and assist me at all times and under all conditions, and seek from the heaven of Thy grace Thine ancient favor.","Bahá’u’lláh","Bahá’í Prayers, General Prayers","https://www.bahai.org/r/100739693",270],["The day is fast approaching when the light of love will have dispelled the darkness of animosity and the splendours of the sun of truth will have driven away the gloomy night.","‘Abdu’l-Bahá","Fire and Light","https://www.bahai.org/r/549491505",271],["The essence of all that We have revealed for thee is Justice, is for man to free himself from idle fancy and imitation, discern with the eye of oneness His glorious handiwork, and look into all things with a searching eye.","Bahá’u’lláh","Tablets of Bahá’u’lláh, Aṣl-i-Kullu’l-Khayr 1","https://www.bahai.org/r/061871273",272],["Waste not your hours in idleness and sloth, but occupy yourselves with what will profit you and others.","Bahá’u’lláh","The Kitáb-i-Aqdas","https://www.bahai.org/r/590677343",273],["The first life, which pertaineth to the elemental body, will come to an end, as hath been revealed by God: “Every soul shall taste of death.” But the second life, which ariseth from the knowledge of God, knoweth no death, as hath been revealed aforetime: “Him will We surely quicken to a blessed life.”","Bahá’u’lláh","Gems of Divine Mysteries","https://www.bahai.org/r/337911695",274],["They who are the people of God have no ambition except to revive the world, to ennoble its life, and regenerate its peoples.","Bahá’u’lláh","Gleanings from the Writings of Bahá’u’lláh, CXXVI","https://www.bahai.org/r/476869976",275],["The supreme need of humanity is cooperation and reciprocity. The stronger the ties of fellowship and solidarity amongst men, the greater will be the power of constructiveness and accomplishment in all the planes of human activity.","‘Abdu’l-Bahá","The Promulgation of Universal Peace, 108","https://www.bahai.org/r/322101001",276],["God has given man the eye of investigation by which he may see and recognize truth. He has endowed man with ears that he may hear the message of reality and conferred upon him the gift of reason by which he may discover things for himself.","‘Abdu’l-Bahá","The Promulgation of Universal Peace, 97","https://www.bahai.org/r/743483799",277],["There is nothing greater or more blessed than the Love of God! It gives healing to the sick, balm to the wounded, joy and consolation to the whole world, and through it alone can man attain Life Everlasting.","‘Abdu’l-Bahá","Paris Talks, Part One, 27","https://www.bahai.org/r/156459618",278],["The source of courage and power is the promotion of the Word of God, and steadfastness in His Love.","Bahá’u’lláh","Tablets of Bahá’u’lláh, Aṣl-i-Kullu’l-Khayr 1","https://www.bahai.org/r/503021283",279],["Set before thine eyes God’s unerring Balance and, as one standing in His Presence, weigh in that Balance thine actions every day, every moment of thy life. Bring thyself to account ere thou art summoned to a reckoning, on the Day when no man shall have strength to stand for fear of God, the Day when the hearts of the heedless ones shall be made to tremble.","Bahá’u’lláh","The Summons of the Lord of Hosts, Súriy-i-Mulúk","https://www.bahai.org/r/832620951",280],["O Son of Being! Busy not thyself with this world, for with fire We test the gold, and with gold We test Our servants.","Bahá’u’lláh","The Hidden Words, From the Arabic","https://www.bahai.org/r/561352140",281],["He must so cleanse his heart that no remnant of either love or hate may linger therein, lest that love blindly incline him to error, or that hate repel him away from the truth.","Bahá’u’lláh","Gleanings from the Writings of Bahá’u’lláh, CXXV","https://www.bahai.org/r/186611355",282],["Material civilization is like a lamp-glass. Divine civilization is the lamp itself and the glass without the light is dark. Material civilization is like the body. No matter how infinitely graceful, elegant and beautiful it may be, it is dead. Divine civilization is like the spirit, and the body gets its life from the spirit, otherwise it becomes a corpse.","‘Abdu’l-Bahá","Tablets to The Hague, First Tablet to The Hague","https://www.bahai.org/r/795650540",283],["Only when the lamp of search, of earnest striving, of longing desire, of passionate devotion, of fervid love, of rapture, and ecstasy, is kindled within the seeker’s heart, and the breeze of His loving-kindness is wafted upon his soul, will the darkness of error be dispelled, the mists of doubts and misgivings be dissipated, and the lights of knowledge and certitude envelop his being.","Bahá’u’lláh","Gleanings from the Writings of Bahá’u’lláh, CXXV","https://www.bahai.org/r/216145023",284],["Verily, we are weak; make us mighty. We are poor; assist us from the treasury of Thy munificence. We are dead; resuscitate us through the breath of the Holy Spirit. We lack patience in tests and in long-suffering; permit us to attain the lights of oneness.","‘Abdu’l-Bahá","The Promulgation of Universal Peace, 93","https://www.bahai.org/r/303400505",285],["Thy loving providence hath encompassed all created things in the heavens and on the earth, and Thy forgiveness hath surpassed the whole creation.","The Báb","Selections from the Writings of the Báb, Prayers and Meditations","https://www.bahai.org/r/702432889",286],["It is evident, then, that the intended and especial function of man is to rescue and redeem himself from the inherent defects of nature and become qualified with the ideal virtues of Divinity.","‘Abdu’l-Bahá","The Promulgation of Universal Peace, 110","https://www.bahai.org/r/055943431",287],["Let trust in God be his shield, and reliance on God his provision, and the fear of God his raiment. Let patience be his helper, and praiseworthy conduct his succorer, and goodly deeds his army. Then will the concourse on high sustain him.","Bahá’u’lláh","This Decisive Hour, 57","https://www.bahai.org/r/904615813",288],["The answer to this question is also embodied in these blessed, these weighty and exalted words: “Be anxiously concerned with the needs of the age ye live in, and centre your deliberations on its exigencies and requirements”.","Bahá’u’lláh","The Tabernacle of Unity","https://www.bahai.org/r/515594870",289],["Wert thou to consider this world, and realize how fleeting are the things that pertain unto it, thou wouldst choose to tread no path except the path of service to the Cause of thy Lord.","Bahá’u’lláh","Gleanings from the Writings of Bahá’u’lláh, CXLIV","https://www.bahai.org/r/620815101",290],["In every instance let the friends be considerate and infinitely kind. Let them never be defeated by the malice of the people, by their aggression and their hate, no matter how intense. If others hurl their darts against you, offer them milk and honey in return; if they poison your lives, sweeten their souls; if they injure you, teach them how to be comforted; if they inflict a wound upon you, be a balm to their sores; if they sting you, hold to their lips a refreshing cup.","‘Abdu’l-Bahá","Selections from the Writings of ‘Abdu’l‑Bahá, 8","https://www.bahai.org/r/081591903",291],["Whatsoever passeth beyond the limits of moderation will cease to exert a beneficial influence.","Bahá’u’lláh","Tablets of Bahá’u’lláh, Lawḥ-i-Maqṣúd","https://www.bahai.org/r/399637092",292],["It is not merely material well-being that people need. What they desperately need is to know how to live their lives—they need to know who they are, to what purpose they exist, and how they should act towards one another; and, once they know the answers to these questions they need to be helped to gradually apply these answers to everyday behaviour.","The Universal House of Justice","Social Action","https://www.bahai.org/r/390657457",293],["Know ye not why We created you all from the same dust? That no one should exalt himself over the other.","Bahá’u’lláh","The Hidden Words, From the Arabic","https://www.bahai.org/r/685666862",294],["Exert yourselves that ye may attain this transcendent and most sublime station, the station that can ensure the protection and security of all mankind. This goal excelleth every other goal, and this aspiration is the monarch of all aspirations.","Bahá’u’lláh","Gleanings from the Writings of Bahá’u’lláh, CXXXII","https://www.bahai.org/r/054452918",295],["In the darkness of the world be ye radiant flames; in the sands of perdition, be ye wellsprings of the water of life, be ye guidance from the Lord God.","‘Abdu’l-Bahá","Selections from the Writings of ‘Abdu’l‑Bahá, 210","https://www.bahai.org/r/142180872",296],["Religion should unite all hearts and cause wars and disputes to vanish from the face of the earth, give birth to spirituality, and bring life and light to each heart.","‘Abdu’l-Bahá","Paris Talks, Part Two, 40","https://www.bahai.org/r/089115387",297],["Ye who are servants of the human race, strive ye with all your heart to deliver mankind out of this darkness and these prejudices that belong to the human condition and the world of nature, so that humanity may find its way into the light of the world of God.","‘Abdu’l-Bahá","Selections from the Writings of ‘Abdu’l‑Bahá, 202","https://www.bahai.org/r/363690976",298],["A financier with colossal wealth should not exist whilst near him is a poor man in dire necessity. When we see poverty allowed to reach a condition of starvation it is a sure sign that somewhere we shall find tyranny.","‘Abdu’l-Bahá","Paris Talks, Part Two, 46","https://www.bahai.org/r/567271278",299],["Love gives life to the lifeless. Love lights a flame in the heart that is cold. Love brings hope to the hopeless and gladdens the hearts of the sorrowful.","‘Abdu’l-Bahá","Paris Talks, Part Three, 58","https://www.bahai.org/r/337559080",300],["In like manner, when divers shades of thought, temperament and character, are brought together under the power and influence of one central agency, the beauty and glory of human perfection will be revealed and made manifest.","‘Abdu’l-Bahá","Selections from the Writings of ‘Abdu’l‑Bahá, 225","https://www.bahai.org/r/203435178",301],["Trustworthiness is the greatest portal leading unto the tranquility and security of the people. In truth the stability of every affair hath depended and doth depend upon it. All the domains of power, of grandeur and of wealth are illumined by its light.","Bahá’u’lláh","Tablets of Bahá’u’lláh, Ṭarázát","https://www.bahai.org/r/580894915",302],["O Son of Spirit! Burst thy cage asunder, and even as the phoenix of love soar into the firmament of holiness. Renounce thyself and, filled with the spirit of mercy, abide in the realm of celestial sanctity.","Bahá’u’lláh","The Hidden Words, From the Persian","https://www.bahai.org/r/988131543",304],["Take pride not in love for yourselves but in love for your fellow-creatures. Glory not in love for your country, but in love for all mankind.","Bahá’u’lláh","Tablets of Bahá’u’lláh, Lawḥ-i-Ḥikmat","https://www.bahai.org/r/855275482",305],["By this it is meant that the world of humanity is like a tree, the nations or peoples are the different limbs or branches of that tree, and the individual human creatures are as the fruits and blossoms thereof.","‘Abdu’l-Bahá","The Promulgation of Universal Peace, 135","https://www.bahai.org/r/002832906",306],["It is indeed a good and praiseworthy thing to progress materially, but in so doing, let us not neglect the more important spiritual progress, and close our eyes to the Divine light shining in our midst.","‘Abdu’l-Bahá","Paris Talks, Part One, 19","https://www.bahai.org/r/135963994",307],["The world’s equilibrium hath been upset through the vibrating influence of this most great, this new World Order. Mankind’s ordered life hath been revolutionized through the agency of this unique, this wondrous System—the like of which mortal eyes have never witnessed.","Bahá’u’lláh","Gleanings from the Writings of Bahá’u’lláh, LXX","https://www.bahai.org/r/581649978",308],["In order to find truth we must give up our prejudices, our own small trivial notions; an open receptive mind is essential. If our chalice is full of self, there is no room in it for the water of life.","‘Abdu’l-Bahá","Paris Talks, Part Two, 41","https://www.bahai.org/r/068113036",309],["The five continents of the world will become as one, its divers nations will become one nation, the earth will become one homeland, and the human race will become one people.","‘Abdu’l-Bahá","Some Answered Questions, 12","https://www.bahai.org/r/663848080",310],["Think ye at all times of rendering some service to every member of the human race.","‘Abdu’l-Bahá","Selections from the Writings of ‘Abdu’l‑Bahá, 1","https://www.bahai.org/r/159531595",311],["In this black pupil is seen the reflection of that which is before it, and through it the light of the spirit shineth forth.”","‘Abdu’l-Bahá","The Advent of Divine Justice","https://www.bahai.org/r/486554855",312],["Breathe not the sins of others so long as thou art thyself a sinner. Shouldst thou transgress this command, accursed wouldst thou be, and to this I bear witness.”","Bahá’u’lláh","The Kitáb-i-Aqdas, Notes","https://www.bahai.org/r/392967566",313],["Close thine eyes to all things else, and open them to the realm of the All-Glorious. Ask whatsoever thou wishest of Him alone; seek whatsoever thou seekest from Him alone.","‘Abdu’l-Bahá","Selections from the Writings of ‘Abdu’l‑Bahá, 22","https://www.bahai.org/r/143501747",314],["The religion of God is one religion, but it must ever be renewed.","‘Abdu’l-Bahá","Selections from the Writings of ‘Abdu’l‑Bahá, 23","https://www.bahai.org/r/968786614",315],["Do not busy yourselves in your own concerns; let your thoughts be fixed upon that which will rehabilitate the fortunes of mankind and sanctify the hearts and souls of men.","Bahá’u’lláh","Tablets of Bahá’u’lláh, Lawḥ-i-Dunyá","https://www.bahai.org/r/477099463",316],["Therefore, order your lives in accordance with the first principle of the divine teaching, which is love. Service to humanity is service to God.","‘Abdu’l-Bahá","The Promulgation of Universal Peace, 3","https://www.bahai.org/r/408106924",317],["O son of man! If thine eyes be turned towards mercy, forsake the things that profit thee, and cleave unto that which will profit mankind. And if thine eyes be turned towards justice, choose thou for thy neighbor that which thou choosest for thyself.","Bahá’u’lláh","Epistle to the Son of the Wolf","https://www.bahai.org/r/584463448",318],["Not until man is tried doth the pure gold distinctly separate from the dross. Torment is the fire of test wherein the pure gold shineth resplendently and the impurity is burned and blackened.","‘Abdu’l-Bahá","Selections from the Writings of ‘Abdu’l‑Bahá, 89","https://www.bahai.org/r/145455538",319],["Therefore, you must assist the poor as much as possible, even by sacrifice of yourself. No deed of man is greater before God than helping the poor.","‘Abdu’l-Bahá","The Promulgation of Universal Peace, 77","https://www.bahai.org/r/305820706",320],["The purpose of religion as revealed from the heaven of God’s holy Will is to establish unity and concord amongst the peoples of the world; make it not the cause of dissension and strife.","Bahá’u’lláh","Tablets of Bahá’u’lláh, Ishráqát","https://www.bahai.org/r/694735299",321],["At the outset of every endeavor, it is incumbent to look to the end of it.","Bahá’u’lláh","Tablets of Bahá’u’lláh, Lawḥ-i-Maqṣúd","https://www.bahai.org/r/170688693",322],["Regard thou faith as a tree. Its fruits, leaves, boughs and branches are, and have ever been, trustworthiness, truthfulness, uprightness and forbearance.","Bahá’u’lláh","Trustworthiness: A Cardinal Bahá’í Virtue","https://www.bahai.org/r/270099037",323],["Thy Paradise is My love; thy heavenly home, reunion with Me. Enter therein and tarry not. This is that which hath been destined for thee in Our kingdom above and Our exalted dominion.","Bahá’u’lláh","The Hidden Words, From the Arabic","https://www.bahai.org/r/312164372",324]];

 if(b.t==="lin"){var g=ctx.createLinearGradient(0,0,0,Hh);b.s.forEach(function(s){g.addColorStop(s[0],s[1])});ctx.fillStyle=g;ctx.fillRect(0,0,W,Hh);return}
 if(b.t==="con"){if(ctx.createConicGradient){var cg=ctx.createConicGradient((b.a-90)*Math.PI/180,W*b.x,Hh*b.y);b.s.forEach(function(c,i){cg.addColorStop(i/(b.s.length-1),c)});ctx.fillStyle=cg}else{ctx.fillStyle=b.s[0]}ctx.fillRect(0,0,W,Hh);return}

  paintBg(ctx,W,Hh,BG);
  var fs=Math.round(size(CUR.text.length)*2.35),lines,lh;
  for(;fs>=34;fs-=2){ctx.font=fs+"px "+FAM;lines=wrap(ctx,CUR.text,maxW);var bn=lines.length,blo=maxW*0.55,bhi=maxW;if(bn>1){for(var bk=0;bk<14;bk++){var bm=(blo+bhi)/2;if(wrap(ctx,CUR.text,bm).length>bn){blo=bm}else{bhi=bm}}lines=wrap(ctx,CUR.text,bhi)}lh=fs*1.28;if(lines.length*lh<=Hh-520)break}
  var markH=120,gap=64,metaH=90,blockH=markH+gap+lines.length*lh+gap+metaH,y=(Hh-blockH)/2;
  ctx.textBaseline="alphabetic";ctx.fillStyle=BG.m;ctx.font="300px "+FAM;ctx.fillText("“",pad-12,y+210);
  y+=markH+gap;ctx.fillStyle="#1F1E24";ctx.font=fs+"px "+FAM;
  lines.forEach(function(l,i){ctx.fillText(l,pad,y+fs+i*lh)});
  y+=lines.length*lh+gap;ctx.font="italic 40px "+FAM;ctx.fillText(CUR.author,pad,y+36);
  ctx.fillStyle="#55535C";ctx.font="32px "+FAM;wrap(ctx,CUR.ref,maxW).slice(0,2).forEach(function(l,i){ctx.fillText(l,pad,y+86+i*40)});
  return new Promise(function(res){cv.toBlob(function(b){res(b)},"image/png")})})}
var DL=null;
if(FRAMED&&window.claude&&window.claude.use){try{window.claude.use("downloads").then(function(d){DL=d},function(){})}catch(e){}}
function saveImage(){makeImage().then(function(blob){if(!blob)return;if(FRAMED){if(!DL)return;closeSheet();DL.save({filename:"bahai-quote-"+CUR.id+".png",data:blob}).catch(function(){});return}var a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="bahai-quote-"+CUR.id+".png";document.body.appendChild(a);a.click();setTimeout(function(){URL.revokeObjectURL(a.href);a.remove()},1500)})}
/* Share sheet */
var lastFocus=null;
function openSheet(){var u=pageUrl(),txt=shareText(true),e=encodeURIComponent;var opts=[
 ["WhatsApp","https://wa.me/?text="+e(txt)],
 ["Telegram","https://t.me/share/url?url="+e(u||" ")+"&text="+e(shareText(false))],
 ["X","https://x.com/intent/post?text="+e(txt)]];
 if(u){opts.push(["Facebook","https://www.facebook.com/sharer/sharer.php?u="+e(u)]);opts.push(["LinkedIn","https://www.linkedin.com/sharing/share-offsite/?url="+e(u)])}
 opts.push([T.email,"mailto:?subject="+e(CUR.author)+"&body="+e(txt)]);
 var box=document.getElementById("opts");box.textContent="";
 opts.forEach(function(o){var a=document.createElement("a");a.className="opt";a.textContent=o[0];a.href=o[1];a.target="_blank";a.rel="noopener";a.addEventListener("click",function(){setTimeout(closeSheet,300)});box.appendChild(a)});
 var c=document.createElement("button");c.type="button";c.className="opt";c.textContent=T.copy;c.addEventListener("click",copyText);box.appendChild(c);
 var ir=document.getElementById("imgrow");ir.textContent="";
 if(!FRAMED||DL){var s=document.createElement("button");s.type="button";s.className="opt primary";s.textContent=T.save;s.addEventListener("click",saveImage);ir.appendChild(s)}
 if(canCopyImg()){var ci=document.createElement("button");ci.type="button";ci.className="opt"+(ir.children.length?"":" primary");ci.textContent=T.copyimg;ci.addEventListener("click",copyImage);ir.appendChild(ci)}
 document.getElementById("orline").textContent=T.or;document.getElementById("orline").hidden=!ir.children.length;
 if(box.children.length%2===1){box.lastChild.style.gridColumn="1 / -1"}
 lastFocus=document.activeElement;document.getElementById("scrim").hidden=false;document.getElementById("sheet").hidden=false;(ir.firstChild||box.firstChild).focus()}
function closeSheet(){document.getElementById("scrim").hidden=true;document.getElementById("sheet").hidden=true;if(lastFocus)lastFocus.focus()}
document.getElementById("closeBtn").addEventListener("click",closeSheet);
document.getElementById("scrim").addEventListener("click",closeSheet);
document.addEventListener("keydown",function(ev){if(ev.key==="Escape"&&!document.getElementById("sheet").hidden)closeSheet()});
var IMG=null;
function imgPromise(){return IMG?Promise.resolve(IMG):makeImage().then(function(b){IMG=b;return b})}
setTimeout(function(){imgPromise().catch(function(){})},1200);
function canCopyImg(){return !!(window.ClipboardItem&&navigator.clipboard&&navigator.clipboard.write)}
function copyImage(){try{navigator.clipboard.write([new ClipboardItem({"image/png":imgPromise()})]).then(function(){toast(T.imgcopied)},function(){toast(T.fail)})}catch(e){toast(T.fail)}}
document.getElementById("shareBtn").addEventListener("click",function(){
 if(FRAMED||!navigator.share||!IMG){openSheet();return}
 var f=null;try{f=new File([IMG],"bahai-quote-"+CUR.id+".png",{type:"image/png"})}catch(e){}
 if(!f||!navigator.canShare||!navigator.canShare({files:[f]})){openSheet();return}
 try{navigator.share({files:[f],title:CUR.author,text:shareText(true)}).catch(function(err){if(!err||err.name!=="AbortError")openSheet()})}catch(e){openSheet()}});
function restart(el){el.style.animation="none";void el.offsetWidth;el.style.animation=""}
function goNext(){IDX=nextIndex();BG=nextBg();q=Q[IDX];CUR={text:q[0],author:q[1],ref:q[2],link:q[3],id:q[4],lang:LANG};IMG=null;
 try{if(location.hash)history.replaceState(null,"",location.pathname+location.search)}catch(e){}
 render();restart(document.getElementById("bg"));restart(document.querySelector(".card"));setTimeout(function(){imgPromise().catch(function(){})},900)}
if(SHOW_NEXT){var nb=document.getElementById("nextBtn");nb.hidden=false;nb.setAttribute("aria-label",T.next);nb.title=T.next;nb.addEventListener("click",goNext)}
</script>
