<title>Bahá’í Quotes</title>

<style>
:root{--ink:#1F1E24;--muted:#55535C;--mark:#8FA6BD;--ground:#F4F1F6;--line:rgba(31,30,36,.22);--sheet:rgba(253,252,252,.9);color-scheme:light}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--ground);color:var(--ink);font-family:'EB Garamond','Iowan Old Style','Palatino Linotype',Palatino,Georgia,serif;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
.bg{position:fixed;inset:0;z-index:0}
.stage{position:relative;z-index:1;min-height:100%;box-sizing:border-box;display:flex;align-items:center;justify-content:center;padding:56px 36px}
.card{width:100%;max-width:620px;display:flex;flex-direction:column;gap:40px;margin:0}
.mark{font-size:96px;line-height:.6;height:40px;color:var(--mark);user-select:none}
blockquote{margin:0;font-size:var(--fs,33px);line-height:1.28;text-wrap:balance;-webkit-hyphens:manual;hyphens:manual;overflow-wrap:break-word}
.who{display:flex;flex-direction:column;gap:4px}
.author{font-size:17px;font-style:italic}
.ref{font-size:14px;color:var(--muted);text-decoration:none;width:fit-content}
a.ref:hover,a.ref:focus-visible{text-decoration:underline;text-underline-offset:3px}
.share{margin-top:24px;align-self:flex-start;display:inline-flex;align-items:center;gap:8px;min-height:44px;box-sizing:border-box;padding:0 18px;border:1px solid var(--line);border-radius:999px;background:rgba(255,255,255,.35);color:var(--ink);font:inherit;font-size:16px;letter-spacing:.02em;cursor:pointer;transition:background .2s,border-color .2s}
.share:hover{background:rgba(255,255,255,.6);border-color:rgba(31,30,36,.4)}
.share:active{transform:scale(.98)}
.share svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round}
:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
.next{position:fixed;z-index:2;right:calc(16px + env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));width:48px;height:48px;display:flex;align-items:center;justify-content:center;padding:0;background:none;border:0;border-radius:50%;color:var(--ink);opacity:.26;cursor:pointer;transition:opacity .35s ease}
.next:hover,.next:focus-visible{opacity:.72}
.next:active{transform:translateX(2px)}
.next svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.1;stroke-linecap:round;stroke-linejoin:round}
@media (min-width:720px){.next{right:32px;bottom:32px}}
.scrim{position:fixed;inset:0;z-index:5;background:rgba(31,30,36,.2)}
.sheet{position:fixed;z-index:6;left:50%;bottom:0;transform:translateX(-50%);width:100%;max-width:480px;box-sizing:border-box;padding:24px 20px calc(20px + env(safe-area-inset-bottom,0px));background:var(--sheet);-webkit-backdrop-filter:blur(18px) saturate(140%);backdrop-filter:blur(18px) saturate(140%);border-radius:22px 22px 0 0;box-shadow:0 -10px 40px rgba(60,50,80,.14);display:flex;flex-direction:column;gap:18px}
.sheet h2{margin:0;font-weight:400;font-size:20px;font-style:italic}
.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.opt{display:flex;align-items:center;justify-content:center;min-height:48px;padding:0 12px;border:1px solid var(--line);border-radius:999px;background:rgba(255,255,255,.55);color:var(--ink);font:inherit;font-size:16px;text-decoration:none;cursor:pointer;text-align:center}
.opt:hover{background:#fff}
.opt.primary{background:#1F1E24;color:#F7F5F9;border-color:#1F1E24}
.opt.primary:hover{background:#34323B}
.imgrow{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.imgrow>.opt:only-child{grid-column:1 / -1}
.sub{margin:0;font-size:14px;color:var(--muted)}
.close{align-self:center;background:none;border:0;font:inherit;font-size:15px;color:var(--muted);min-height:44px;padding:0 16px;cursor:pointer}
.toast{position:fixed;z-index:7;left:50%;bottom:calc(28px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:#F7F5F9;font-size:15px;padding:10px 18px;border-radius:999px}
@media (min-width:720px){blockquote{font-size:calc(var(--fs,33px)*1.3)}.author{font-size:20px}.ref{font-size:16px}.mark{font-size:120px;height:48px}.card{gap:48px}.sheet{bottom:32px;border-radius:22px}}
@media (prefers-reduced-motion:no-preference){.bg{animation:fade .9s ease-out both}.card{animation:rise 1.1s .15s ease-out both}.sheet:not([hidden]){animation:up .28s ease-out both}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes up{from{opacity:0;transform:translate(-50%,16px)}to{opacity:1;transform:translate(-50%,0)}}
.h1{background:linear-gradient(180deg,#D7E8F6 0%,#E9F0F6 48%,#FBE6DA 52%,#F7DCCF 100%)}
.h2{background:linear-gradient(180deg,#D6EEE1 0%,#E8F4EC 48%,#FBF3D6 52%,#F7ECC4 100%)}
.h3{background:linear-gradient(180deg,#E2DCF4 0%,#EEEAF7 48%,#FAE6EC 52%,#F6D9E2 100%)}
.p1{background:conic-gradient(from 210deg at 50% 45%,#F6E7F0,#E7ECF8,#E4F4EE,#F7F1DF,#F6E4E6,#F6E7F0)}
.p2{background:conic-gradient(from 40deg at 45% 55%,#E1ECF8,#E3F4EE,#EEE8F8,#F3F6FB,#E6EEF7,#E1ECF8)}
.p3{background:conic-gradient(from 300deg at 55% 40%,#F9E3E4,#F8EEDB,#F6E5F0,#FBEFE7,#F4E1E8,#F9E3E4)}
.w1{background:radial-gradient(ellipse 60% 40% at 100% 0%,rgba(246,196,214,.75),rgba(246,196,214,0)),radial-gradient(ellipse 50% 35% at 72% 8%,rgba(252,226,176,.7),rgba(252,226,176,0)),radial-gradient(ellipse 60% 38% at 0% 100%,rgba(186,222,210,.75),rgba(186,222,210,0)),radial-gradient(ellipse 45% 30% at 28% 94%,rgba(200,204,244,.7),rgba(200,204,244,0)),#FDFCFB}
.w2{background:radial-gradient(ellipse 62% 40% at 0% 0%,rgba(212,200,244,.8),rgba(212,200,244,0)),radial-gradient(ellipse 48% 32% at 30% 6%,rgba(190,220,246,.7),rgba(190,220,246,0)),radial-gradient(ellipse 60% 38% at 100% 100%,rgba(250,210,190,.75),rgba(250,210,190,0)),radial-gradient(ellipse 45% 30% at 72% 94%,rgba(250,236,184,.7),rgba(250,236,184,0)),#FDFCFD}
.w3{background:radial-gradient(ellipse 70% 36% at 50% 0%,rgba(188,228,208,.8),rgba(188,228,208,0)),radial-gradient(ellipse 40% 28% at 92% 10%,rgba(232,240,184,.7),rgba(232,240,184,0)),radial-gradient(ellipse 70% 34% at 50% 100%,rgba(246,200,210,.72),rgba(246,200,210,0)),radial-gradient(ellipse 40% 26% at 8% 92%,rgba(252,222,196,.7),rgba(252,222,196,0)),#FCFDFC}
</style>
</head>

<blockquote id="text">Let your vision be world-embracing, rather than confined to your own self.</blockquote>
<figcaption class="who"><span class="author" id="author">Bahá’u’lláh</span><a class="ref" id="ref" href="https://www.bahai.org/library/" target="_blank" rel="noopener">Gleanings from the Writings of Bahá’u’lláh</a>

<script>
var Q=[["Do not be content with showing friendship in words alone, let your heart burn with loving-kindness for all who may cross your path.","‘Abdu’l-Bahá","Paris Talks, Part One, 1","https://www.bahai.org/r/246051385",1],["I admonish you to observe courtesy, for above all else it is the prince of virtues. Well is it with him who is illumined with the light of courtesy and is attired with the vesture of uprightness. Whoso is endued with courtesy hath indeed attained a sublime station.","Bahá’u’lláh","Tablets of Bahá’u’lláh, Lawḥ-i-Dunyá","https://www.bahai.org/r/245257943",2],["Ye must shine as stars radiating the light of love toward all mankind.","‘Abdu’l-Bahá","The Promulgation of Universal Peace, 109","https://www.bahai.org/r/549267239",3],["Know thou that the soul of man is exalted above, and is independent of, all infirmities of body or mind.","Bahá’u’lláh","Gleanings from the Writings of Bahá’u’lláh, LXXX","https://www.bahai.org/r/240578767",4],["Equality between men and women is conducive to the abolition of warfare for the reason that women will never be willing to sanction it. Mothers will not give their sons as sacrifices upon the battlefield after twenty years of anxiety and loving devotion in rearing them from infancy, no matter what cause they are called upon to defend. There is no doubt that when women obtain equality of rights, war will entirely cease among mankind.","‘Abdu’l-Bahá","The Promulgation of Universal Peace, 62","https://www.bahai.org/r/986057314",5],["The well-being of mankind, its peace and security, are unattainable unless and until its unity is firmly established.","Bahá’u’lláh","Gleanings from the Writings of Bahá’u’lláh, CXXXI","https://www.bahai.org/r/877770890",6],["To give and to be generous are attributes of Mine; well is it with him that adorneth himself with My virtues.","Bahá’u’lláh","The Hidden Words, From the Persian","https://www.bahai.org/r/886046055",7],["“True civilization will unfurl its banner in the midmost heart of the world whenever a certain number of its distinguished and high-minded sovereigns—the shining exemplars of devotion and determination—shall, for the good and happiness of all mankind, arise, with firm resolve and clear vision, to establish the Cause of Universal Peace. They must make the Cause of Peace the object of general consultation, and seek by every means in their power to establish a Union of the nations of the world.","‘Abdu’l-Bahá","The World Order of Bahá’u’lláh, The Goal of a New World Order","https://www.bahai.org/r/413673867",10],["Truthfulness is the foundation of all human virtues. Without truthfulness progress and success, in all the worlds of God, are impossible for any soul. When this holy attribute is established in man, all the divine qualities will also be acquired.","‘Abdu’l-Bahá","Bahá’í Sacred Writings, 15","https://www.bahai.org/r/467060865",11],["All created things are expressions of the affinity and cohesion of elementary substances, and nonexistence is the absence of their attraction and agreement. Various elements unite harmoniously in composition, but when these elements become discordant, repelling each other, decomposition and nonexistence result. Everything partakes of this nature and is subject to this principle, for the creative foundation in all its degrees and kingdoms is an expression or outcome of love.","‘Abdu’l-Bahá","The Promulgation of Universal Peace, 48","https://www.bahai.org/r/984729326",12],["The essence of faith is fewness of words and abundance of deeds; he whose words exceed his deeds, know verily his death is better than his life.\n\nThe essence of true safety is to observe silence, to look at the end of things and to renounce the world.","Bahá’u’lláh","Tablets of Bahá’u’lláh, Aṣl-i-Kullu’l-Khayr 1","https://www.bahai.org/r/270342197",13],["They who are the beloved of God, in whatever place they gather and whomsoever they may meet, must evince, in their attitude towards God, and in the manner of their celebration of His praise and glory, such humility and submissiveness that every atom of the dust beneath their feet may attest the depth of their devotion.","Bahá’u’lláh","Gleanings from the Writings of Bahá’u’lláh, V","https://www.bahai.org/r/598146896",14],["Lay not on any soul a load which ye would not wish to be laid upon you, and desire not for anyone the things ye would not desire for yourselves.","Bahá’u’lláh","Gleanings from the Writings of Bahá’u’lláh, LXVI","https://www.bahai.org/r/891515277",16],["Let your vision be world-embracing, rather than confined to your own self.","Bahá’u’lláh","Tablets of Bahá’u’lláh, Lawḥ-i-Dunyá","https://www.bahai.org/r/697535395",17],["In the garden of thy heart plant naught but the rose of love, and from the nightingale of affection and desire loosen not thy hold.","Bahá’u’lláh","The Hidden Words, From the Persian","https://www.bahai.org/r/607855955",18],["God is no respecter of persons on account of either color or race. All colors are acceptable to Him, be they white, black, or yellow. Inasmuch as all were created in the image of God, we must bring ourselves to realize that all embody divine possibilities.","‘Abdu’l-Bahá","The Promulgation of Universal Peace, 45","https://www.bahai.org/r/663966339",19],["The whole duty of man in this Day is to attain that share of the flood of grace which God poureth forth for him. Let none, therefore, consider the largeness or smallness of the receptacle.","Bahá’u’lláh","Gleanings from the Writings of Bahá’u’lláh, V","https://www.bahai.org/r/522495113",20],["Be thou severed from this world, and reborn through the sweet scents of holiness that blow from the realm of the All-Highest. Be thou a summoner to love, and be thou kind to all the human race. Love thou the children of men and share in their sorrows. Be thou of those who foster peace. Offer thy friendship, be worthy of trust. Be thou a balm to every sore, be thou a medicine for every ill. Bind thou the souls together.","‘Abdu’l-Bahá","Selections from the Writings of ‘Abdu’l‑Bahá, 10","https://www.bahai.org/r/381285282",21],["Hence the unity of all mankind can in this day be achieved. Verily this is none other but one of the wonders of this wondrous age, this glorious century.","‘Abdu’l-Bahá","The Promised Day Is Come, Religion and Social Evolution","https://www.bahai.org/r/513040759",22],["Meditation is the key for opening the doors of mysteries. In that state man abstracts himself: in that state man withdraws himself from all outside objects; in that subjective mood he is immersed in the ocean of spiritual life and can unfold the secrets of things-in-themselves. To illustrate this, think of man as endowed with two kinds of sight; when the power of insight is being used the outward power of vision does not see.","‘Abdu’l-Bahá","Paris Talks, Part Three, 54","https://www.bahai.org/r/176156972",23],["The Lord, peerless is He, hath made woman and man to abide with each other in the closest companionship, and to be even as a single soul. They are two helpmates, two intimate friends, who should be concerned about the welfare of each other.","‘Abdu’l-Bahá","Selections from the Writings of ‘Abdu’l‑Bahá, 92","https://www.bahai.org/r/143819463",24],["O Son of the Supreme! I have made death a messenger of joy to thee. Wherefore dost thou grieve? I made the light to shed on thee its splendor. Why dost thou veil thyself therefrom?","Bahá’u’lláh","The Hidden Words, From the Arabic","https://www.bahai.org/r/674148173",25],["O Son of Man! I loved thy creation, hence I created thee. Wherefore, do thou love Me, that I may name thy name and fill thy soul with the spirit of life.","Bahá’u’lláh","The Hidden Words, From the Arabic","https://www.bahai.org/r/486363123",26],["When calamity striketh, be ye patient and composed. However afflictive your sufferings may be, stay ye undisturbed, and with perfect confidence in the abounding grace of God, brave ye the tempest of tribulations and fiery ordeals.","‘Abdu’l-Bahá","Selections from the Writings of ‘Abdu’l‑Bahá, 35","https://www.bahai.org/r/058847057",27],["Just as God loves all and is kind to all, so must we really love and be kind to everybody. We must consider none bad, none worthy of detestation, no one as an enemy. We must love all; nay, we must consider everyone as related to us, for all are the servants of one God.","‘Abdu’l-Bahá","The Promulgation of Universal Peace, 92","https://www.bahai.org/r/587262551",28],["Lauded be Thy name, O Lord my God! I testify that Thou wast a hidden Treasure wrapped within Thine immemorial Being and an impenetrable Mystery enshrined in Thine own Essence. Wishing to reveal Thyself, Thou didst call into being the Greater and the Lesser Worlds, and didst choose Man above all Thy creatures, and didst make Him a sign of both of these worlds, O Thou Who art our Lord, the Most Compassionate!","Bahá’u’lláh","Prayers and Meditations by Bahá’u’lláh, XXXVIII","https://www.bahai.org/r/548287024",29],["Therefore it is imperative that we should renounce our own particular prejudices and superstitions if we earnestly desire to seek the truth.","‘Abdu’l-Bahá","Paris Talks, Part Two, 41","https://www.bahai.org/r/360118382",30],["Day by day become more closely attracted in order that the love of God may illumine all those with whom you come in contact. Be as one spirit, one soul, leaves of one tree, flowers of one garden, waves of one ocean.","‘Abdu’l-Bahá","The Promulgation of Universal Peace, 10","https://www.bahai.org/r/287349353",31],["When all mankind shall receive the same opportunity of education and the equality of men and women be realized, the foundations of war will be utterly destroyed.","‘Abdu’l-Bahá","The Promulgation of Universal Peace, 62","https://www.bahai.org/r/986057314",32],["The Prophets of God should be regarded as physicians whose task is to foster the well-being of the world and its peoples, that, through the spirit of oneness, they may heal the sickness of a divided humanity.","Bahá’u’lláh","Gleanings from the Writings of Bahá’u’lláh, XXXIV","https://www.bahai.org/r/186183494",33],["Let each morn be better than its eve and each morrow richer than its yesterday. Man’s merit lieth in service and virtue and not in the pageantry of wealth and riches. Take heed that your words be purged from idle fancies and worldly desires and your deeds be cleansed from craftiness and suspicion. Dissipate not the wealth of your precious lives in the pursuit of evil and corrupt affection, nor let your endeavors be spent in promoting your personal interest.","Bahá’u’lláh","Tablets of Bahá’u’lláh, Lawḥ-i-Ḥikmat","https://www.bahai.org/r/091419613",34],["The spirit is changeless, indestructible. The progress and development of the soul, the joy and sorrow of the soul, are independent of the physical body.","‘Abdu’l-Bahá","Paris Talks, Part One, 20","https://www.bahai.org/r/851921831",35],["With the utmost friendliness and in a spirit of perfect fellowship take ye counsel together, and dedicate the precious days of your lives to the betterment of the world and the promotion of the Cause of Him Who is the Ancient and Sovereign Lord of all.","Bahá’u’lláh","Gleanings from the Writings of Bahá’u’lláh, XCII","https://www.bahai.org/r/877427947",36],["Creation is the expression of motion. Motion is life. A moving object is a living object, whereas that which is motionless and inert is as dead. All created forms are progressive in their planes, or kingdoms of existence, under the stimulus of the power or spirit of life.","‘Abdu’l-Bahá","The Promulgation of Universal Peace, 52","https://www.bahai.org/r/863630956",37],["It is an axiomatic fact that while you meditate you are speaking with your own spirit. In that state of mind you put certain questions to your spirit and the spirit answers: the light breaks forth and the reality is revealed.","‘Abdu’l-Bahá","Paris Talks, Part Three, 54","https://www.bahai.org/r/896911561",38],["Strive, therefore, to create love in the hearts in order that they may become glowing and radiant.","‘Abdu’l-Bahá","The Promulgation of Universal Peace, 84","https://www.bahai.org/r/559967968",39],["Therefore strive that your actions day by day may be beautiful prayers. Turn towards God, and seek always to do that which is right and noble. Enrich the poor, raise the fallen, comfort the sorrowful, bring healing to the sick, reassure the fearful, rescue the oppressed, bring hope to the hopeless, shelter the destitute!","‘Abdu’l-Bahá","Paris Talks, Part One, 26","https://www.bahai.org/r/144066038",40],["Existence is realized and possible through the bounty of God, just as the ray or flame emanating from this lamp is realized through the bounty of the lamp, from which it originates. Even so, all phenomena are realized through the divine bounty, and the explanation of true pantheistic statement and principle is that the phenomena of the universe find realization through the one power animating and dominating all things, and all things are but manifestations of its energy and bounty.","‘Abdu’l-Bahá","The Promulgation of Universal Peace, 96","https://www.bahai.org/r/163204180",41],["Among the proofs of the existence of a divine power is this: that things are often known by their opposites. Were it not for darkness, light could not be sensed. Were it not for death, life could not be known. If ignorance did not exist, knowledge would not be a reality.","‘Abdu’l-Bahá","The Promulgation of Universal Peace, 35","https://www.bahai.org/r/152511944",42],["The betterment of the world can be accomplished through pure and goodly deeds, through commendable and seemly conduct.","Bahá’u’lláh","A Chaste and Holy Life, The Power of Example","https://www.bahai.org/r/453848667",43],["Just as the phenomenal sun shines upon the material world producing life and growth, likewise, the spiritual or prophetic Sun confers illumination upon the human world of thought and intelligence, and unless it rose upon the horizon of human existence, the kingdom of man would become dark and extinguished.","‘Abdu’l-Bahá","The Promulgation of Universal Peace, 40","https://www.bahai.org/r/077360701",44],["Do not despair! Work steadily. Sincerity and love will conquer hate. How many seemingly impossible events are coming to pass in these days! Set your faces steadily towards the Light of the World. Show love to all; “Love is the breath of the Holy Spirit in the heart of Man.” Take courage! God never forsakes His children who strive and work and pray! Let your hearts be filled with the strenuous desire that tranquillity and harmony may encircle all this warring world.","‘Abdu’l-Bahá","Paris Talks, Part One, 6","https://www.bahai.org/r/285300504",45],["This is the Day in which God’s most excellent favors have been poured out upon men, the Day in which His most mighty grace hath been infused into all created things. It is incumbent upon all the peoples of the world to reconcile their differences, and, with perfect unity and peace, abide beneath the shadow of the Tree of His care and loving-kindness.","Bahá’u’lláh","Gleanings from the Writings of Bahá’u’lláh, IV","https://www.bahai.org/r/053948477",46],["One must see in every human being only that which is worthy of praise. When this is done, one can be a friend to the whole human race. If, however, we look at people from the standpoint of their faults, then being a friend to them is a formidable task.","‘Abdu’l-Bahá","Selections from the Writings of ‘Abdu’l‑Bahá, 144","https://www.bahai.org/r/654843356",47],["Never lose thy trust in God. Be thou ever hopeful, for the bounties of God never cease to flow upon man. If viewed from one perspective they seem to decrease, but from another they are full and complete. Man is under all conditions immersed in a sea of God’s blessings. Therefore, be thou not hopeless under any circumstances, but rather be firm in thy hope.","‘Abdu’l-Bahá","Selections from the Writings of ‘Abdu’l‑Bahá, 178","https://www.bahai.org/r/783627948",48],["Love is heaven’s kindly light, the Holy Spirit’s eternal breath that vivifieth the human soul. Love is the cause of God’s revelation unto man, the vital bond inherent, in accordance with the divine creation, in the realities of things. Love is the one means that ensureth true felicity both in this world and the next. Love is the light that guideth in darkness, the living link that uniteth God with man, that assureth the progress of every illumined soul.","‘Abdu’l-Bahá","Selections from the Writings of ‘Abdu’l‑Bahá, 12","https://www.bahai.org/r/407306067",49],["The best beloved of all things in My sight is Justice; turn not away therefrom if thou desirest Me, and neglect it not that I may confide in thee. By its aid thou shalt see with thine own eyes and not through the eyes of others, and shalt know of thine own knowledge and not through the knowledge of thy neighbor.","Bahá’u’lláh","Tablets of Bahá’u’lláh, Ṭarázát","https://www.bahai.org/r/961412317",50],["O Son of Spirit! Ask not of Me that which We desire not for thee, then be content with what We have ordained for thy sake, for this is that which profiteth thee, if therewith thou dost content thyself.","Bahá’u’lláh","The Hidden Words, From the Arabic","https://www.bahai.org/r/172973975",51],["The art of music is divine and effective. It is the food of the soul and spirit. Through the power and charm of music the spirit of man is uplifted. It has wonderful sway and effect in the hearts of children, for their hearts are pure, and melodies have great influence in them.","‘Abdu’l-Bahá","The Promulgation of Universal Peace, 21","https://www.bahai.org/r/004219341",53],["The first sign of faith is love. The message of the holy, divine Manifestations is love; the phenomena of creation are based upon love; the radiance of the world is due to love; the well-being and happiness of the world depend upon it. Therefore, I admonish you that you must strive throughout the human world to diffuse the light of love. The people of this world are thinking of warfare; you must be peacemakers.","‘Abdu’l-Bahá","The Promulgation of Universal Peace, 107","https://www.bahai.org/r/604539638",54],["This is the hour when ye must associate with all the earth’s peoples in extreme kindliness and love, and be to them the signs and tokens of God’s great mercy.","‘Abdu’l-Bahá","Selections from the Writings of ‘Abdu’l‑Bahá, 7","https://www.bahai.org/r/660397770",55],["Lift up your hearts above the present and look with eyes of faith into the future! Today the seed is sown, the grain falls upon the earth, but behold the day will come when it shall rise a glorious tree and the branches thereof shall be laden with fruit. Rejoice and be glad that this day has dawned, try to realize its power, for it is indeed wonderful! God has crowned you with honour and in your hearts has He set a radiant star; verily the light thereof shall brighten the whole world!","‘Abdu’l-Bahá","Paris Talks, Part One, 21","https://www.bahai.org/r/915979998",57],["Every imperfect soul is self-centred and thinketh only of his own good. But as his thoughts expand a little he will begin to think of the welfare and comfort of his family. If his ideas still more widen, his concern will be the felicity of his fellow citizens; and if still they widen, he will be thinking of the glory of his land and of his race.","‘Abdu’l-Bahá","Family Life, III. Enhancing Family Life","https://www.bahai.org/r/961792683",58],["Whoso reciteth, in the privacy of his chamber, the verses revealed by God, the scattering angels of the Almighty shall scatter abroad the fragrance of the words uttered by his mouth, and shall cause the heart of every righteous man to throb.","Bahá’u’lláh","Bahá’í Prayers","https://www.bahai.org/r/358258487",59],["God does not look at colors; He looks at the hearts.","‘Abdu’l-Bahá","The Promulgation of Universal Peace, 18","https://www.bahai.org/r/098175321",60],["O Son of Being! Bring thyself to account each day ere thou art summoned to a reckoning; for death, unheralded, shall come upon thee and thou shalt be called to give account for thy deeds.","Bahá’u’lláh","The Hidden Words, From the Arabic","https://www.bahai.org/r/048313746",61],["O Son of Being! Thou art My lamp and My light is in thee. Get thou from it thy radiance and seek none other than Me. For I have created thee rich and have bountifully shed My favor upon thee.","Bahá’u’lláh","The Hidden Words, From the Arabic","https://www.bahai.org/r/360291284",62],["O Son of Man! Wert thou to speed through the immensity of space and traverse the expanse of heaven, yet thou wouldst find no rest save in submission to Our command and humbleness before Our Face.","Bahá’u’lláh","The Hidden Words, From the Arabic","https://www.bahai.org/r/815268217",63],["Meditate profoundly, that the secret of things unseen may be revealed unto you, that you may inhale the sweetness of a spiritual and imperishable fragrance, and that you may acknowledge the truth that from time immemorial even unto eternity the Almighty hath tried, and will continue to try, His servants, so that light may be distinguished from darkness, truth from falsehood, right from wrong, guidance from error, happiness from misery, and roses from thorns.","Bahá’u’lláh","The Kitáb-i-Íqán, Part One","https://www.bahai.org/r/458862864",64],["Know, verily, that the soul is a sign of God, a heavenly gem whose reality the most learned of men hath failed to grasp, and whose mystery no mind, however acute, can ever hope to unravel. It is the first among all created things to declare the excellence of its Creator, the first to recognize His glory, to cleave to His truth, and to bow down in adoration before Him.","Bahá’u’lláh","Gleanings from the Writings of Bahá’u’lláh, LXXXII","https://www.bahai.org/r/385974767",65],["Prayer need not be in words, but rather in thought and attitude.","Bahá’u’lláh","The Importance of Prayer, Meditation and the Devotional Attitude: A Compilation","https://www.bahai.org/r/287897652",66],["Man possesses two kinds of susceptibilities: the natural emotions, which are like dust upon the mirror, and spiritual susceptibilities, which are merciful and heavenly characteristics.","‘Abdu’l-Bahá","The Promulgation of Universal Peace, 86","https://www.bahai.org/r/042845030",67],["It is incumbent upon every man of insight and understanding to strive to translate that which hath been written into reality and action.… That one indeed is a man who, today, dedicateth himself to the service of the entire human race.","Bahá’u’lláh","Gleanings from the Writings of Bahá’u’lláh, CXVII","https://www.bahai.org/r/696472436",68],["Every day, in the morning when arising you should compare today with yesterday and see in what condition you are. If you see your belief is stronger and your heart more occupied with God and your love increased and your freedom from the world greater then thank God and ask for the increase of these qualities.","‘Abdu’l-Bahá","Excellence in All Things","https://www.bahai.org/r/415812294",69],["Do not allow difference of opinion or diversity of thought to separate you from your fellowmen, or to be the cause of dispute, hatred and strife in your hearts.","‘Abdu’l-Bahá","Paris Talks, Part One, 15","https://www.bahai.org/r/677334451",70],["This Wronged One testifieth that the purpose for which mortal men have, from utter nothingness, stepped into the realm of being, is that they may work for the betterment of the world and live together in concord and harmony.","Bahá’u’lláh","Bahá’í Sacred Writings, 2","https://www.bahai.org/r/486355758",71],["O Son of Spirit! My first counsel is this: Possess a pure, kindly and radiant heart, that thine may be a sovereignty ancient, imperishable and everlasting.","Bahá’u’lláh","The Hidden Words, From the Arabic","https://www.bahai.org/r/986635113",72],["Hence the new age will be an age less masculine and more permeated with the feminine ideals, or, to speak more exactly, will be an age in which the masculine and feminine elements of civilization will be more evenly balanced.","‘Abdu’l-Bahá","Women, I. The Bahá’í Concept of Equality","https://www.bahai.org/r/073873420",73],["The third teaching of Bahá’u’lláh concerns universal peace among the nations, among the religions, among the races and native lands. He has declared that so long as prejudice—whether religious, racial, patriotic, political or sectarian—continues to exist among mankind, universal peace cannot become a reality in the world.","‘Abdu’l-Bahá","The Promulgation of Universal Peace, 113","https://www.bahai.org/r/553035508",74],["But, O my brother, when a true seeker determineth to take the step of search in the path leading to the knowledge of the Ancient of Days, he must, before all else, cleanse and purify his heart, which is the seat of the revelation of the inner mysteries of God, from the obscuring dust of all acquired knowledge, and the allusions of the embodiments of satanic fancy.","Bahá’u’lláh","The Kitáb-i-Íqán, Part Two","https://www.bahai.org/r/477357906",75],["O Son of Man! Sorrow not save that thou art far from Us. Rejoice not save that thou art drawing near and returning unto Us.","Bahá’u’lláh","The Hidden Words, From the Arabic","https://www.bahai.org/r/695756189",76],["The wrong in the world continues to exist just because people talk only of their ideals, and do not strive to put them into practice. If actions took the place of words, the world’s misery would very soon be changed into comfort.","‘Abdu’l-Bahá","Paris Talks, Part One, 1","https://www.bahai.org/r/838949838",77],["Should any come to blows with you, seek to be friends with him; should any stab you to the heart, be ye a healing salve unto his sores; should any taunt and mock at you, meet him with love.","‘Abdu’l-Bahá","Selections from the Writings of ‘Abdu’l‑Bahá, 16","https://www.bahai.org/r/117959446",78],["God has conferred upon and added to man a distinctive power—the faculty of intellectual investigation into the secrets of creation, the acquisition of higher knowledge—the greatest virtue of which is scientific enlightenment.","‘Abdu’l-Bahá","The Promulgation of Universal Peace, 12","https://www.bahai.org/r/175980950",79],["Be patient under all conditions, and place your whole trust and confidence in God.","Bahá’u’lláh","Gleanings from the Writings of Bahá’u’lláh, CXXXVI","https://www.bahai.org/r/387272619",80],["Love everybody; serve everybody.","‘Abdu’l-Bahá","The Promulgation of Universal Peace, 109","https://www.bahai.org/r/549267239",81],["The heavenly Jerusalem is none other than divine civilization, and it is now ready. It is to be and shall be organized, and the oneness of humankind will be a visible fact. Humanity will then be brought together as one. The various religions will be united, and different races will be known as one kind.","‘Abdu’l-Bahá","The Promulgation of Universal Peace, 42","https://www.bahai.org/r/624358342",82],["Love the creatures for the sake of God and not for themselves. You will never become angry or impatient if you love them for the sake of God.","‘Abdu’l-Bahá","The Promulgation of Universal Peace, 39","https://www.bahai.org/r/424700415",83],["Speak no evil, that thou mayest not hear it spoken unto thee, and magnify not the faults of others that thine own faults may not appear great; and wish not the abasement of anyone, that thine own abasement be not exposed.","Bahá’u’lláh","The Hidden Words, From the Persian","https://www.bahai.org/r/697759113",84],["I cheer the faint and revive the dead. I am the guiding Light that illumineth the way. I am the royal Falcon on the arm of the Almighty. I unfold the drooping wings of every broken bird and start it on its flight.","Bahá’u’lláh","The Tabernacle of Unity","https://www.bahai.org/r/663648202",85],["O Son of Love! Thou art but one step away from the glorious heights above and from the celestial tree of love. Take thou one pace and with the next advance into the immortal realm and enter the pavilion of eternity.","Bahá’u’lláh","The Hidden Words, From the Persian","https://www.bahai.org/r/866203931",86],["It is my hope that you may consider this matter, that you may search out your own imperfections and not think of the imperfections of anybody else. Strive with all your power to be free from imperfections. Heedless souls are always seeking faults in others. What can the hypocrite know of others’ faults when he is blind to his own?","‘Abdu’l-Bahá","The Promulgation of Universal Peace, 86","https://www.bahai.org/r/700778835",88],["Thine eye is My trust, suffer not the dust of vain desires to becloud its luster. Thine ear is a sign of My bounty, let not the tumult of unseemly motives turn it away from My Word that encompasseth all creation. Thine heart is My treasury, allow not the treacherous hand of self to rob thee of the pearls which I have treasured therein.","Bahá’u’lláh","Gleanings from the Writings of Bahá’u’lláh, CLII","https://www.bahai.org/r/157656529",89],["If a small number of people gather lovingly together, with absolute purity and sanctity, with their hearts free of the world, experiencing the emotions of the Kingdom and the powerful magnetic forces of the Divine, and being at one in their happy fellowship, that gathering will exert its influence over all the earth.","‘Abdu’l-Bahá","Selections from the Writings of ‘Abdu’l‑Bahá, 39","https://www.bahai.org/r/600234043",90],["It is appropriate and befitting that in this illumined age—the age of the progress of the world of humanity—we should be self-sacrificing and should serve the human race.","‘Abdu’l-Bahá","Selections from the Writings of ‘Abdu’l‑Bahá, 34","https://www.bahai.org/r/823691322",91],["The world of humanity is possessed of two wings: the male and the female. So long as these two wings are not equivalent in strength, the bird will not fly. Until womankind reaches the same degree as man, until she enjoys the same arena of activity, extraordinary attainment for humanity will not be realized; humanity cannot wing its way to heights of real attainment.","‘Abdu’l-Bahá","The Promulgation of Universal Peace, 113","https://www.bahai.org/r/365983525",92],["Pollute not your tongues by speaking evil of another.","‘Abdu’l-Bahá","The Promulgation of Universal Peace, 134","https://www.bahai.org/r/864288420",93],["Be generous in your days of plenty, and be patient in the hour of loss. Adversity is followed by success and rejoicings follow woe.","Bahá’u’lláh","Tablets of Bahá’u’lláh, Lawḥ-i-Ḥikmat","https://www.bahai.org/r/091419613",94],["In the world of existence there is indeed no greater power than the power of love.","‘Abdu’l-Bahá","Paris Talks, Part Three, 58","https://www.bahai.org/r/894391376",95],["That is why Christ has addressed the world, saying, “Except ye be converted, and become as little children, ye shall not enter into the kingdom of heaven”—that is, men must become pure in heart to know God. The teachings have had great effect. Spiritual souls! Tender souls! The hearts of all children are of the utmost purity. They are mirrors upon which no dust has fallen.","‘Abdu’l-Bahá","The Promulgation of Universal Peace, 21","https://www.bahai.org/r/785172279",96],["Know then that the Lord God possesseth invisible realms which the human intellect can never hope to fathom nor the mind of man conceive.","‘Abdu’l-Bahá","Selections from the Writings of ‘Abdu’l‑Bahá, 156","https://www.bahai.org/r/149372432",97],["Blessed are the steadfastly enduring, they that are patient under ills and hardships, who lament not over anything that befalleth them, and who tread the path of resignation.","Bahá’u’lláh","The Summons of the Lord of Hosts, Súriy-i-Mulúk","https://www.bahai.org/r/655967186",98],["The truth, however, is that the rational soul is the substance through which the body subsists. If the accident—the body—is destroyed, the substance—the spirit—remains.","‘Abdu’l-Bahá","Some Answered Questions, 66","https://www.bahai.org/r/338189071",99],["The Great Being saith: Regard man as a mine rich in gems of inestimable value. Education can, alone, cause it to reveal its treasures, and enable mankind to benefit therefrom.","Bahá’u’lláh","Tablets of Bahá’u’lláh, Lawḥ-i-Maqṣúd","https://www.bahai.org/r/009015192",100],["Rely upon God. Trust in Him. Praise Him, and call Him continually to mind. He verily turneth trouble into ease, and sorrow into solace, and toil into utter peace. He verily hath dominion over all things.","‘Abdu’l-Bahá","Selections from the Writings of ‘Abdu’l‑Bahá, 150","https://www.bahai.org/r/086400364",101],["Just as God, the Exalted, hath said, “Him will We surely quicken to a happy life.” Supreme importance should be attached, therefore, not to this first creation but rather to the future life.","‘Abdu’l-Bahá","Selections from the Writings of ‘Abdu’l‑Bahá, 165","https://www.bahai.org/r/935588087",102],["Spiritual progress ensures the happiness and eternal continuance of the soul.","‘Abdu’l-Bahá","The Promulgation of Universal Peace, 52","https://www.bahai.org/r/571510216",103],["All these examples are to show you that the trials which beset our every step, all our sorrow, pain, shame and grief, are born in the world of matter; whereas the spiritual Kingdom never causes sadness. A man living with his thoughts in this Kingdom knows perpetual joy.","‘Abdu’l-Bahá","Paris Talks, Part One, 35","https://www.bahai.org/r/462847314",104],["Love is greater than peace, for peace is founded upon love. Love is the objective point of peace, and peace is an outcome of love. Until love is attained, peace cannot be; but there is a so-called peace without love. The love which is from God is the fundamental. This love is the object of all human attainment, the radiance of heaven, the light of man.","‘Abdu’l-Bahá","The Promulgation of Universal Peace, 60","https://www.bahai.org/r/510703096",105],["Tests are benefits from God, for which we should thank Him. Grief and sorrow do not come to us by chance, they are sent to us by the Divine Mercy for our own perfecting.","‘Abdu’l-Bahá","Paris Talks, Part One, 14","https://www.bahai.org/r/119765690",106],["Nothing is more fruitful for man than the knowledge of his own shortcomings.","‘Abdu’l-Bahá","The Promulgation of Universal Peace, 86","https://www.bahai.org/r/700778835",107],["Turn to God, supplicate humbly at His threshold, seeking assistance and confirmation, that God may rend asunder the veils that obscure your vision. Then will your eyes be filled with illumination, face to face you will behold the reality of God and your heart become completely purified from the dross of ignorance, reflecting the glories and bounties of the Kingdom.","‘Abdu’l-Bahá","The Promulgation of Universal Peace, 97","https://www.bahai.org/r/743483799",108],["Act in such a way that your heart may be free from hatred.","‘Abdu’l-Bahá","The Promulgation of Universal Peace, 134","https://www.bahai.org/r/864288420",110],["Verily I say, the human soul is exalted above all egress and regress. It is still, and yet it soareth; it moveth, and yet it is still. It is, in itself, a testimony that beareth witness to the existence of a world that is contingent, as well as to the reality of a world that hath neither beginning nor end.","Bahá’u’lláh","Gleanings from the Writings of Bahá’u’lláh, LXXXII","https://www.bahai.org/r/177790950",111],["They should manifest gratitude and thankfulness to God, and the best way to thank God is to love one another.","‘Abdu’l-Bahá","The Promulgation of Universal Peace, 140","https://www.bahai.org/r/117201530",112],["Likewise, when you meet those whose opinions differ from your own, do not turn away your face from them.","‘Abdu’l-Bahá","Paris Talks, Part One, 15","https://www.bahai.org/r/219139144",113],["These few brief days shall pass away, this present life shall vanish from our sight; the roses of this world shall be fresh and fair no more, the garden of this earth’s triumphs and delights shall droop and fade. The spring season of life shall turn into the autumn of death, the bright joy of palace halls give way to moonless dark within the tomb. And therefore is none of this worth loving at all, and to this the wise will not anchor his heart.","‘Abdu’l-Bahá","Selections from the Writings of ‘Abdu’l‑Bahá, 188","https://www.bahai.org/r/963160111",114],["Therefore, in this world he must prepare himself for the life beyond. That which he needs in the world of the Kingdom must be obtained here. Just as he prepared himself in the world of the matrix by acquiring forces necessary in this sphere of existence, so, likewise, the indispensable forces of the divine existence must be potentially attained in this world.","‘Abdu’l-Bahá","The Promulgation of Universal Peace, 81","https://www.bahai.org/r/653095072",115],["Love them all with your whole heart; no one is a stranger to the other, all are friends.","‘Abdu’l-Bahá","Paris Talks, Part Two, 53","https://www.bahai.org/r/568565770",116],["Be kind to all peoples; care for every person; do all ye can to purify the hearts and minds of men; strive ye to gladden every soul. To every meadow be a shower of grace, to every tree the water of life; be as sweet musk to the sense of humankind, and to the ailing be a fresh, restoring breeze.","‘Abdu’l-Bahá","Selections from the Writings of ‘Abdu’l‑Bahá, 200","https://www.bahai.org/r/209043457",117],["Consultation bestoweth greater awareness and transmuteth conjecture into certitude. It is a shining light which, in a dark world, leadeth the way and guideth. For everything there is and will continue to be a station of perfection and maturity.","Bahá’u’lláh","Consultation: A Compilation","https://www.bahai.org/r/272517715",118],["Say: Let truthfulness and courtesy be your adorning. Suffer not yourselves to be deprived of the robe of forbearance and justice, that the sweet savors of holiness may be wafted from your hearts upon all created things.","Bahá’u’lláh","Gleanings from the Writings of Bahá’u’lláh, CXXXIX","https://www.bahai.org/r/482116648",119],["Likewise, look into this endless universe: a universal power inevitably existeth, which encompasseth all, directing and regulating all the parts of this infinite creation; and were it not for this Director, this Coordinator, the universe would be flawed and deficient.","‘Abdu’l-Bahá","Selections from the Writings of ‘Abdu’l‑Bahá, 21","https://www.bahai.org/r/996141239",120],["Religion is the outer expression of the divine reality. Therefore, it must be living, vitalized, moving and progressive. If it be without motion and nonprogressive, it is without the divine life; it is dead.","‘Abdu’l-Bahá","The Promulgation of Universal Peace, 52","https://www.bahai.org/r/841894042",121],["O people of Justice! Be as brilliant as the light, and as splendid as the fire that blazed in the Burning Bush. The brightness of the fire of your love will no doubt fuse and unify the contending peoples and kindreds of the earth, whilst the fierceness of the flame of enmity and hatred cannot but result in strife and ruin.","Bahá’u’lláh","Gleanings from the Writings of Bahá’u’lláh, XLIII","https://www.bahai.org/r/523377538",122],["Be fair in thy judgment, and guarded in thy speech. Be unjust to no man, and show all meekness to all men. Be as a lamp unto them that walk in darkness, a joy to the sorrowful, a sea for the thirsty, a haven for the distressed, an upholder and defender of the victim of oppression. Let integrity and uprightness distinguish all thine acts. Be a home for the stranger, a balm to the suffering, a tower of strength for the fugitive.","Bahá’u’lláh","Gleanings from the Writings of Bahá’u’lláh, CXXX","https://www.bahai.org/r/174232426",123],["O Son of Man! Veiled in My immemorial being and in the ancient eternity of My essence, I knew My love for thee; therefore I created thee, have engraved on thee Mine image and revealed to thee My beauty.","Bahá’u’lláh","The Hidden Words, From the Arabic","https://www.bahai.org/r/246296008",124],["It is not for him to pride himself who loveth his own country, but rather for him who loveth the whole world. The earth is but one country, and mankind its citizens.","Bahá’u’lláh","The World Order of Bahá’u’lláh, The Unfoldment of World Civilization","https://www.bahai.org/r/391200266",125],["Do harm to nobody; pray for all; try to make your light shine in the world and let your banner fly high in the Heavens. The beautiful perfume of your noble lives will permeate everywhere. The light of truth kindled in your hearts will shine out to the distant horizon!","‘Abdu’l-Bahá","Paris Talks, Part One, 38","https://www.bahai.org/r/623746937",126],["When one examines creation with a penetrating eye, when one grasps the intricacies of created things and witnesses the condition, the order, and the completeness of the world of existence, one is convinced of the truth that “there is naught in creation more wondrous than that which already exists”.","‘Abdu’l-Bahá","Some Answered Questions, 46","https://www.bahai.org/r/988001699",127],["The most acceptable prayer is the one offered with the utmost spirituality and radiance; its prolongation hath not been and is not beloved by God. The more detached and the purer the prayer, the more acceptable is it in the presence of God.","The Báb","Selections from the Writings of the Báb, Excerpts from the Persian Bayán","https://www.bahai.org/r/375009817",128],["The Spirit breathing through the Holy Scriptures is food for all who hunger. God Who has given the revelation to His Prophets will surely give of His abundance daily bread to all those who ask Him faithfully.","‘Abdu’l-Bahá","Paris Talks, Part One, 16","https://www.bahai.org/r/297103118",129],["I pray for each and all that you may be as flames of love in the world, and that the brightness of your light and the warmth of your affection may reach the heart of every sad and sorrowing child of God.","‘Abdu’l-Bahá","Paris Talks, Part One, 30","https://www.bahai.org/r/055180367",130],["To every human being must ye be infinitely kind.","‘Abdu’l-Bahá","Selections from the Writings of ‘Abdu’l‑Bahá, 221","https://www.bahai.org/r/708247665",131],["Let not your heart be offended with anyone. If some one commits an error and wrong toward you, you must instantly forgive him. Do not complain of others. Refrain from reprimanding them, and if you wish to give admonition or advice, let it be offered in such a way that it will not burden the bearer. Turn all your thoughts toward bringing joy to hearts.","‘Abdu’l-Bahá","The Promulgation of Universal Peace, 134","https://www.bahai.org/r/864288420",132],["Within the treasury of Our Wisdom there lieth unrevealed a knowledge, one word of which, if We chose to divulge it to mankind, would cause every human being to recognize the Manifestation of God and to acknowledge His omniscience, would enable every one to discover the secrets of all the sciences, and to attain so high a station as to find himself wholly independent of all past and future learning.","Bahá’u’lláh","The Summons of the Lord of Hosts, Súriy-i-Haykal","https://www.bahai.org/r/547283205",133],["All should know, and in this regard attain the splendours of the sun of certitude, and be illumined thereby: Women and men have been and will always be equal in the sight of God.","Bahá’u’lláh","Bahá’í Sacred Writings, 7","https://www.bahai.org/r/193393559",134],["One who performeth neither good deeds nor acts of worship is like unto a tree which beareth no fruit, and an action which leaveth no trace.","Bahá’u’lláh","The Importance of Obligatory Prayer and Fasting, 1. From the Writings of Bahá’u’lláh","https://www.bahai.org/r/191637900",135],["All the teachings are one reality, for reality is single and does not admit multiplicity. Therefore, the divine Prophets are one, inasmuch as They reveal the one reality, the Word of God.","‘Abdu’l-Bahá","The Promulgation of Universal Peace, 103","https://www.bahai.org/r/588901888",136],["There are imperfections in every human being, and you will always become unhappy if you look toward the people themselves. But if you look toward God, you will love them and be kind to them, for the world of God is the world of perfection and complete mercy.","‘Abdu’l-Bahá","The Promulgation of Universal Peace, 39","https://www.bahai.org/r/424700415",137],["Love is the most great law that ruleth this mighty and heavenly cycle, the unique power that bindeth together the divers elements of this material world, the supreme magnetic force that directeth the movements of the spheres in the celestial realms.","‘Abdu’l-Bahá","Selections from the Writings of ‘Abdu’l‑Bahá, 12","https://www.bahai.org/r/407306067",138],["Furthermore, know ye that God has created in man the power of reason, whereby man is enabled to investigate reality. God has not intended man to imitate blindly his fathers and ancestors. He has endowed him with mind, or the faculty of reasoning, by the exercise of which he is to investigate and discover the truth, and that which he finds real and true he must accept.","‘Abdu’l-Bahá","The Promulgation of Universal Peace, 97","https://www.bahai.org/r/922984742",139],["Briefly, all effort and exertion put forth by man from the fullness of his heart is worship, if it is prompted by the highest motives and the will to do service to humanity. This is worship: to serve mankind and to minister to the needs of the people. Service is prayer.","‘Abdu’l-Bahá","Paris Talks, Part Three, 55","https://www.bahai.org/r/160329759",140],["I charge you all that each one of you concentrate all the thoughts of your heart on love and unity. When a thought of war comes, oppose it by a stronger thought of peace. A thought of hatred must be destroyed by a more powerful thought of love. Thoughts of war bring destruction to all harmony, well-being, restfulness and content.","‘Abdu’l-Bahá","Paris Talks, Part One, 6","https://www.bahai.org/r/512608651",141],["It is obvious that all created things are connected one to another by a linkage complete and perfect, even, for example, as are the members of the human body.","‘Abdu’l-Bahá","Selections from the Writings of ‘Abdu’l‑Bahá, 21","https://www.bahai.org/r/189063524",142],["The purpose of the foregoing statements is to demonstrate at least this, that the happiness and greatness, the rank and station, the pleasure and peace, of an individual have never consisted in his personal wealth, but rather in his excellent character, his high resolve, the breadth of his learning, and his ability to solve difficult problems.","‘Abdu’l-Bahá","The Secret of Divine Civilization","https://www.bahai.org/r/137443519",143],["Every child is potentially the light of the world—and at the same time its darkness; wherefore must the question of education be accounted as of primary importance.","‘Abdu’l-Bahá","Selections from the Writings of ‘Abdu’l‑Bahá, 103","https://www.bahai.org/r/872286222",144],["Incline your inner ears to the voice of the peerless and self-subsisting Lord, that He may deliver you from the bonds of entanglement and the depths of darkness and enable you to attain the eternal light.","Bahá’u’lláh","The Tabernacle of Unity, 5","https://www.bahai.org/r/585395616",145],["O My brother! A pure heart is as a mirror; cleanse it with the burnish of love and severance from all save God, that the true sun may shine therein and the eternal morning dawn.","Bahá’u’lláh","The Call of the Divine Beloved, The Seven Valleys","https://www.bahai.org/r/248504405",146],["O Son of Man! Should prosperity befall thee, rejoice not, and should abasement come upon thee, grieve not, for both shall pass away and be no more.","Bahá’u’lláh","The Hidden Words, From the Arabic","https://www.bahai.org/r/118018611",147],["The first is the independent investigation of truth; for blind imitation of the past will stunt the mind. But once every soul inquireth into truth, society will be freed from the darkness of continually repeating the past.","‘Abdu’l-Bahá","Selections from the Writings of ‘Abdu’l‑Bahá, 202","https://www.bahai.org/r/721224234",148],["Illumine and hallow your hearts; let them not be profaned by the thorns of hate or the thistles of malice. Ye dwell in one world, and have been created through the operation of one Will. Blessed is he who mingleth with all men in a spirit of utmost kindliness and love.”","Bahá’u’lláh","Gleanings from the Writings of Bahá’u’lláh, CLVI","https://www.bahai.org/r/648789190",149],["Certain matters are subject to the free will of man, such as acting with justice and fairness, or injustice and iniquity—in other words, the choice of good or evil actions. It is clear and evident that the will of man figures greatly in these actions.","‘Abdu’l-Bahá","Some Answered Questions, 70","https://www.bahai.org/r/550346255",150],["Be generous in prosperity, and thankful in adversity. Be worthy of the trust of thy neighbor, and look upon him with a bright and friendly face. Be a treasure to the poor, an admonisher to the rich, an answerer of the cry of the needy, a preserver of the sanctity of thy pledge.","Bahá’u’lláh","Gleanings from the Writings of Bahá’u’lláh, CXXX","https://www.bahai.org/r/174232426",151],["The wisdom of the appearance of the spirit in the body is this: The human spirit is a divine trust which must traverse every degree, for traversing and passing through the degrees of existence is the means of its acquiring perfections.","‘Abdu’l-Bahá","Some Answered Questions, 52","https://www.bahai.org/r/049216831",152],["The essentials of the divine religion are one reality, indivisible and not multiple. It is one. And when through investigation we find it to be single, we have a basis for the oneness of the world of humanity.","‘Abdu’l-Bahá","The Promulgation of Universal Peace, 16","https://www.bahai.org/r/646065580",153],["May we indeed become mirrors reflecting the heavenly realities, and may we become so pure as to reflect the stars of heaven.","‘Abdu’l-Bahá","Paris Talks, Part Three, 54","https://www.bahai.org/r/514061648",154],["O Son of Earth! Know, verily, the heart wherein the least remnant of envy yet lingereth, shall never attain My everlasting dominion, nor inhale the sweet savors of holiness breathing from My kingdom of sanctity.","Bahá’u’lláh","The Hidden Words, From the Persian","https://www.bahai.org/r/909712031",156],["Be ye sincerely kind, not in appearance only.","‘Abdu’l-Bahá","Selections from the Writings of ‘Abdu’l‑Bahá, 1","https://www.bahai.org/r/159531595",157],["God has endowed man with intelligence so that he may safeguard and protect himself. Therefore, he must provide and surround himself with all that scientific skill can produce. He must be deliberate, thoughtful and thorough in his purposes, build the best ship and provide the most experienced captain; yet, withal, let him rely upon God and consider God as the one Keeper.","‘Abdu’l-Bahá","The Promulgation of Universal Peace, 19","https://www.bahai.org/r/249592157",158],["The imperfect eye beholds imperfections. The eye that covers faults looks toward the Creator of souls.","‘Abdu’l-Bahá","The Promulgation of Universal Peace, 39","https://www.bahai.org/r/424700415",159],["This faculty brings forth from the invisible plane the sciences and arts. Through the meditative faculty inventions are made possible, colossal undertakings are carried out; through it governments can run smoothly. Through this faculty man enters into the very Kingdom of God.","‘Abdu’l-Bahá","Paris Talks, Part Three, 54","https://www.bahai.org/r/346977748",160],["Fate is of two kinds: One is irrevocable and the other is conditional, or, as it is said, impending. Irrevocable fate is that which cannot be changed or altered, while conditional fate is that which may or may not occur.","‘Abdu’l-Bahá","Some Answered Questions, 68","https://www.bahai.org/r/721471381",161],["It is evident, therefore, that man is dual in aspect: as an animal he is subject to nature, but in his spiritual or conscious being he transcends the world of material existence. His spiritual powers, being nobler and higher, possess virtues of which nature intrinsically has no evidence; therefore, they triumph over natural conditions.","‘Abdu’l-Bahá","The Promulgation of Universal Peace, 35","https://www.bahai.org/r/957159704",162],["In man there are two natures: his spiritual or higher nature and his material or lower nature. In one he approaches God, in the other he lives for the world alone. Signs of both these natures are to be found in men.","‘Abdu’l-Bahá","Paris Talks, Part One, 18","https://www.bahai.org/r/165303977",163],["While the children are yet in their infancy feed them from the breast of heavenly grace, foster them in the cradle of all excellence, rear them in the embrace of bounty. Give them the advantage of every useful kind of knowledge. Let them share in every new and rare and wondrous craft and art. Bring them up to work and strive, and accustom them to hardship. Teach them to dedicate their lives to matters of great import, and inspire them to undertake studies that will benefit mankind.","‘Abdu’l-Bahá","Selections from the Writings of ‘Abdu’l‑Bahá, 102","https://www.bahai.org/r/565291146",164],["Know that it is one of the most abstruse questions of divinity that the world of existence—that is, this endless universe—has no beginning.","‘Abdu’l-Bahá","Some Answered Questions, 47","https://www.bahai.org/r/073362695",165],["Didst thou behold immortal sovereignty, thou wouldst strive to pass from this fleeting world. But to conceal the one from thee and to reveal the other is a mystery which none but the pure in heart can comprehend.","Bahá’u’lláh","The Hidden Words, From the Persian","https://www.bahai.org/r/228576295",166],["Knowledge is as wings to man’s life, and a ladder for his ascent. Its acquisition is incumbent upon everyone.","Bahá’u’lláh","Tablets of Bahá’u’lláh, Tajallíyát","https://www.bahai.org/r/545757614",167],["Intone, O My servant, the verses of God that have been received by thee, as intoned by them who have drawn nigh unto Him, that the sweetness of thy melody may kindle thine own soul, and attract the hearts of all men.","Bahá’u’lláh","Bahá’í Prayers","https://www.bahai.org/r/358258487",168],["The Great Being saith: The heaven of divine wisdom is illumined with the two luminaries of consultation and compassion. Take ye counsel together in all matters, inasmuch as consultation is the lamp of guidance which leadeth the way, and is the bestower of understanding.","Bahá’u’lláh","Tablets of Bahá’u’lláh, Lawḥ-i-Maqṣúd","https://www.bahai.org/r/545364905",169],["Every word that proceedeth out of the mouth of God is endowed with such potency as can instill new life into every human frame, if ye be of them that comprehend this truth.","Bahá’u’lláh","Gleanings from the Writings of Bahá’u’lláh, LXXIV","https://www.bahai.org/r/043743455",170],["He will never deal unjustly with anyone, neither will He task a soul beyond its power. He, verily, is the Compassionate, the All-Merciful.","Bahá’u’lláh","Gleanings from the Writings of Bahá’u’lláh, LII","https://www.bahai.org/r/043258227",171],["O contending peoples and kindreds of the earth! Set your faces towards unity, and let the radiance of its light shine upon you. Gather ye together, and for the sake of God resolve to root out whatever is the source of contention amongst you.","Bahá’u’lláh","Gleanings from the Writings of Bahá’u’lláh, CXI","https://www.bahai.org/r/407719266",172],["To be kind to everyone, and show forth affection to every living soul.","‘Abdu’l-Bahá","Paris Talks, Part One, 24","https://www.bahai.org/r/153694339",173],["O Son of Man! For everything there is a sign. The sign of love is fortitude under My decree and patience under My trials.","Bahá’u’lláh","The Hidden Words, From the Arabic","https://www.bahai.org/r/200697020",174],["Shed the light of a boundless love on every human being whom you meet, whether of your country, your race, your political party, or of any other nation, color or shade of political opinion.","‘Abdu’l-Bahá","Paris Talks, Part One, 9","https://www.bahai.org/r/235106336",175],["Therefore, we learn that nearness to God is possible through devotion to Him, through entrance into the Kingdom and service to humanity; it is attained by unity with mankind and through loving-kindness to all; it is dependent upon investigation of truth, acquisition of praiseworthy virtues, service in the cause of universal peace and personal sanctification.","‘Abdu’l-Bahá","The Promulgation of Universal Peace, 55","https://www.bahai.org/r/166983701",176],["O ye beloved of the Lord! Strive to become the manifestations of the love of God, the lamps of divine guidance shining amongst the kindreds of the earth with the light of love and concord.","‘Abdu’l-Bahá","Selections from the Writings of ‘Abdu’l‑Bahá, 12","https://www.bahai.org/r/305304502",177],["Therefore, do not look at the shortcomings of anybody; see with the sight of forgiveness.","‘Abdu’l-Bahá","The Promulgation of Universal Peace, 39","https://www.bahai.org/r/424700415",178],["Wealth is praiseworthy in the highest degree, if it is acquired by an individual’s own efforts and the grace of God, in commerce, agriculture, art and industry, and if it be expended for philanthropic purposes.","‘Abdu’l-Bahá","The Secret of Divine Civilization","https://www.bahai.org/r/753844522",179],["The same thing applies to the spirit of man. Though death destroy his body, it has no power over his spirit—this is eternal, everlasting, both birthless and deathless.","‘Abdu’l-Bahá","Paris Talks, Part One, 20","https://www.bahai.org/r/798976726",180],["The connection between God and His creation is that of the originator and the originated, of the sun and the dark bodies of the universe, of the craftsman and his handiwork.","‘Abdu’l-Bahá","Some Answered Questions, 53","https://www.bahai.org/r/419052045",181],["Be thou not unhappy; the tempest of sorrow shall pass; regret will not last; disappointment will vanish; the fire of the love of God will become enkindled, and the thorns and briars of sadness and despondency will be consumed!","‘Abdu’l-Bahá","Family Life, III. Enhancing Family Life","https://www.bahai.org/r/059660296",182],["But with the human soul, there is no decline. Its only movement is towards perfection; growth and progress alone constitute the motion of the soul.\n\nDivine perfection is infinite, therefore the progress of the soul is also infinite.","‘Abdu’l-Bahá","Paris Talks, Part One, 29","https://www.bahai.org/r/610561417",183],["The first teaching of Bahá’u’lláh is the duty incumbent upon all to investigate reality. What does it mean to investigate reality? It means that man must forget all hearsay and examine truth himself, for he does not know whether statements he hears are in accordance with reality or not.","‘Abdu’l-Bahá","The Promulgation of Universal Peace, 26","https://www.bahai.org/r/502326955",184],["My calamity is My providence, outwardly it is fire and vengeance, but inwardly it is light and mercy. Hasten thereunto that thou mayest become an eternal light and an immortal spirit.","Bahá’u’lláh","The Hidden Words, From the Arabic","https://www.bahai.org/r/746355706",185],["For man two wings are necessary. One wing is physical power and material civilization; the other is spiritual power and divine civilization. With one wing only, flight is impossible. Two wings are essential.","‘Abdu’l-Bahá","The Promulgation of Universal Peace, 5","https://www.bahai.org/r/202957535",186],["By the power of the Holy Spirit, working through his soul, man is able to perceive the Divine reality of things. All great works of art and science are witnesses to this power of the Spirit.","‘Abdu’l-Bahá","Paris Talks, Part One, 28","https://www.bahai.org/r/378388238",187],["In this Day whatsoever serveth to reduce blindness and to increase vision is worthy of consideration. This vision acteth as the agent and guide for true knowledge. Indeed in the estimation of men of wisdom keenness of understanding is due to keenness of vision.","Bahá’u’lláh","Tablets of Bahá’u’lláh, Ṭarázát","https://www.bahai.org/r/489268445",188],["The human heart resembleth a mirror. When this is purified human hearts are attuned and reflect one another, and thus spiritual emotions are generated. This is like the world of dreams when man is detached from things which are tangible and experienceth those of the spirit.","‘Abdu’l-Bahá","Selections from the Writings of ‘Abdu’l‑Bahá, 70","https://www.bahai.org/r/237722625",189],["Beware lest ye offend any heart, lest ye speak against anyone in his absence, lest ye estrange yourselves from the servants of God.","‘Abdu’l-Bahá","The Promulgation of Universal Peace, 140","https://www.bahai.org/r/013867831",190],["O Lord! Whether traveling or at home, and in my occupation or in my work, I place my whole trust in Thee.","The Báb","Selections from the Writings of the Báb, Prayers and Meditations","https://www.bahai.org/r/710611493",191],["He says, “Thy heart is My home; sanctify it for My descent. Thy spirit is My place of revelation; cleanse it for My manifestation.”","Bahá’u’lláh","The Promulgation of Universal Peace, 55","https://www.bahai.org/r/166983701",192],["If God did not love all, He would not have created, trained and provided for all. Loving-kindness is the divine policy.","‘Abdu’l-Bahá","The Promulgation of Universal Peace, 47","https://www.bahai.org/r/518834382",193],["To every discerning and illumined heart it is evident that God, the unknowable Essence, the divine Being, is immensely exalted beyond every human attribute, such as corporeal existence, ascent and descent, egress and regress. Far be it from His glory that human tongue should adequately recount His praise, or that human heart comprehend His fathomless mystery.","Bahá’u’lláh","The Kitáb-i-Íqán, Part Two","https://www.bahai.org/r/647258180",194],["The world of humanity has two wings—one is women and the other men. Not until both wings are equally developed can the bird fly. Should one wing remain weak, flight is impossible.","‘Abdu’l-Bahá","Tablets to The Hague, First Tablet to The Hague","https://www.bahai.org/r/960386727",195],["As for the mind, it is the power of the human spirit. The spirit is as the lamp, and the mind as the light that shines from it. The spirit is as the tree, and the mind as the fruit.","‘Abdu’l-Bahá","Some Answered Questions, 55","https://www.bahai.org/r/152204731",196],["The light of a good character surpasseth the light of the sun and the radiance thereof.”","Bahá’u’lláh","The Advent of Divine Justice","https://www.bahai.org/r/716325250",197],["Unity is the expression of the loving power of God and reflects the reality of Divinity. It is resplendent in this Day through the bestowals of light upon humanity.","‘Abdu’l-Bahá","The Promulgation of Universal Peace, 6","https://www.bahai.org/r/303484764",198],["Let your thoughts dwell on your own spiritual development, and close your eyes to the deficiencies of other souls.","‘Abdu’l-Bahá","Selections from the Writings of ‘Abdu’l‑Bahá, 174","https://www.bahai.org/r/218828736",199],["Whatever hath befallen you, hath been for the sake of God. This is the truth, and in this there is no doubt. You should, therefore, leave all your affairs in His Hands, place your trust in Him, and rely upon Him. He will assuredly not forsake you. In this, likewise, there is no doubt.","Bahá’u’lláh","Crisis and Victory","https://www.bahai.org/r/872284743",200],["Close your eyes to racial differences, and welcome all with the light of oneness.”","Bahá’u’lláh","The Advent of Divine Justice","https://www.bahai.org/r/486554855",201],["O Moving Form of Dust! I desire communion with thee, but thou wouldst put no trust in Me. The sword of thy rebellion hath felled the tree of thy hope. At all times I am near unto thee, but thou art ever far from Me.","Bahá’u’lláh","The Hidden Words, From the Persian","https://www.bahai.org/r/492712156",202],["For the world of humanity consists of two parts or members: one is woman; the other is man. Until these two members are equal in strength, the oneness of humanity cannot be established, and the happiness and felicity of mankind will not be a reality.","‘Abdu’l-Bahá","The Promulgation of Universal Peace, 32","https://www.bahai.org/r/639655865",203],["Your souls are as waves on the sea of the spirit; although each individual is a distinct wave, the ocean is one, all are united in God.","‘Abdu’l-Bahá","Paris Talks, Part One, 28","https://www.bahai.org/r/701435603",204],["Consider thy state when asleep. Verily, I say, this phenomenon is the most mysterious of the signs of God amongst men, were they to ponder it in their hearts. Behold how the thing which thou hast seen in thy dream is, after a considerable lapse of time, fully realized.","Bahá’u’lláh","Tablets of Bahá’u’lláh, Súriy-i-Vafá 1","https://www.bahai.org/r/861851575",205],["These are effectual and sufficient proofs that the conscience of man is sacred and to be respected; and that liberty thereof produces widening of ideas, amendment of morals, improvement of conduct, disclosure of the secrets of creation, and manifestation of the hidden verities of the contingent world.","‘Abdu’l-Bahá","A Traveler’s Narrative","https://www.bahai.org/r/628356479",206],["Among these teachings was the independent investigation of reality so that the world of humanity may be saved from the darkness of imitation and attain to the truth; may tear off and cast away this ragged and outgrown garment of a thousand years ago and may put on the robe woven in the utmost purity and holiness in the loom of reality.","‘Abdu’l-Bahá","Tablets to The Hague, First Tablet to The Hague","https://www.bahai.org/r/238114283",207],["A humble man without learning, but filled with the Holy Spirit, is more powerful than the most nobly-born profound scholar without that inspiration. He who is educated by the Divine Spirit can, in his time, lead others to receive the same Spirit.","‘Abdu’l-Bahá","Paris Talks, Part Two, 51","https://www.bahai.org/r/655260093",208],["So shall we see the truth in all religions, for truth is in all and truth is one!","‘Abdu’l-Bahá","Paris Talks, Part Two, 41","https://www.bahai.org/r/903780732",209],["Know thou of a truth that the soul, after its separation from the body, will continue to progress until it attaineth the presence of God, in a state and condition which neither the revolution of ages and centuries, nor the changes and chances of this world, can alter.","Bahá’u’lláh","Gleanings from the Writings of Bahá’u’lláh, LXXXI","https://www.bahai.org/r/098486368",210],["Immeasurably exalted art Thou, O Lord! Protect us from what lieth in front of us and behind us, above our heads, on our right, on our left, below our feet and every other side to which we are exposed. Verily, Thy protection over all things is unfailing.","The Báb","Bahá’í Prayers, General Prayers","https://www.bahai.org/r/061330211",211],["God is merciful. In His mercy He answers the prayers of all His servants when according to His supreme wisdom it is necessary.","‘Abdu’l-Bahá","The Promulgation of Universal Peace, 87","https://www.bahai.org/r/153306933",213],["That which we imagine is not the Reality of God; He, the Unknowable, the Unthinkable, is far beyond the highest conception of man.","‘Abdu’l-Bahá","Paris Talks, Part One, 5","https://www.bahai.org/r/189621195",214],["Turn thy sight unto thyself, that thou mayest find Me standing within thee, mighty, powerful and self-subsisting.","Bahá’u’lláh","The Hidden Words, From the Arabic","https://www.bahai.org/r/511421653",215],["We ask God to endow human souls with justice so that they may be fair, and may strive to provide for the comfort of all, that each member of humanity may pass his life in the utmost comfort and welfare.","‘Abdu’l-Bahá","The Promulgation of Universal Peace, 102","https://www.bahai.org/r/065459055",216],["The essence of these words is this: they that tread the path of faith, they that thirst for the wine of certitude, must cleanse themselves of all that is earthly—their ears from idle talk, their minds from vain imaginings, their hearts from worldly affections, their eyes from that which perisheth.","Bahá’u’lláh","The Kitáb-i-Íqán, Part One","https://www.bahai.org/r/966025582",217],["The welfare of any segment of humanity is inextricably bound up with the welfare of the whole.","The Universal House of Justice","Social Action","https://www.bahai.org/r/977812601",218],["Beware lest ye prefer yourselves above your neighbors. Fix your gaze upon Him Who is the Temple of God amongst men. He, in truth, hath offered up His life as a ransom for the redemption of the world. He, verily, is the All-Bountiful, the Gracious, the Most High. If any differences arise amongst you, behold Me standing before your face, and overlook the faults of one another for My name’s sake and as a token of your love for My manifest and resplendent Cause.","Bahá’u’lláh","Gleanings from the Writings of Bahá’u’lláh, CXLVI","https://www.bahai.org/r/576176748",219],["We must now highly resolve to arise and lay hold of all those instrumentalities that promote the peace and well-being and happiness, the knowledge, culture and industry, the dignity, value and station, of the entire human race.","‘Abdu’l-Bahá","The Secret of Divine Civilization","https://www.bahai.org/r/483233156",220],["The utterance of God is a lamp, whose light is these words: Ye are the fruits of one tree, and the leaves of one branch. Deal ye one with another with the utmost love and harmony, with friendliness and fellowship.","Bahá’u’lláh","Gleanings from the Writings of Bahá’u’lláh, CXXXII","https://www.bahai.org/r/487380847",221],["The fleeting hours of man’s life on earth pass swiftly by and the little that still remaineth shall come to an end, but that which endureth and lasteth for evermore is the fruit that man reapeth from his servitude at the Divine Threshold.","‘Abdu’l-Bahá","Selections from the Writings of ‘Abdu’l‑Bahá, 194","https://www.bahai.org/r/191245795",222],["O Ye Rich Ones on Earth! The poor in your midst are My trust; guard ye My trust, and be not intent only on your own ease.","Bahá’u’lláh","The Hidden Words, From the Persian","https://www.bahai.org/r/278984163",223],["This strong admonition is further reiterated in His last work, “the Book of My Covenant”: “Verily I say, the tongue is for mentioning what is good, defile it not with unseemly talk. God hath forgiven what is past. Henceforward everyone should utter that which is meet and seemly, and should refrain from slander, abuse and whatever causeth sadness in men.”","Bahá’u’lláh","The Kitáb-i-Aqdas, Notes","https://www.bahai.org/r/392967566",224],["Thy name is my healing, O my God, and remembrance of Thee is my remedy. Nearness to Thee is my hope, and love for Thee is my companion.","Bahá’u’lláh","Prayers and Meditations by Bahá’u’lláh, CLXX","https://www.bahai.org/r/592718462",225],["O Son of Spirit! I created thee rich, why dost thou bring thyself down to poverty? Noble I made thee, wherewith dost thou abase thyself?","Bahá’u’lláh","The Hidden Words, From the Arabic","https://www.bahai.org/r/511421653",226],["A man who does great good, and talks not of it, is on the way to perfection.","‘Abdu’l-Bahá","Paris Talks, Part One, 1","https://www.bahai.org/r/937602921",227],["Verily God hath made adversity as a morning dew upon His green pasture, and a wick for His lamp which lighteth earth and heaven.","Bahá’u’lláh","The Summons of the Lord of Hosts, Súriy-i-Haykal","https://www.bahai.org/r/555580261",228],["“I swear by My life! Nothing save that which profiteth them can befall My loved ones. To this testifieth the Pen of God, the Most Powerful, the All-Glorious, the Best Beloved.”","Bahá’u’lláh","The Advent of Divine Justice","https://www.bahai.org/r/900554691",229],["No matter how far the material world advances, it cannot establish the happiness of mankind. Only when material and spiritual civilization are linked and
